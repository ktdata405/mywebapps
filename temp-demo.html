<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Form — Save to MongoDB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1b2a44 0%, #05080f 55%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .card {
            width: min(520px, 100%);
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 28px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }
        .card-header {
            padding: 32px 28px;
            background: linear-gradient(180deg, rgba(79, 70, 229, 0.16), transparent 90%);
        }
        .card-header h1 {
            margin: 0;
            font-size: 1.95rem;
            letter-spacing: -0.03em;
        }
        .card-header p {
            margin: 12px 0 0;
            color: #cbd5e1;
            line-height: 1.7;
        }
        .card-body {
            padding: 28px;
            display: grid;
            gap: 20px;
        }
        .field {
            display: grid;
            gap: 8px;
        }
        .field label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.13em;
            color: #94a3b8;
            font-weight: 700;
        }
        .field input {
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.7);
            color: #f8fafc;
            font-size: 1rem;
            padding: 14px 16px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .field input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
        }
        .actions button {
            border: none;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .actions button:hover {
            transform: translateY(-1px);
        }
        .submit-button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 18px 40px rgba(99, 102, 241, 0.22);
        }
        .secondary-button {
            background: rgba(148, 163, 184, 0.08);
            color: #cbd5e1;
        }
        .status {
            min-height: 48px;
            border-radius: 18px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.98rem;
            border: 1px solid rgba(148, 163, 184, 0.12);
            background: rgba(15, 23, 42, 0.65);
        }
        .status.success {
            border-color: rgba(22, 163, 74, 0.24);
            background: rgba(22, 163, 74, 0.12);
            color: #ecfccb;
        }
        .status.error {
            border-color: rgba(239, 68, 68, 0.24);
            background: rgba(239, 68, 68, 0.12);
            color: #fee2e2;
        }
        .status.hidden {
            display: none;
        }
        .status span {
            line-height: 1.4;
        }
        .status .loader {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .hint {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h1>Demo MongoDB Form</h1>
            <p>Enter sample details and save them to MongoDB for demo purposes. The data is sent to the server and inserted into the MongoDB collection.</p>
        </div>
        <div class="card-body">
            <div class="field">
                <label for="first-name">First Name</label>
                <input id="first-name" type="text" placeholder="Enter first name" autocomplete="given-name" />
            </div>
            <div class="field">
                <label for="last-name">Last Name</label>
                <input id="last-name" type="text" placeholder="Enter last name" autocomplete="family-name" />
            </div>
            <div class="field">
                <label for="mobile-number">Mobile Number</label>
                <input id="mobile-number" type="tel" placeholder="Enter mobile number" autocomplete="tel" />
                <div class="hint">Use digits only, e.g. 9876543210.</div>
            </div>
            <div class="actions">
                <button class="submit-button" id="save-btn">Save to MongoDB</button>
                <button class="secondary-button" id="clear-btn" type="button">Clear</button>
            </div>
            <div id="status" class="status hidden"></div>
        </div>
    </div>

    <script>
        const saveBtn = document.getElementById('save-btn');
        const clearBtn = document.getElementById('clear-btn');
        const statusEl = document.getElementById('status');

        function setStatus(message, type = 'success') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.classList.remove('hidden');
        }

        function clearStatus() {
            statusEl.className = 'status hidden';
            statusEl.textContent = '';
        }

        function resetForm() {
            document.getElementById('first-name').value = '';
            document.getElementById('last-name').value = '';
            document.getElementById('mobile-number').value = '';
            clearStatus();
        }

        function buildPayload() {
            return {
                firstName: document.getElementById('first-name').value.trim(),
                lastName: document.getElementById('last-name').value.trim(),
                mobile: document.getElementById('mobile-number').value.trim()
            };
        }

        async function saveData() {
            clearStatus();
            const payload = buildPayload();

            if (!payload.firstName || !payload.lastName || !payload.mobile) {
                setStatus('Please fill in all fields before saving.', 'error');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const response = await fetch('/api/temp-mongo-save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                let result = null;
                try {
                    result = await response.json();
                } catch (_) {
                    result = null;
                }

                if (!response.ok) {
                    let message = `Save failed with status ${response.status}.`;
                    if (response.status === 404) {
                        message = 'Backend API not found. Start the local dev server with `npm run dev` or deploy the API route.';
                    } else if (response.status === 405) {
                        message = 'Wrong method used. The API expects POST requests.';
                    }
                    if (result && result.message) {
                        message = result.message;
                    }
                    throw new Error(message);
                }

                if (!result || !result.ok) {
                    throw new Error(result?.message || 'Save failed. Invalid response from server.');
                }

                setStatus(`Saved successfully. ID: ${result.insertedId}`, 'success');
                saveBtn.textContent = 'Saved';
            } catch (error) {
                setStatus(error.message || 'Failed to save demo data.', 'error');
                saveBtn.textContent = 'Save to MongoDB';
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save to MongoDB';
            }
        }

        saveBtn.addEventListener('click', (event) => {
            event.preventDefault();
            saveData();
        });

        clearBtn.addEventListener('click', () => {
            resetForm();
        });
    </script>
</body>
</html>
