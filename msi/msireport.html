<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#09090b">
    <title data-translate-key="msiReportTitle">MSI Report</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #09090b;
            --bg-card: #18181b;
            --bg-card-hover: #27272a;

            --primary: #0ea5e9; /* Sky Blue */
            --primary-glow: rgba(14, 165, 233, 0.5);

            --accent-1: #06b6d4; /* Cyan */
            --accent-2: #f43f5e; /* Rose */
            --accent-3: #10b981; /* Emerald */

            --text-main: #fafafa;
            --text-muted: #a1a1aa;

            --border: #27272a;
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.1), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.08), transparent 25%);
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .icon-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        /* Main Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
        }

        /* Hero Section */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .balance-card {
            background: linear-gradient(145deg, var(--bg-card), #131316);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            opacity: 0.4;
            filter: blur(40px);
        }

        .balance-label {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .balance-amount {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-meta {
            display: flex;
            gap: 1.5rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .trend-up { color: var(--accent-3); }

        /* Controls Card (Tabs + Month Nav) */
        .controls-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            background: rgba(255,255,255,0.03);
            padding: 0.5rem;
            border-radius: 16px;
            width: fit-content;
            border: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        /* Month Nav */
        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 0.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            gap: 1rem;
        }

        /* Content Views */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Overview Header (Invested Block) */
        .overview-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        /* Platform Cards (Grid View) */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .platform-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            transition: transform 0.3s, border-color 0.3s;
        }

        .platform-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .pc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .pc-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .pc-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .pc-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .pc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .pc-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .pc-item:last-child { border-bottom: none; }
        .pc-item span:first-child { color: var(--text-muted); }

        /* Table View */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            max-width: 100%;
        }

        .table-wrapper {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            max-width: 100%;
            overscroll-behavior-x: contain;
            --period-col-width: 170px;
            --total-col-width: 140px;
        }

        .history-subtabs {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .history-subtabs::-webkit-scrollbar { display: none; }

        .history-filterbar {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
            padding: 0.65rem 0.75rem;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }

        .history-filter-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            min-width: 0;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .history-filter-select {
            border: 1px solid var(--border);
            background: #141418;
            color: #ececf1;
            border-radius: 10px;
            padding: 0.35rem 0.55rem;
            font-size: 0.78rem;
            font-weight: 600;
            min-width: 0;
        }

        .history-subtab {
            border: 1px solid var(--border);
            background: #151519;
            color: var(--text-muted);
            border-radius: 999px;
            padding: 0.45rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .history-subtab.active {
            color: #fafafa;
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.18);
            box-shadow: inset 0 0 0 1px rgba(99, 102, 241, 0.25);
        }

        table {
            width: max-content;
            min-width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            line-height: 1.4;
        }

        #dataTable th:not(.col-period):not(.col-total),
        #dataTable td:not(.col-period):not(.col-total) {
            min-width: 92px;
        }

        th, td {
            padding: 0.9rem 1.15rem;
            text-align: right;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            background: #202024;
            color: #d4d4dc;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
        }

        td {
            color: #e4e4e7;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .hdr-group {
            text-align: center;
            font-size: 0.72rem;
            font-weight: 700;
            background: #202024;
            color: #f4f4f5;
            border-bottom: 1px solid var(--border);
        }

        .hdr-field {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            background: #202024;
            border-bottom: 1px solid var(--border);
        }

        .cat-start {
            border-left: 2px solid rgba(255, 255, 255, 0.08);
        }

        .col-period,
        .col-total {
            background: #202024;
            z-index: 30;
        }

        th.col-period,
        td.col-period,
        th.col-total,
        td.col-total {
            text-align: left;
            position: sticky;
            z-index: 20;
            box-shadow: 1px 0 0 rgba(255, 255, 255, 0.06);
        }

        th.col-period,
        td.col-period {
            left: 0;
            min-width: var(--period-col-width);
            max-width: var(--period-col-width);
        }

        th.col-total,
        td.col-total {
            left: var(--period-col-width);
            min-width: var(--total-col-width);
            max-width: var(--total-col-width);
        }

        td.col-period,
        td.col-total {
            background: #111114;
        }

        td.col-total {
            color: var(--primary);
            font-weight: 700;
        }

        /* ── Alternating rows: background ── */
        tbody tr.tx-row-odd td  { background: rgba(255,255,255,0.01); }
        tbody tr.tx-row-even td { background: rgba(255,255,255,0.04); }

        /* ── Alternating rows: Period text color ── */
        tbody tr.tx-row-odd  td.col-period span  { color: #c4b5fd; } /* soft violet */
        tbody tr.tx-row-even td.col-period span  { color: #7dd3fc; } /* soft sky-blue */

        /* ── Alternating rows: Total text color ── */
        tbody tr.tx-row-odd  td.col-total { color: #a5f3fc; } /* cyan */
        tbody tr.tx-row-even td.col-total { color: #86efac; } /* green */

        tbody tr:hover td {
            background: rgba(14, 165, 233, 0.10);
        }

        tbody tr:hover td.col-period,
        tbody tr:hover td.col-total {
            background: #17171b;
        }

        .tx-cell {
            color: #9ca3af;
        }

        /* ── Alternating row: value cell text contrast ── */
        tbody tr.tx-row-odd  td.tx-cell.has-value { color: #f0e6ff; font-weight: 650; } /* soft lavender */
        tbody tr.tx-row-even td.tx-cell.has-value { color: #e0f2fe; font-weight: 650; } /* soft ice-blue */

        .tx-cell.is-zero { color: #52525b; }

        .row-edit-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            cursor: pointer;
            padding: 4px;
        }

        .row-edit-btn:hover { color: #f4f4f5; }

        /* ── Category cell: background + alternating value text colors ── */

        /* Zerodha Coin – blue */
        tbody tr.tx-row-odd  td.tx-cell.cat-coin             { background: rgba(59,130,246,0.06); }
        tbody tr.tx-row-even td.tx-cell.cat-coin             { background: rgba(59,130,246,0.12); }
        tbody tr.tx-row-odd  td.tx-cell.cat-coin.has-value   { color: #60a5fa; } /* blue-400 */
        tbody tr.tx-row-even td.tx-cell.cat-coin.has-value   { color: #bfdbfe; } /* blue-200 */

        /* Groww – green */
        tbody tr.tx-row-odd  td.tx-cell.cat-groww            { background: rgba(16,185,129,0.06); }
        tbody tr.tx-row-even td.tx-cell.cat-groww            { background: rgba(16,185,129,0.12); }
        tbody tr.tx-row-odd  td.tx-cell.cat-groww.has-value  { color: #34d399; } /* emerald-400 */
        tbody tr.tx-row-even td.tx-cell.cat-groww.has-value  { color: #a7f3d0; } /* emerald-200 */

        /* Govt. Schemes – amber */
        tbody tr.tx-row-odd  td.tx-cell.cat-govt             { background: rgba(245,158,11,0.06); }
        tbody tr.tx-row-even td.tx-cell.cat-govt             { background: rgba(245,158,11,0.12); }
        tbody tr.tx-row-odd  td.tx-cell.cat-govt.has-value   { color: #fbbf24; } /* amber-400 */
        tbody tr.tx-row-even td.tx-cell.cat-govt.has-value   { color: #fde68a; } /* amber-200 */

        /* NJ Wealth – red */
        tbody tr.tx-row-odd  td.tx-cell.cat-nj               { background: rgba(239,68,68,0.06); }
        tbody tr.tx-row-even td.tx-cell.cat-nj               { background: rgba(239,68,68,0.12); }
        tbody tr.tx-row-odd  td.tx-cell.cat-nj.has-value     { color: #f87171; } /* red-400 */
        tbody tr.tx-row-even td.tx-cell.cat-nj.has-value     { color: #fecaca; } /* red-200 */

        /* INDMoney – violet */
        tbody tr.tx-row-odd  td.tx-cell.cat-indmoney              { background: rgba(139,92,246,0.06); }
        tbody tr.tx-row-even td.tx-cell.cat-indmoney              { background: rgba(139,92,246,0.12); }
        tbody tr.tx-row-odd  td.tx-cell.cat-indmoney.has-value    { color: #a78bfa; } /* violet-400 */
        tbody tr.tx-row-even td.tx-cell.cat-indmoney.has-value    { color: #ddd6fe; } /* violet-200 */

        .val-positive { color: var(--text-main); }
        .val-zero { color: #52525b; }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero-grid { grid-template-columns: 1fr; }
            .balance-amount { font-size: 2.5rem; }
        }

        @media (max-width: 768px) {
            .navbar { padding: 1rem; }
            .container { padding: 0.75rem; }
            .balance-card { padding: 1.5rem; }
            .balance-amount { font-size: 2rem; }
            .tabs { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
            .tabs::-webkit-scrollbar { display: none; }
            .controls-card { padding: 1rem; gap: 1rem; }

            /* Fix for eye icon in mobile view */
            .balance-label button {
                padding: 10px;
                min-width: 44px;
                min-height: 44px;
            }

            /* Month nav - full width */
            .month-nav {
                width: 100%;
                justify-content: space-between;
            }

            /* Platform grid - single column on small phones */
            .platform-grid {
                grid-template-columns: 1fr;
            }

            .controls-stack {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }

            .controls-stack > .icon-btn {
                align-self: center;
            }

            .controls-stack .meta-item {
                width: 100%;
                justify-content: center;
            }

            /* Table responsive */
            .table-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .history-subtabs {
                padding: 0.625rem;
                gap: 0.4rem;
            }

            .history-subtab {
                font-size: 0.7rem;
                padding: 0.4rem 0.7rem;
            }

            .history-filterbar {
                padding: 0.55rem 0.625rem;
                gap: 0.5rem;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                align-items: stretch;
            }

            .history-filter-item {
                font-size: 0.68rem;
                gap: 0.35rem;
                width: 100%;
            }

            .history-filter-select {
                font-size: 0.72rem;
                padding: 0.32rem 0.5rem;
                width: 100%;
            }

            th, td {
                padding: 0.75rem 1rem;
                font-size: 0.8rem;
            }

            .table-wrapper {
                --period-col-width: 132px;
                --total-col-width: 104px;
            }

            /* Hero grid balance amount */
            .balance-amount { font-size: 1.75rem; }

            /* Meta items wrap */
            .balance-meta {
                flex-wrap: wrap;
                gap: 0.75rem;
                justify-content: center;
            }

            .meta-item {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }

            /* Tab buttons - ensure enough touch area */
            .tab-btn {
                padding: 0.625rem 1rem;
                min-height: 44px;
                white-space: nowrap;
            }

            /* Icon buttons touch targets */
            .icon-btn {
                min-width: 44px;
                min-height: 44px;
            }

            /* User select full width */
            .user-select-container {
                width: 100%;
                flex-direction: column;
                gap: 0.5rem;
            }

            .user-select {
                width: 100%;
            }

            /* navbar brand text */
            .brand { font-size: 1.25rem; }

            /* nav actions */
            .nav-actions { gap: 0.5rem; }
        }

        @media (max-width: 480px) {
            .platform-grid {
                grid-template-columns: 1fr;
            }
            .history-filterbar {
                grid-template-columns: 1fr;
            }

            .table-wrapper {
                --period-col-width: 118px;
                --total-col-width: 92px;
            }

            #dataTable th:not(.col-period):not(.col-total),
            #dataTable td:not(.col-period):not(.col-total) {
                min-width: 82px;
            }

            .balance-amount { font-size: 1.5rem; }
            .container { padding: 0.5rem; }
            .navbar { padding: 0.75rem 0.5rem; }
        }

        /* Safe area support */
        body {
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Touch interactions */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        button, a {
            touch-action: manipulation;
        }

        /* iOS input zoom prevention */
        input, select, textarea {
            font-size: 16px !important;
        }

        /* Fix iOS momentum scrolling for table */
        .table-wrapper {
            -webkit-overflow-scrolling: touch;
        }

        /* ===== COMPREHENSIVE MOBILE ENHANCEMENTS ===== */

        /* Pull-to-refresh */
        .ptr-indicator {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 0.5rem);
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #18181b;
            border: 1px solid rgba(255,255,255,0.1);
            color: #a1a1aa;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 200;
            transition: transform 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .ptr-indicator.visible { transform: translateX(-50%) translateY(0); }
        .ptr-indicator.refreshing .ptr-icon { animation: ptr-spin 1s linear infinite; }
        @keyframes ptr-spin { to { transform: rotate(360deg); } }

        /* Toast notification */
        .kt-toast {
            position: fixed;
            bottom: calc(1.5rem + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #18181b;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fafafa;
            padding: 0.75rem 1.25rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 9999;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
            opacity: 0;
            white-space: nowrap;
            max-width: 92vw;
        }

        /* Balance card touch feedback */

        /* Skeleton for platform cards */

            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
        }
        .sk-line {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;

        @keyframes sk-shimmer { to { background-position: -200% 0; } }

        /* Bottom padding so FAB doesn't cover content */
        @media (max-width: 767px) {
            .container { padding-bottom: calc(5rem + env(safe-area-inset-bottom)) !important; }
        }

        /* Loader */
        #loader {
            position: fixed;

<script>
    // Configuration
    const SCRIPT_URL = CONFIG.GOOGLE_SHEET_URL_MSI;

    // Platform Config
    const PLATFORMS_KALYAN = {
        coin: { name: 'Zerodha Coin', icon: 'fa-solid fa-coins', color: '#3b82f6', fields: ['quantum_liquid', 'navi_nifty', 'invesco_small', 'axis_nifty', 'birla_nifty', 'dsp_nifty', 'edelweiss_bond'] },
        groww: { name: 'Groww', icon: 'fa-solid fa-seedling', color: '#10b981', fields: ['canara_small', 'quant_small', 'birla_psu', 'power_grid'] },
        govt: { name: 'Govt. Schemes', icon: 'fa-solid fa-landmark', color: '#f59e0b', fields: ['ppf', 'ssa', 'nps_tier1', 'nps_tier2'] },
        nj: { name: 'NJ Wealth', icon: 'fa-solid fa-briefcase', color: '#ef4444', fields: ['axis_midcap', 'dsp_midcap', 'invesco_midcap', 'kotak_emerging', 'nippon_growth'] }
    };

    const PLATFORMS_LAYAN = {
        indmoney: { name: 'INDMoney', icon: 'fa-solid fa-chart-line', color: '#8b5cf6', fields: ['ind_jio_flexi', 'ind_bandhan_small', 'ind_ntpc_green'] }
    };

    let CURRENT_PLATFORMS = PLATFORMS_KALYAN;

    const PALETTE = [
        '#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6',
        '#ec4899', '#06b6d4', '#84cc16', '#eab308', '#f97316',
        '#6366f1', '#14b8a6', '#d946ef', '#f43f5e', '#a855f7',
        '#22c55e', '#0ea5e9', '#facc15', '#fb7185', '#c084fc'
    ];

    // Assign unique color to each field
    const FIELD_COLORS = {};
    let colorIdx = 0;

    // Initialize colors for all possible fields
    [...Object.values(PLATFORMS_KALYAN), ...Object.values(PLATFORMS_LAYAN)].forEach(p => {
        p.fields.forEach(f => {
            FIELD_COLORS[f] = PALETTE[colorIdx % PALETTE.length];
            colorIdx++;
        });
    });

    const BANK_FIELDS = ['hdfc_bank', 'sbi_bank', 'icici_bank', 'axis_bank'];
    const COMMON_FIELDS = ['month', 'year', 'total_investment'];
    const FIELD_LABELS = {
        quantum_liquid: 'Quantum Liquid',
        navi_nifty: 'Navi Nifty 50',
        invesco_small: 'Invesco Small Cap',
        axis_nifty: 'Axis Nifty 50',
        birla_nifty: 'Birla Nifty 50',
        dsp_nifty: 'DSP Nifty 50',
        edelweiss_bond: 'Edelweiss Bond',
        canara_small: 'Canara Small Cap',
        quant_small: 'Quant Small Cap',
        birla_psu: 'Birla PSU',
        power_grid: 'Power Grid',
        ppf: 'PPF',
        ssa: 'SSA',
        nps_tier1: 'NPS Tier 1',
        nps_tier2: 'NPS Tier 2',
        axis_midcap: 'Axis Mid Cap',
        dsp_midcap: 'DSP Mid Cap',
        invesco_midcap: 'Invesco Mid Cap',
        kotak_emerging: 'Kotak Emerging',
        nippon_growth: 'Nippon Growth',
        ind_jio_flexi: 'Jio Flexi',
        ind_bandhan_small: 'Bandhan Small',
        ind_ntpc_green: 'NTPC Green'
    };
    const FIELD_ALIASES = {
        // Zerodha Coin
        quantum_liquid: ['quantum_liquid', 'coin_quantum_liquid'],
        navi_nifty: ['navi_nifty', 'coin_navi_nifty'],
        invesco_small: ['invesco_small', 'coin_invesco_small'],
        axis_nifty: ['axis_nifty', 'coin_axis_nifty'],
        birla_nifty: ['birla_nifty', 'coin_birla_nifty'],
        dsp_nifty: ['dsp_nifty', 'coin_dsp_nifty'],
        edelweiss_bond: ['edelweiss_bond', 'coin_edelweiss_bond'],

        // Groww
        canara_small: ['canara_small', 'coin_canara_small'],
        quant_small: ['quant_small', 'coin_quant_small'],
        birla_psu: ['birla_psu', 'coin_birla_psu'],
        power_grid: ['power_grid', 'coin_power_grid'],

        // Govt. Schemes
        ppf: ['ppf', 'ppf_account'],
        ssa: ['ssa', 'ssa_account'],
        nps_tier1: ['nps_tier1'],
        nps_tier2: ['nps_tier2'],

        // NJ Wealth
        axis_midcap: ['axis_midcap', 'nj_axis_midcap'],
        dsp_midcap: ['dsp_midcap', 'nj_dsp_midcap'],
        invesco_midcap: ['invesco_midcap', 'nj_invesco_midcap'],
        kotak_emerging: ['kotak_emerging', 'nj_kotak_emerging'],
        nippon_growth: ['nippon_growth', 'nj_nippon_growth'],

        // Layan
        ind_jio_flexi: ['ind_jio_flexi'],
        ind_bandhan_small: ['ind_bandhan_small'],
        ind_ntpc_green: ['ind_ntpc_green']
    };
    let globalData = [];
    const MONTH_ORDER = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
    let currentMonthIndex = -1;
    let currentTotalNetWorth = 0;
    let isNetWorthVisible = false;
    let currentHistoryCategory = 'all';
    let currentHistoryDataFilter = 'all';
    let currentHistorySortOrder = 'desc';

    // Utils
    const formatCurrency = (val) => 'Rs. ' + new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(val);
    const formatNum = (val) => val ? new Intl.NumberFormat('en-IN').format(val) : '-';
    const getFieldLabel = (field) => FIELD_LABELS[field] || field.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const getActiveHistoryEntries = () => {
        const allEntries = Object.entries(CURRENT_PLATFORMS);
        if (currentHistoryCategory === 'all') return allEntries;
        return allEntries.filter(([key]) => key === currentHistoryCategory);
    };
    const getVisibleFieldTotal = (row, entries) => entries.reduce((sum, [, p]) => {
        return sum + p.fields.reduce((acc, f) => acc + (Number(row[f]) || 0), 0);
    }, 0);

    function syncHistoryFilters() {
        const dataFilterEl = document.getElementById('history-data-filter');
        const sortOrderEl = document.getElementById('history-sort-order');
        if (dataFilterEl) dataFilterEl.value = currentHistoryDataFilter;
        if (sortOrderEl) sortOrderEl.value = currentHistorySortOrder;
    }

    function renderHistorySubtabs() {
        const container = document.getElementById('history-subtabs');
        if (!container) return;

        if (currentHistoryCategory !== 'all' && !CURRENT_PLATFORMS[currentHistoryCategory]) {
            currentHistoryCategory = 'all';
        }

        const tabs = [{ key: 'all', label: 'All' }].concat(
            Object.entries(CURRENT_PLATFORMS).map(([key, platform]) => ({ key, label: platform.name }))
        );

        container.innerHTML = tabs.map(tab => `
            <button class="history-subtab ${tab.key === currentHistoryCategory ? 'active' : ''}" onclick="setHistoryCategory('${tab.key}')">${tab.label}</button>
        `).join('');
    }

    window.setHistoryCategory = (key) => {
        currentHistoryCategory = key;
        renderHistorySubtabs();
        syncHistoryFilters();
        renderTable();
    };

    window.setHistoryDataFilter = (value) => {
        currentHistoryDataFilter = value === 'available' ? 'available' : 'all';
        syncHistoryFilters();
        renderTable();
    };

    window.setHistorySortOrder = (value) => {
        currentHistorySortOrder = value === 'asc' ? 'asc' : 'desc';
        syncHistoryFilters();
        renderTable();
    };

    // Tab Switcher
    window.switchTab = (tabName, el) => {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
        el.classList.add('active');
        document.getElementById(`view-${tabName}`).classList.add('active');
    };

    // Month Navigation
    window.changeMonth = (delta) => {
        if (currentMonthIndex === -1) return;
        const newIndex = currentMonthIndex + delta;
        if (newIndex >= 0 && newIndex < globalData.length) {
            currentMonthIndex = newIndex;
            renderOverview();
        }
    };

    function toggleNetWorth() {
        isNetWorthVisible = !isNetWorthVisible;
        updateNetWorthDisplay();
    }

    function updateNetWorthDisplay() {
        const el = document.getElementById('total-value');
        const icon = document.getElementById('eye-icon');
        if (isNetWorthVisible) {
            el.textContent = formatCurrency(currentTotalNetWorth);
            icon.className = 'fa-solid fa-eye-slash';
        } else {
            el.textContent = '****';
            icon.className = 'fa-solid fa-eye';
        }
    }

    // Fetch
    async function fetchData() {
        const loader = document.getElementById('loader');
        loader.style.display = 'flex'; // Show loader

        const user = document.getElementById('user-select').value;
        if (!SCRIPT_URL) {
            loader.style.display = 'none';
            KTui.alert('Error', 'MSI endpoint is not configured. Please check config.js', 'error');
            return;
        }

        // Update platforms based on user
        if (user === 'Layan') {
            CURRENT_PLATFORMS = PLATFORMS_LAYAN;
        } else {
            CURRENT_PLATFORMS = PLATFORMS_KALYAN;
        }

        try {
            const res = await fetch(`${SCRIPT_URL}?sheetName=${encodeURIComponent(user)}&v=${Date.now()}`);
            if (!res.ok) {
                throw new Error(`Fetch failed (${res.status})`);
            }

            let data;
            try {
                data = await res.json();
            } catch (_) {
                throw new Error('Invalid response from sheet endpoint. Expected JSON.');
            }

            if (data.data) data = data.data;
            else if (data.records) data = data.records;
            else if (data.result) data = data.result;

            if (!Array.isArray(data)) throw new Error("Invalid Data");

            processData(data);
        } catch (e) {
            console.error(e);
            KTui.alert('Error', "Sync Failed: " + e.message, 'error');
        } finally {
            setTimeout(() => {
                loader.style.display = 'none'; // Hide loader
            }, 600);
        }
    }

    function processData(data) {
        const allFields = [...COMMON_FIELDS, ...BANK_FIELDS, ...Object.values(CURRENT_PLATFORMS).flatMap(p => p.fields)];
        const normalized = data.map(row => {
            const newRow = {};
            const rowKeys = Object.keys(row);

            const findValue = (targetKey) => {
                const aliases = FIELD_ALIASES[targetKey] || [targetKey];

                // 1. Try explicit aliases first to avoid fuzzy wrong matches.
                for (const alias of aliases) {
                    if (row[alias] !== undefined) return row[alias];

                    const lowerAlias = alias.toLowerCase();
                    let foundKey = rowKeys.find(k => k.toLowerCase() === lowerAlias);
                    if (foundKey) return row[foundKey];

                    const strippedAlias = lowerAlias.replace(/[^a-z0-9]/g, '');
                    foundKey = rowKeys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === strippedAlias);
                    if (foundKey) return row[foundKey];
                }

                const lowerTarget = targetKey.toLowerCase();

                // 2. Last-resort tokenized match for unrecognized headers.
                const parts = lowerTarget.split('_').filter(p => p.length > 2);
                if (parts.length > 0) {
                    const foundKey = rowKeys.find(k => {
                        const cleanKey = k.toLowerCase();
                        return parts.every(part => cleanKey.includes(part));
                    });
                    if (foundKey) return row[foundKey];
                }

                return undefined;
            };

            allFields.forEach(field => {
                newRow[field] = findValue(field);
            });
            return newRow;
        }).filter(d => d.month && d.year);

        normalized.sort((a, b) => (Number(a.year) * 100 + MONTH_ORDER[a.month]) - (Number(b.year) * 100 + MONTH_ORDER[b.month]));

        globalData = normalized;
        renderUI();
    }

    function renderUI() {
        if (!globalData.length) {
            // Clear UI if no data
            document.getElementById('current-month-display').textContent = '-';
            document.getElementById('current-month-total').textContent = 'Rs. 0';
            document.getElementById('platform-grid').innerHTML = '';
            document.getElementById('total-grid').innerHTML = '';
            document.querySelector('#dataTable tbody').innerHTML = '';
            currentTotalNetWorth = 0;
            updateNetWorthDisplay();
            return;
        }

        // Calculate Totals Dynamically
        let totalAllTime = 0;
        globalData.forEach(row => {
            // Sum up all platform fields for this row
            let rowTotal = 0;
            Object.values(CURRENT_PLATFORMS).forEach(p => {
                p.fields.forEach(f => rowTotal += (Number(row[f]) || 0));
            });
            // Add bank fields if they are considered part of "Investment" or "Net Worth"
            // Assuming Net Worth includes Banks + Investments
            BANK_FIELDS.forEach(f => rowTotal += (Number(row[f]) || 0));

            totalAllTime += rowTotal;
            row.calculated_total = rowTotal; // Store for table use if needed
        });

        const lastRec = globalData[globalData.length - 1];

        // Calculate Last Month Total (Investments + Banks)
        let lastMonthTotal = 0;
        Object.values(CURRENT_PLATFORMS).forEach(p => {
            p.fields.forEach(f => lastMonthTotal += (Number(lastRec[f]) || 0));
        });
        BANK_FIELDS.forEach(f => lastMonthTotal += (Number(lastRec[f]) || 0));

        currentTotalNetWorth = totalAllTime;
        updateNetWorthDisplay();

        // document.getElementById('last-month-val').textContent = formatCurrency(lastMonthTotal);
        // document.getElementById('record-count').textContent = globalData.length;

        // Default to current month/year if present; otherwise fallback to latest row.
        const now = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const targetMonth = monthNames[now.getMonth()];
        const targetYear = String(now.getFullYear());
        const currentPeriodIndex = globalData.findIndex(r => r.month === targetMonth && String(r.year) === targetYear);
        currentMonthIndex = currentPeriodIndex !== -1 ? currentPeriodIndex : (globalData.length - 1);

        // renderBankBalances(lastRec); // Removed Bank Balances
        renderOverview();
        renderTotalCards();
        renderHistorySubtabs();
        syncHistoryFilters();
        renderTable();
    }

    function renderOverview() {
        if (currentMonthIndex === -1 || !globalData[currentMonthIndex]) return;
        const data = globalData[currentMonthIndex];
        const label = `${data.month} ${data.year}`;
        document.getElementById('current-month-display').textContent = label;

        // Calculate Total for displayed platforms
        let monthTotal = 0;
        Object.values(CURRENT_PLATFORMS).forEach(p => {
            p.fields.forEach(f => monthTotal += (Number(data[f]) || 0));
        });
        document.getElementById('current-month-total').textContent = formatCurrency(monthTotal);

        // Check if it is the last month (current)
        const isCurrent = currentMonthIndex === globalData.length - 1;
        const cardLabel = isCurrent ? 'Current Month' : label;

        renderPlatformCards(data, 'platform-grid', cardLabel);
    }

    /* Removed renderBankBalances function */

    function renderPlatformCards(dataObj, containerId, labelText) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        Object.entries(CURRENT_PLATFORMS).forEach(([key, p]) => {
            let platformTotal = p.fields.reduce((sum, f) => sum + (Number(dataObj[f]) || 0), 0);

            if (platformTotal === 0) return;

            // Prepare items with key for color lookup
            let itemsData = p.fields.map(f => ({
                key: f,
                name: f.replace(/_/g, ' ').replace('ind_', ''),
                val: Number(dataObj[f]) || 0
            }));

            // For Govt, use defined order. For others, sort by value.
            if (key !== 'govt') {
                itemsData.sort((a,b) => b.val - a.val);
            }

            const card = document.createElement('div');
            card.className = 'platform-card';
            card.innerHTML = `
                <div class="pc-header">
                    <div class="pc-icon" style="background: ${p.color}20; color: ${p.color}">
                        <i class="${p.icon}"></i>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${labelText}</div>
                        <div style="font-weight: 700; color: ${p.color};">${formatCurrency(platformTotal)}</div>
                    </div>
                </div>
                <div class="pc-title">${p.name}</div>
                <ul class="pc-list">
                    ${itemsData.map(i => `
                        <li class="pc-item">
                            <span style="text-transform: ${key === 'govt' ? 'uppercase' : 'capitalize'}; color: ${FIELD_COLORS[i.key] || '#a1a1aa'};">
                                <i class="fa-solid fa-circle" style="font-size: 0.4em; vertical-align: middle; margin-right: 6px; opacity: 0.7;"></i>
                                ${i.name}
                            </span>
                            <span class="${i.val > 0 ? 'val-positive' : 'val-zero'}">${formatNum(i.val)}</span>
                        </li>
                    `).join('')}
                </ul>
            `;
            container.appendChild(card);
        });
    }

    function renderTotalCards() {
        // Calculate all-time totals for each field
        const totalData = {};

        // Initialize fields
        Object.values(CURRENT_PLATFORMS).forEach(p => {
            p.fields.forEach(f => totalData[f] = 0);
        });

        // Sum up
        globalData.forEach(row => {
            Object.values(CURRENT_PLATFORMS).forEach(p => {
                p.fields.forEach(f => {
                    totalData[f] += (Number(row[f]) || 0);
                });
            });
        });

        renderPlatformCards(totalData, 'total-grid', 'All Time Total');
    }

    function renderTable() {
        const groupRow = document.getElementById('history-group-row');
        const fieldRow = document.getElementById('history-field-row');
        const tbody = document.querySelector('#dataTable tbody');
        const activeEntries = getActiveHistoryEntries();

        groupRow.innerHTML = '';
        fieldRow.innerHTML = '';
        tbody.innerHTML = '';

        const periodHeader = document.createElement('th');
        periodHeader.rowSpan = 2;
        periodHeader.className = 'col-period';
        periodHeader.textContent = 'Period';
        groupRow.appendChild(periodHeader);

        const totalHeader = document.createElement('th');
        totalHeader.rowSpan = 2;
        totalHeader.className = 'col-total';
        totalHeader.textContent = 'Total';
        groupRow.appendChild(totalHeader);

        activeEntries.forEach(([, p]) => {
            const groupHeader = document.createElement('th');
            groupHeader.colSpan = p.fields.length;
            groupHeader.className = 'hdr-group';
            groupHeader.textContent = p.name;
            groupHeader.style.color = p.color;
            groupHeader.style.background = `${p.color}18`;
            groupHeader.style.borderBottom = `1px solid ${p.color}66`;
            groupRow.appendChild(groupHeader);

            p.fields.forEach((f, index) => {
                const th = document.createElement('th');
                th.textContent = getFieldLabel(f);
                th.className = 'hdr-field';
                th.style.color = p.color;
                th.style.background = `${p.color}12`;
                th.style.borderBottom = `1px solid ${p.color}55`;

                if (index === 0) {
                    th.classList.add('cat-start');
                    th.style.borderLeft = `2px solid ${p.color}66`;
                }

                fieldRow.appendChild(th);
            });
        });

        const rows = [...globalData];
        if (currentHistorySortOrder === 'desc') {
            rows.reverse();
        }

        const filteredRows = currentHistoryDataFilter === 'available'
            ? rows.filter(row => getVisibleFieldTotal(row, activeEntries) > 0)
            : rows;

        filteredRows.forEach((row, rowIndex) => {
            const tr = document.createElement('tr');
            tr.className = rowIndex % 2 === 0 ? 'tx-row-even' : 'tx-row-odd';

            const total = row.calculated_total !== undefined ? row.calculated_total : (Number(row.total_investment) || 0);
            const filteredTotal = getVisibleFieldTotal(row, activeEntries);
            const displayTotal = currentHistoryCategory === 'all' ? total : filteredTotal;

            let html = `
                <td class="col-period">
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                        <span>${row.month} ${row.year}</span>
                        <button onclick="editRecord('${row.month}', '${row.year}')" class="row-edit-btn">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </td>
                <td class="col-total">${formatNum(displayTotal)}</td>
            `;

            activeEntries.forEach(([key, p]) => {
                p.fields.forEach((f, index) => {
                    const val = Number(row[f]) || 0;
                    const classes = ['tx-cell', `cat-${key}`];
                    if (index === 0) classes.push('cat-start');
                    if (val > 0) classes.push('has-value');
                    else classes.push('is-zero');

                    let cellStyle = '';
                    if (index === 0) cellStyle += `border-left: 2px solid ${p.color}40;`;

                    html += `<td class="${classes.join(' ')}"${cellStyle ? ` style="${cellStyle}"` : ''}>${formatNum(val)}</td>`;
                });
            });

            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
    }

    // Edit Functionality
    window.editRecord = (month, year) => {
        const record = globalData.find(r => r.month === month && r.year == year);
        if (record) {
            const user = document.getElementById('user-select').value;
            const dataToEdit = { ...record, user: user };
            sessionStorage.setItem('msiEditData', JSON.stringify(dataToEdit));
            window.location.href = 'msi.html';
        }
    };

    window.editCurrentMonth = () => {
        if (currentMonthIndex === -1 || !globalData[currentMonthIndex]) return;
        const record = globalData[currentMonthIndex];
        window.editRecord(record.month, record.year);
    };

    // Initial fetch
    document.addEventListener('DOMContentLoaded', fetchData);

    // ===== MOBILE ENHANCEMENTS =====
    function showToast(msg, type = 'success', duration = 2800) {
        KTui.toast(msg, type);
    }

    // Pull-to-refresh
    (function initPTR() {
        const ptr = document.createElement('div');
        ptr.className = 'ptr-indicator';
        ptr.innerHTML = '<i class="fa-solid fa-arrows-rotate ptr-icon"></i><span class="ptr-text">Pull to refresh</span>';
        document.body.appendChild(ptr);
        let startY = 0, pulling = false, threshold = 80;
        document.addEventListener('touchstart', e => {
            if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; }
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            if (!pulling) return;
            const dy = e.touches[0].clientY - startY;
            if (dy > 30) { ptr.classList.add('visible'); ptr.querySelector('.ptr-text').textContent = dy > threshold ? 'Release to refresh' : 'Pull to refresh'; }
        }, { passive: true });
        document.addEventListener('touchend', e => {
            if (!pulling) return; pulling = false;
            const dy = e.changedTouches[0].clientY - startY;
            if (dy > threshold) {
                ptr.classList.add('refreshing'); ptr.querySelector('.ptr-text').textContent = 'Refreshing…';
                if (navigator.vibrate) navigator.vibrate(30);
                fetchData();
                setTimeout(() => ptr.classList.remove('visible', 'refreshing'), 1200);
            } else ptr.classList.remove('visible');
        }, { passive: true });
    })();
</script>
