<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Design Infographic</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #000000;
            --wheel-border-grad: conic-gradient(
                #f472b6 0deg 40deg,
                #e2e8f0 40deg 80deg,
                #c084fc 80deg 120deg,
                #38bdf8 120deg 160deg,
                #f87171 160deg 200deg,
                #4ade80 200deg 240deg,
                #fb923c 240deg 280deg,
                #818cf8 280deg 320deg,
                #a78bfa 320deg 360deg
            );

            /* Visual Colors for Nodes */
            --color-1: #00e5bc; /* Teal/Cyan */
            --color-2: #e04db0; /* Pink/Magenta */
            --color-3: #ffb64d; /* Orange/Yellow */
            --color-4: #00bfff; /* Sky Blue */
            --color-5: #a64dff; /* Purple */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }

        .infographic-wrapper {
            display: flex;
            align-items: center;
            gap: 60px;
            max-width: 900px;
            width: 100%;
            position: relative;
        }

        /* --- Left Main Wheel Hub --- */
        .main-wheel-container {
            position: relative;
            flex-shrink: 0;
        }

        .main-wheel {
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 14px solid transparent;
            background:
                radial-gradient(circle at 35% 30%, #ffffff 0%, #f3f6ff 52%, #e8eeff 100%) padding-box,
                var(--wheel-border-grad) border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }

        .main-wheel::before {
            content: "";
            position: absolute;
            inset: -9px;
            border-radius: 50%;
            background: conic-gradient(
                #6366f1 0deg 72deg,
                #8b5cf6 72deg 144deg,
                #06b6d4 144deg 216deg,
                #22d3ee 216deg 288deg,
                #818cf8 288deg 360deg
            );
            animation: wheelSpin 12s linear infinite;
            z-index: -2;
        }

        .main-wheel::after {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 2px dashed rgba(99, 102, 241, 0.38);
            z-index: -1;
        }

        .main-wheel-content {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-wheel-logo {
            width: 124px;
            height: 124px;
            border-radius: 26px;
            object-fit: cover;
            border: 1px solid rgba(99, 102, 241, 0.28);
            box-shadow: 0 8px 18px rgba(60,72,160,0.22);
            animation: logoSpinClockwise 8.5s linear infinite;
        }

        .main-wheel-label {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 34px;
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes wheelSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes logoSpinClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Small colored connection dots placed right on the outer rim edge */
        .rim-dot {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform-origin: 0 0;
            z-index: 5;
        }
        /* Mathematical positioning around the right hemisphere of the circle */
        .rim-dot:nth-child(1) { transform: translate(-50%, -50%) rotate(-42deg) translate(170px) rotate(42deg); background-color: var(--color-1); }
        .rim-dot:nth-child(2) { transform: translate(-50%, -50%) rotate(-18deg) translate(170px) rotate(18deg); background-color: var(--color-2); }
        .rim-dot:nth-child(3) { transform: translate(-50%, -50%) rotate(5deg) translate(170px) rotate(-5deg); background-color: var(--color-3); }
        .rim-dot:nth-child(4) { transform: translate(-50%, -50%) rotate(28deg) translate(170px) rotate(-28deg); background-color: var(--color-4); }
        .rim-dot:nth-child(5) { transform: translate(-50%, -50%) rotate(52deg) translate(170px) rotate(-52deg); background-color: var(--color-5); }


        /* --- Right Column Layout --- */
        .nodes-column {
            display: flex;
            flex-direction: column;
            gap: 22px;
            flex-grow: 1;
        }

        /* Node Item Structure */
        .node-row {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        /* Directional dynamic arrows */
        .arrow-pointer {
            width: 24px;
            height: 18px;
            background-color: var(--node-color);
            clip-path: polygon(0% 25%, 60% 25%, 60% 0%, 100% 50%, 60% 100%, 60% 75%, 0% 75%);
            flex-shrink: 0;
        }
        /* Slanting arrows subtly towards the radial core */
        .node-row:nth-child(1) .arrow-pointer { transform: rotate(-30deg); }
        .node-row:nth-child(2) .arrow-pointer { transform: rotate(-15deg); }
        .node-row:nth-child(4) .arrow-pointer { transform: rotate(15deg); }
        .node-row:nth-child(5) .arrow-pointer { transform: rotate(30deg); }

        /* The Pill Shape Capsule */
        .capsule-pill {
            display: flex;
            align-items: center;
            border: 1.5px dashed #000000;
            border-radius: 50px;
            padding: 4px 25px 4px 4px;
            background: #fff;
            position: relative;
        }

        /* Circle Badge inside capsule */
        .icon-badge {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: var(--node-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .icon-badge svg {
            width: 38px;
            height: 38px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Title text settings */
        .capsule-text {
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: bold;
            color: #000000;
            margin-left: 15px;
            white-space: nowrap;
        }


        /* Responsive scaling while keeping same visual structure */
        @media (max-width: 980px) {
            body { padding: 20px; }
            .infographic-wrapper { gap: 28px; }
            .main-wheel { width: 280px; height: 280px; border-width: 12px; }
            .main-wheel::after { inset: 10px; }
            .main-wheel-logo { width: 100px; height: 100px; border-radius: 22px; }
            .main-wheel-label { font-size: 20px; bottom: 28px; }
            .rim-dot:nth-child(1) { transform: translate(-50%, -50%) rotate(-42deg) translate(140px) rotate(42deg); }
            .rim-dot:nth-child(2) { transform: translate(-50%, -50%) rotate(-18deg) translate(140px) rotate(18deg); }
            .rim-dot:nth-child(3) { transform: translate(-50%, -50%) rotate(5deg) translate(140px) rotate(-5deg); }
            .rim-dot:nth-child(4) { transform: translate(-50%, -50%) rotate(28deg) translate(140px) rotate(-28deg); }
            .rim-dot:nth-child(5) { transform: translate(-50%, -50%) rotate(52deg) translate(140px) rotate(-52deg); }
            .nodes-column { gap: 14px; }
            .icon-badge { width: 56px; height: 56px; }
            .icon-badge svg { width: 28px; height: 28px; }
            .capsule-text { font-size: 14px; margin-left: 10px; }
            .capsule-pill { padding: 3px 15px 3px 3px; }
            .arrow-pointer { width: 20px; height: 14px; }
        }

        @media (max-width: 760px) {
            body { padding: 12px; }
            .infographic-wrapper { gap: 12px; }
            .main-wheel { width: 210px; height: 210px; border-width: 9px; }
            .main-wheel::before { inset: -7px; }
            .main-wheel::after { inset: 8px; border-width: 1.5px; }
            .main-wheel-logo { width: 74px; height: 74px; border-radius: 17px; }
            .main-wheel-label { font-size: 15px; bottom: 20px; }
            .rim-dot { width: 12px; height: 12px; }
            .rim-dot:nth-child(1) { transform: translate(-50%, -50%) rotate(-42deg) translate(105px) rotate(42deg); }
            .rim-dot:nth-child(2) { transform: translate(-50%, -50%) rotate(-18deg) translate(105px) rotate(18deg); }
            .rim-dot:nth-child(3) { transform: translate(-50%, -50%) rotate(5deg) translate(105px) rotate(-5deg); }
            .rim-dot:nth-child(4) { transform: translate(-50%, -50%) rotate(28deg) translate(105px) rotate(-28deg); }
            .rim-dot:nth-child(5) { transform: translate(-50%, -50%) rotate(52deg) translate(105px) rotate(-52deg); }
            .nodes-column { gap: 10px; }
            .node-row { gap: 8px; }
            .icon-badge { width: 42px; height: 42px; }
            .icon-badge svg { width: 22px; height: 22px; }
            .capsule-text { font-size: 11px; margin-left: 7px; }
            .capsule-pill { padding: 2px 10px 2px 2px; }
            .arrow-pointer { width: 16px; height: 11px; }
        }

        @media (max-width: 560px) {
            .infographic-wrapper { gap: 8px; }
            .main-wheel { width: 174px; height: 174px; border-width: 7px; }
            .main-wheel::before { inset: -6px; }
            .main-wheel::after { inset: 7px; border-width: 1px; }
            .main-wheel-logo { width: 62px; height: 62px; border-radius: 14px; }
            .main-wheel-label { font-size: 12px; bottom: 16px; }
            .rim-dot:nth-child(1) { transform: translate(-50%, -50%) rotate(-42deg) translate(87px) rotate(42deg); }
            .rim-dot:nth-child(2) { transform: translate(-50%, -50%) rotate(-18deg) translate(87px) rotate(18deg); }
            .rim-dot:nth-child(3) { transform: translate(-50%, -50%) rotate(5deg) translate(87px) rotate(-5deg); }
            .rim-dot:nth-child(4) { transform: translate(-50%, -50%) rotate(28deg) translate(87px) rotate(-28deg); }
            .rim-dot:nth-child(5) { transform: translate(-50%, -50%) rotate(52deg) translate(87px) rotate(-52deg); }
            .nodes-column { gap: 8px; }
            .capsule-pill { border-width: 1px; }
            .capsule-text { font-size: 9px; margin-left: 6px; }
            .icon-badge { width: 34px; height: 34px; }
            .icon-badge svg { width: 16px; height: 16px; }
            .arrow-pointer { width: 12px; height: 9px; }
        }
    </style>
</head>
<body>

<div class="infographic-wrapper">
    <div class="main-wheel-container">
        <div class="main-wheel">
            <div class="main-wheel-content">
                <img src="root/logo.png" alt="KT Apps" class="main-wheel-logo">
                <h1 class="main-wheel-label">KT Apps</h1>
            </div>
        </div>
        <div class="rim-dot"></div>
        <div class="rim-dot"></div>
        <div class="rim-dot"></div>
        <div class="rim-dot"></div>
        <div class="rim-dot"></div>
    </div>

    <div class="nodes-column" id="nodes-container"></div>
</div>

<script>
    // Inline SVG paths to replace placeholders with production lookalikes
    const icons = {
        logo: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
        graphic: `<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M8 10h.01"></path><path d="M12 10h.01"></path><path d="M16 10h.01"></path></svg>`,
        brand: `<svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>`,
        webDesign: `<svg viewBox="0 0 24 24"><path d="M11 5h8.5a2.5 2.5 0 0 1 0 5H11M11 5v5M11 5l-2-2M11 10H4.5a2.5 2.5 0 0 0 0 5H11M11 10v5M11 15h6.5a2.5 2.5 0 0 1 0 5H11M11 15v5"></path></svg>`,
        dev: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>`
    };

    const listData = [
        { id: "01.", label: "Logo Design", colorVar: "1", icon: icons.logo },
        { id: "2.", label: "Graphic Design", colorVar: "2", icon: icons.graphic },
        { id: "03.", label: "Brand Design", colorVar: "3", icon: icons.brand },
        { id: "04.", label: "Web design", colorVar: "4", icon: icons.webDesign },
        { id: "05.", label: "Web developemnt", colorVar: "5", icon: icons.dev } // matches typo text exact to sample image
    ];

    const container = document.getElementById('nodes-container');

    listData.forEach(item => {
        const row = document.createElement('div');
        row.className = 'node-row';
        row.style.setProperty('--node-color', `var(--color-${item.colorVar})`);

        row.innerHTML = `
                <div class="arrow-pointer"></div>
                <div class="capsule-pill">
                    <div class="icon-badge">
                        ${item.icon}
                    </div>
                    <span class="capsule-text">${item.id} ${item.label}</span>
                </div>
            `;
        container.appendChild(row);
    });
</script>
</body>
</html>
