<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Wheel - Web Design & Development</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #1a2a3a;
            --wheel-color: #34495e;
            --wheel-border: #7f8c8d;
            --accent-glow: #00d2d3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Main Viewport Container */
        .container {
            position: relative;
            width: 750px;
            height: 750px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG Dynamic Connecting Lines Layer */
        .lines-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .connecting-line {
            stroke: rgba(255, 255, 255, 0.25);
            stroke-width: 2;
            stroke-dasharray: 6, 4;
        }

        /* Outer Orbit Track System */
        .orbit-system {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
            /* Smooth consistent global rotation */
            animation: globalRotation 30s linear infinite;
        }

        @keyframes globalRotation {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Individual Floating Icon Nodes */
        .icon-node {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            /* Center anchors for placement math */
            left: calc(50% - 32.5px);
            top: calc(50% - 32.5px);
        }

        /* Keep the glyph icons upright while everything spins */
        .icon-node i {
            animation: counterRotation 30s linear infinite;
        }

        @keyframes counterRotation {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .icon-node:hover {
            transform: scale(1.3) !important;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ==========================================
           CENTRAL MECHANICAL WHEEL
           ========================================== */
        .center-wheel-wrapper {
            position: absolute;
            width: 320px;
            height: 320px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gear-wheel {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 8px solid var(--wheel-border);
            border-radius: 50%;
            background: radial-gradient(circle, #2c3e50 40%, #1a252f 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 0 15px 40px rgba(0,0,0,0.5);
            /* Spins backward relative to outer icons for complexity */
            animation: gearRotate 20s linear infinite;
        }

        /* Cog teeth design details */
        .gear-wheel::before, .gear-wheel::after {
            content: "";
            position: absolute;
            top: -12px; left: 50%;
            width: 24px; height: 328px;
            background: var(--wheel-border);
            transform: translateX(-50%);
            border-radius: 4px;
            z-index: -1;
        }
        .gear-wheel::after { transform: translateX(-50%) rotate(90deg); }

        .gear-teeth-extra {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .gear-teeth-extra::before, .gear-teeth-extra::after {
            content: "";
            position: absolute;
            top: -12px; left: 50%;
            width: 24px; height: 328px;
            background: var(--wheel-border);
            transform: translateX(-50%) rotate(45deg);
            border-radius: 4px;
        }
        .gear-teeth-extra::after { transform: translateX(-50%) rotate(135deg); }

        @keyframes gearRotate {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Center Content Window inside the Wheel */
        .wheel-content {
            position: relative;
            width: 240px;
            height: 240px;
            background: rgba(26, 42, 58, 0.85);
            border: 3px double rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 210, 211, 0.2);
            z-index: 6;
        }

        .wheel-content h1 {
            color: #ffffff;
            font-size: 1.55rem;
            font-weight: 600;
            letter-spacing: 1px;
            line-height: 1.4;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
            50% { text-shadow: 0 0 15px var(--accent-glow), 0 0 5px #fff; color: #e0fcfc; }
        }

        /* Hover Mechanics to Pause System */
        .container:hover .orbit-system,
        .container:hover .icon-node i {
            animation-play-state: paused;
        }
    </style>
</head>
<body>

<div class="container">

    <svg class="lines-container" id="svgCanvas"></svg>

    <div class="orbit-system" id="orbitSystem">
    </div>

    <div class="center-wheel-wrapper">
        <div class="gear-wheel">
            <div class="gear-teeth-extra"></div>
        </div>
        <div class="wheel-content">
            <h1>Web Design &<br>Development</h1>
        </div>
    </div>

</div>

<script>
    const iconData = [
        { icon: "fa-search", color: "#2ecc71" },
        { icon: "fa-comments", color: "#e67e22" },
        { icon: "fa-video", color: "#9b59b6" },
        { icon: "fa-image", color: "#e74c3c" },
        { icon: "fa-shield-alt", color: "#d35400" },
        { icon: "fa-user", color: "#f1929d" },
        { icon: "fa-cog", color: "#1abc9c" },
        { icon: "fa-mobile-alt", color: "#a55eea" },
        { icon: "fa-envelope", color: "#34495e" }
    ];

    const orbitSystem = document.getElementById('orbitSystem');
    const svgCanvas = document.getElementById('svgCanvas');
    const totalIcons = iconData.length;
    const radius = 270; // Circle radius size

    // Array to hold references of created elements for alignment loops
    const activeNodes = [];

    // 1. Build and position elements geometrically
    iconData.forEach((data, index) => {
        const angle = (index / totalIcons) * 2 * Math.PI;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        // Generate Node Dom Tree
        const node = document.createElement('div');
        node.classList.add('icon-node');
        node.style.backgroundColor = data.color;
        node.style.transform = `translate(${x}px, ${y}px)`;

        const icon = document.createElement('i');
        icon.classList.add('fas', data.icon);
        node.appendChild(icon);
        orbitSystem.appendChild(node);

        // Create corresponding dynamic SVG structural line
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.classList.add('connecting-line');
        svgCanvas.appendChild(line);

        activeNodes.push({ element: node, line: line });
    });

    // 2. Realtime Animation Engine Tracking loop to draw lines during rotation
    function animateLines() {
        const centerX = svgCanvas.clientWidth / 2;
        const centerY = svgCanvas.clientHeight / 2;

        activeNodes.forEach(item => {
            // Read exact runtime position matrices of icons relative to the viewport
            const rect = item.element.getBoundingClientRect();
            const containerRect = svgCanvas.getBoundingClientRect();

            const currentX = (rect.left + rect.width / 2) - containerRect.left;
            const currentY = (rect.top + rect.height / 2) - containerRect.top;

            // Bind attributes across coordinates
            item.line.setAttribute('x1', centerX);
            item.line.setAttribute('y1', centerY);
            item.line.setAttribute('x2', currentX);
            item.line.setAttribute('y2', currentY);
        });

        requestAnimationFrame(animateLines);
    }

    // Initialize engine tracking
    window.addEventListener('load', () => {
        animateLines();
    });
    window.addEventListener('resize', () => {
        animateLines();
    });
</script>
</body>
</html>
