<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Design Practices Infographic</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #555555;

            /* Color mapping for the 10 points */
            --color-1: #3498db;
            --color-2: #7f8c8d;
            --color-3: #f39c12;
            --color-4: #1abc9c;
            --color-5: #9b59b6;
            --color-6: #2ecc71;
            --color-7: #2980b9;
            --color-8: #9b59b6;
            --color-9: #e74c3c;
            --color-10: #e67e22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container layout mapping left and right columns with a center circle */
        .infographic-container {
            display: grid;
            grid-template-columns: 1fr 320px 1fr;
            align-items: center;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
            position: relative;
        }

        /* Central Circle Styles */
        .center-circle {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            position: relative;
            z-index: 10;
        }

        /* Multi-colored border ring utilizing conic-gradient */
        .center-circle::before {
            content: '';
            position: absolute;
            top: -12px;
            left: -12px;
            right: -12px;
            bottom: -12px;
            border-radius: 50%;
            background: conic-gradient(
                    var(--color-1) 0deg 36deg,
                    var(--color-2) 36deg 72deg,
                    var(--color-3) 72deg 108deg,
                    var(--color-4) 108deg 144deg,
                    var(--color-5) 144deg 180deg,
                    var(--color-6) 180deg 216deg,
                    var(--color-7) 216deg 252deg,
                    var(--color-8) 252deg 288deg,
                    var(--color-9) 288deg 324deg,
                    var(--color-10) 324deg 360deg
            );
            z-index: -2;
        }

        /* White inner mask to create the ring track effect */
        .center-circle::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            background: white;
            z-index: -1;
        }

        .center-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
        }

        /* Column structures */
        .column {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .left-column {
            align-items: flex-end;
        }

        .right-column {
            align-items: flex-start;
        }

        /* Capsule Node Styling */
        .node {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 340px;
            background: #fff;
            border: 2px solid var(--node-color);
            border-radius: 50px;
            padding: 8px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            transition: transform 0.3s ease;
        }

        .node:hover {
            transform: translateY(-3px);
        }

        /* Align items visually inside left vs right side pills */
        .left-column .node {
            flex-direction: row;
            padding-right: 6px;
        }

        .right-column .node {
            flex-direction: row-reverse;
            padding-left: 6px;
        }

        .node-text {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 0 15px;
            line-height: 1.3;
        }

        .left-column .node-text {
            text-align: right;
        }

        /* Pill shape holding the number badge */
        .node-number {
            width: 54px;
            height: 54px;
            background-color: var(--node-color);
            color: white;
            font-size: 24px;
            font-weight: 800;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
        }

        /* Responsive styling for smaller screens (Stacks vertically) */
        @media (max-width: 900px) {
            .infographic-container {
                grid-template-columns: 1fr;
                gap: 40px;
                justify-items: center;
            }

            .center-circle {
                order: -1; /* Keep the main circle at the top on mobile */
            }

            .left-column, .right-column {
                align-items: center;
                width: 100%;
            }

            .left-column .node {
                flex-direction: row-reverse;
                padding-right: 12px;
                padding-left: 6px;
            }

            .left-column .node-text {
                text-align: left;
            }
        }
    </style>
</head>
<body>

<div class="infographic-container">
    <div class="column left-column" id="left-nodes"></div>

    <div class="center-circle">
        <h1 class="center-title">Best Website<br>Design<br>Practices For<br>Small Business</h1>
    </div>

    <div class="column right-column" id="right-nodes"></div>
</div>

<script>
    // Data containing infographic content
    const infographicData = [
        { id: 1, text: "Make A User-Oriented Design" },
        { id: 2, text: "Identify Your Target Audience" },
        { id: 3, text: "Embrace Consistency" },
        { id: 4, text: "Provide An Insightful Navigation" },
        { id: 5, text: "Make Use Of Negative Space" },
        { id: 6, text: "Maintain Familiarity" },
        { id: 7, text: "Focus On Writing Better Website Content" },
        { id: 8, text: "Design Call To Action (CTA) Buttons That Stand Out" },
        { id: 9, text: "Optimize Your Website For Mobile" },
        { id: 10, text: "Ensure Search Engine Optimization For Your Website" }
    ];

    const leftContainer = document.getElementById('left-nodes');
    const rightContainer = document.getElementById('right-nodes');

    // Dynamically build the DOM structure using JS
    infographicData.forEach(item => {
        const node = document.createElement('div');
        node.className = 'node';
        node.style.setProperty('--node-color', `var(--color-${item.id})`);

        // Check side direction to structure internal elements correctly
        if (item.id <= 5) {
            node.innerHTML = `
                    <span class="node-text">${item.text}</span>
                    <div class="node-number">${item.id}</div>
                `;
            leftContainer.appendChild(node);
        } else {
            node.innerHTML = `
                    <div class="node-number">${item.id}</div>
                    <span class="node-text">${item.text}</span>
                `;
            rightContainer.appendChild(node);
        }
    });
</script>
</body>
</html>
