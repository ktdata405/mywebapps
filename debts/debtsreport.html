<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="./manifest.json">
    <title>Debts Report - KT Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../ktui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <script src="../config.js"></script>
    <style>
        :root {
            --bg:#030712;
            --surface:rgba(15,23,42,0.75);
            --surface-soft:rgba(15,23,42,0.50);
            --line:rgba(148,163,184,0.18);
            --line-strong:rgba(148,163,184,0.32);
            --text-muted:#64748b;
            --text-soft:#94a3b8;
            --primary:#6366f1;
            --primary-glow:rgba(99,102,241,0.28);
        }
        *,*::before,*::after { box-sizing:border-box; }
        body { background:var(--bg); color:#f1f5f9; font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased; }

        /* ── Backgrounds ── */
        .bg-noise {
            position:fixed; inset:0; z-index:-3;
            background:
                radial-gradient(ellipse 1400px 700px at 5% -8%, rgba(99,102,241,0.26), transparent 55%),
                radial-gradient(ellipse 900px 600px at 100% 5%, rgba(236,72,153,0.16), transparent 55%),
                radial-gradient(ellipse 700px 500px at 55% 105%, rgba(16,185,129,0.14), transparent 55%),
                linear-gradient(175deg,#020617 0%,#030712 100%);
        }
        .bg-grid {
            position:fixed; inset:0; z-index:-2;
            background-image:
                linear-gradient(rgba(148,163,184,0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148,163,184,0.07) 1px, transparent 1px);
            background-size:40px 40px;
            mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
        }

        /* ── Glass ── */
        .glass {
            background:var(--surface);
            border:1px solid var(--line);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            box-shadow:0 4px 6px -1px rgba(0,0,0,0.4), 0 20px 40px rgba(2,8,23,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .glass-soft {
            background:var(--surface-soft);
            border:1px solid rgba(148,163,184,0.14);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
        }
        .glass-hover { transition:all 0.25s ease; }
        .glass-hover:hover { border-color:rgba(148,163,184,0.32); box-shadow:0 4px 6px -1px rgba(0,0,0,0.4), 0 28px 50px rgba(2,8,23,0.55), inset 0 1px 0 rgba(255,255,255,0.07); transform:translateY(-2px); }

        /* ── KPI metric cards ── */
        .kpi-card { position:relative; overflow:hidden; }
        .kpi-card::after { content:''; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%); pointer-events:none; }
        .kpi-glow { position:absolute; top:-40px; right:-30px; width:110px; height:110px; border-radius:50%; filter:blur(24px); opacity:0.55; pointer-events:none; }

        /* ── Progress ── */
        .progress-track { height:6px; border-radius:999px; background:rgba(148,163,184,0.12); overflow:hidden; }
        .progress-track-thin { height:4px; border-radius:999px; background:rgba(148,163,184,0.1); overflow:hidden; }
        .progress-fill { height:100%; border-radius:999px; transition:width 0.9s cubic-bezier(.4,0,.2,1); }

        /* ── Chips ── */
        .chip {
            border:1px solid rgba(148,163,184,0.22);
            color:#94a3b8;
            background:rgba(15,23,42,0.6);
            transition:all 0.18s ease;
            cursor:pointer;
        }
        .chip:hover { border-color:rgba(148,163,184,0.4); color:#e2e8f0; background:rgba(30,41,59,0.7); }
        .chip-active-indigo {
            color:#fff !important;
            border-color:rgba(99,102,241,0.8) !important;
            background:linear-gradient(135deg,rgba(99,102,241,0.9),rgba(139,92,246,0.75)) !important;
            box-shadow:0 6px 20px rgba(99,102,241,0.35) !important;
        }
        .chip-active-emerald {
            color:#fff !important;
            border-color:rgba(16,185,129,0.8) !important;
            background:linear-gradient(135deg,rgba(16,185,129,0.85),rgba(5,150,105,0.75)) !important;
            box-shadow:0 6px 20px rgba(16,185,129,0.3) !important;
        }
        .chip-active-rose {
            color:#fff !important;
            border-color:rgba(244,63,94,0.8) !important;
            background:linear-gradient(135deg,rgba(244,63,94,0.85),rgba(190,18,60,0.75)) !important;
            box-shadow:0 6px 20px rgba(244,63,94,0.3) !important;
        }

        /* ── Person group ── */
        .person-wrap {
            border:1px solid rgba(148,163,184,0.16);
            background:rgba(10,18,35,0.55);
            border-radius:20px;
            overflow:hidden;
        }
        .person-hdr { padding:10px 12px 8px; border-bottom:1px solid rgba(148,163,184,0.1); background:rgba(15,23,42,0.4); }

        /* ── Debt rows ── */
        .debt-row {
            border:1px solid rgba(148,163,184,0.12);
            background:rgba(15,23,42,0.5);
            border-radius:16px;
            transition:all 0.2s ease;
            position:relative;
            overflow:hidden;
        }
        .debt-row::before {
            content:'';
            position:absolute; left:0; top:0; bottom:0; width:3px;
            border-radius:3px 0 0 3px;
            opacity:0.85;
        }
        .debt-row.type-lent::before { background:linear-gradient(180deg,#10b981,#34d399); }
        .debt-row.type-borrowed::before { background:linear-gradient(180deg,#f43f5e,#fb7185); }
        .debt-row:hover { border-color:rgba(99,102,241,0.4); background:rgba(30,41,59,0.6); transform:translateX(2px); box-shadow:0 4px 20px rgba(2,8,23,0.35); }
        .debt-row.is-settled { opacity:0.6; }
        .debt-row.is-settled:hover { opacity:0.8; }

        /* ── Action icon buttons ── */
        .action-btn {
            width:30px; height:30px; border-radius:10px;
            border:1px solid rgba(148,163,184,0.2);
            background:rgba(15,23,42,0.7);
            display:flex; align-items:center; justify-content:center;
            font-size:11px;
            transition:all 0.18s ease;
            cursor:pointer;
            color:#94a3b8;
        }
        .action-btn:hover { transform:scale(1.1); }
        .action-btn.edit:hover { color:#818cf8; border-color:rgba(129,140,248,0.55); background:rgba(99,102,241,0.15); }
        .action-btn.settle:hover { color:#34d399; border-color:rgba(52,211,153,0.55); background:rgba(16,185,129,0.12); }
        .action-btn.reopen:hover { color:#fbbf24; border-color:rgba(251,191,36,0.55); background:rgba(245,158,11,0.12); }
        .action-btn.del:hover { color:#fb7185; border-color:rgba(251,113,133,0.55); background:rgba(244,63,94,0.12); }

        /* ── Status badges ── */
        .badge { border-radius:999px; font-size:9px; font-weight:800; letter-spacing:0.06em; padding:2px 8px; }
        .badge-lent { background:rgba(16,185,129,0.15); color:#34d399; border:1px solid rgba(16,185,129,0.3); }
        .badge-borrowed { background:rgba(244,63,94,0.15); color:#fb7185; border:1px solid rgba(244,63,94,0.3); }
        .badge-pending { background:rgba(251,191,36,0.12); color:#fbbf24; border:1px solid rgba(245,158,11,0.3); }
        .badge-settled { background:rgba(16,185,129,0.12); color:#34d399; border:1px solid rgba(16,185,129,0.25); }

        /* ── Pull to refresh ── */
        .ptr-indicator { position:fixed; top:-64px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; padding:8px 20px; border-radius:999px; font-size:0.75rem; font-weight:700; z-index:100; transition:top 0.35s cubic-bezier(.4,0,.2,1); box-shadow:0 8px 24px rgba(99,102,241,0.45); }
        .ptr-indicator.active { top:20px; }

        /* ── Mobile FAB ── */
        .mobile-fab { position:fixed; right:1.25rem; bottom:calc(1.25rem + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:18px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 12px 32px rgba(79,70,229,0.5), 0 0 0 1px rgba(99,102,241,0.4); z-index:40; text-decoration:none; transition:transform 0.2s ease, box-shadow 0.2s ease; }
        .mobile-fab:active { transform:scale(0.9); box-shadow:0 6px 16px rgba(79,70,229,0.5); }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(71,85,105,0.7); border-radius:999px; }

        /* ── Animations ── */
        @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes scaleIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }
        @keyframes slideRight { from { width:0 !important; } to { } }
        .anim-fade-up { animation:fadeUp 0.45s ease both; }
        .anim-scale { animation:scaleIn 0.35s ease both; }
        .anim-bar { animation:slideRight 0.9s cubic-bezier(.4,0,.2,1) both; }
        .delay-1 { animation-delay:0.06s; }
        .delay-2 { animation-delay:0.12s; }
        .delay-3 { animation-delay:0.18s; }
        .delay-4 { animation-delay:0.24s; }

        /* ── Divider label ── */
        .filter-label { font-size:9px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:#475569; }

        /* ── Insight box ── */
        .insight-box { background:linear-gradient(135deg, rgba(99,102,241,0.09), rgba(139,92,246,0.06)); border:1px solid rgba(99,102,241,0.18); border-radius:14px; padding:12px 14px; }

        /* ── Header icon btn ── */
        .hdr-btn { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:14px; color:#94a3b8; transition:all 0.18s ease; text-decoration:none; }
        .hdr-btn:hover { color:#f1f5f9; background:rgba(255,255,255,0.07); border-color:rgba(255,255,255,0.15) !important; }
        .hdr-btn:active { transform:scale(0.92); }

        /* Overview mode: list only affects top totals block */
        #overview-metrics.overview-list .overview-grid {
            grid-template-columns:1fr;
            gap:0.5rem;
        }
        #overview-metrics.overview-list .overview-card {
            display:grid;
            grid-template-columns:1fr auto;
            align-items:center;
            text-align:left;
            padding:0.65rem 0.75rem;
        }
        #overview-metrics.overview-list .overview-card p {
            text-align:left;
            margin:0;
        }
        #overview-metrics.overview-list .overview-card h3 {
            text-align:right;
            margin-top:0 !important;
        }
        #overview-metrics.overview-list .overview-progress .progress-track {
            grid-column:1 / -1;
            margin-top:0.4rem;
        }


        @media (max-width:768px) {
            .mobile-shell { padding:0.75rem; }
            .sticky-hdr { position:sticky; top:0; z-index:30; }
        }
    </style>
    <link rel="stylesheet" href="../modern-ui.css">
</head>
<body class="pb-24 md:pb-8 kt-modern-ui" style="padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))">
<div class="bg-noise"></div>
<div class="bg-grid"></div>
<div id="ptr" class="ptr-indicator"><i class="fa-solid fa-arrows-rotate animate-spin"></i><span>Refreshing…</span></div>

<div class="max-w-[1340px] mx-auto mobile-shell px-3 sm:px-6 pt-3 md:pt-8 space-y-4 md:space-y-6">

    <!-- ══ HEADER ══ -->
    <header class="sticky-hdr anim-fade-up">
        <div class="glass rounded-3xl px-4 py-3 md:px-6 md:py-4 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="relative flex-shrink-0">
                    <div class="w-11 h-11 md:w-13 md:h-13 rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-500 to-purple-600 flex items-center justify-center shadow-xl shadow-indigo-500/40" style="width:46px;height:46px">
                        <i class="fa-solid fa-wallet text-white text-base"></i>
                    </div>
                    <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 class="text-base md:text-2xl font-black tracking-tight text-white leading-tight">Debts Intelligence</h1>
                        <span class="hidden md:inline text-[9px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full uppercase tracking-wider">Live</span>
                    </div>
                    <p id="hdr-subtitle" class="text-[10px] md:text-[11px] text-slate-400 font-semibold tracking-wide">Real-time cashflow visibility &amp; follow-up actions</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5 md:gap-2 flex-shrink-0">
                <button onclick="refreshReport()" class="hdr-btn glass-soft border border-white/10" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
                <a href="debts.html" class="hidden md:flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold shadow-lg shadow-indigo-900/40 transition-all" style="height:40px"><i class="fa-solid fa-plus text-xs"></i><span>Add Debt</span></a>
                <a href="../index.html" class="hdr-btn glass-soft border border-white/10" title="Home"><i class="fa-solid fa-house"></i></a>
                <a href="../settings.html" class="hdr-btn glass-soft border border-white/10" title="Settings"><i class="fa-solid fa-gear"></i></a>
            </div>
        </div>
    </header>

    <!-- ══ UNIFIED TOP METRICS BLOCK ══ -->
    <section id="overview-metrics" class="glass rounded-3xl p-2.5 md:p-3 anim-fade-up delay-1">
        <div class="flex items-center justify-end gap-2 pb-2">
            <input type="hidden" id="overview-view-mode" value="card">
            <button type="button" class="overview-view-chip chip-active-indigo px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1" data-mode="card" onclick="setOverviewView('card')"><i class="fa-solid fa-grip text-[8px]"></i>Card</button>
            <button type="button" class="overview-view-chip chip px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1" data-mode="list" onclick="setOverviewView('list')"><i class="fa-solid fa-list text-[8px]"></i>List</button>
        </div>
        <div class="overview-grid grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-2">
            <article class="overview-card glass-soft rounded-xl p-2.5 border border-white/10 text-center">
                <p class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Active Debts</p>
                <h3 id="active-debts-count" class="text-lg md:text-xl font-black text-white leading-tight mt-1 text-center">0</h3>
            </article>
            <article class="overview-card glass-soft rounded-xl p-2.5 border border-white/10 text-center">
                <p class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">People Involved</p>
                <h3 id="people-count" class="text-lg md:text-xl font-black text-violet-300 leading-tight mt-1 text-center">0</h3>
            </article>
            <article class="overview-card glass-soft rounded-xl p-2.5 border border-white/10 text-center">
                <p class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Settled Records</p>
                <h3 id="settled-count" class="text-lg md:text-xl font-black text-emerald-300 leading-tight mt-1 text-center">0</h3>
            </article>
            <article class="overview-card overview-progress glass-soft rounded-xl p-2.5 border border-white/10 space-y-1.5 text-center">
                <p class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Total Receivable</p>
                <h3 id="total-lent" class="text-lg md:text-xl font-black font-mono text-white leading-tight text-center">₹0</h3>
                <div class="progress-track"><div id="meter-lent" class="progress-fill anim-bar" style="width:0;background:linear-gradient(90deg,#10b981,#34d399,#6ee7b7)"></div></div>
            </article>
            <article class="overview-card overview-progress glass-soft rounded-xl p-2.5 border border-white/10 space-y-1.5 text-center">
                <p class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Total Payable</p>
                <h3 id="total-borrowed" class="text-lg md:text-xl font-black font-mono text-white leading-tight text-center">₹0</h3>
                <div class="progress-track"><div id="meter-borrowed" class="progress-fill anim-bar" style="width:0;background:linear-gradient(90deg,#f43f5e,#fb7185,#fda4af)"></div></div>
            </article>
        </div>
    </section>

    <!-- ══ MAIN CONTENT ══ -->
    <section class="space-y-3 anim-fade-up delay-2">
        <main class="space-y-3">

            <!-- Filter panel -->
            <div class="glass rounded-3xl p-3 md:p-4 space-y-3">
                <!-- Search -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs pointer-events-none"></i>
                    <input type="text" id="search-input" placeholder="Search by name, note or transaction…"
                        class="w-full bg-slate-900/50 border border-slate-700/60 rounded-2xl py-2.5 pl-9 pr-4 text-sm font-medium outline-none focus:border-indigo-500/70 focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-slate-500 transition-all"
                        aria-label="Search debts" onkeyup="filterDebts()">
                </div>

                <!-- Status chips -->
                <div class="flex flex-wrap items-center gap-2">
                    <span class="filter-label mr-1">Status</span>
                    <input type="hidden" id="status-filter" value="pending">
                    <button type="button" class="status-chip chip px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1.5" data-status="pending" onclick="setStatusFilter('pending')">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 inline-block"></span>Pending
                    </button>
                    <button type="button" class="status-chip chip px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1.5" data-status="settled" onclick="setStatusFilter('settled')">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>Settled
                    </button>
                    <button type="button" class="status-chip chip px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1.5" data-status="" onclick="setStatusFilter('')">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 inline-block"></span>All
                    </button>
                </div>

                <!-- Type chips -->
                <div class="flex flex-wrap items-center gap-2">
                    <span class="filter-label mr-1">Type</span>
                    <input type="hidden" id="type-filter" value="">
                    <button type="button" class="type-chip chip px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1.5" data-type="" onclick="setTypeFilter('')">
                        <i class="fa-solid fa-layer-group text-[8px]"></i>All Types
                    </button>
                    <button type="button" class="type-chip chip px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1.5" data-type="lent" onclick="setTypeFilter('lent')">
                        <i class="fa-solid fa-arrow-up-right-from-square text-[8px] text-emerald-400"></i>Lent
                    </button>
                    <button type="button" class="type-chip chip px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1.5" data-type="borrowed" onclick="setTypeFilter('borrowed')">
                        <i class="fa-solid fa-arrow-down-left text-[8px] text-rose-400"></i>Borrowed
                    </button>
                </div>

            </div>

            <!-- List container -->
            <div id="view-people" class="glass rounded-3xl overflow-hidden">
                <div class="flex items-center justify-between px-4 py-3 border-b border-white/5">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-list-ul text-indigo-400 text-xs"></i>
                        <h3 id="list-heading" class="text-[11px] font-bold text-slate-300 uppercase tracking-widest">Pending Debts</h3>
                    </div>
                    <span id="list-count" class="text-[10px] font-bold text-slate-400 bg-slate-800/70 border border-slate-700/60 px-2.5 py-1 rounded-full">0 records</span>
                </div>
                <div id="debts-list-body" class="p-3 space-y-3"></div>
            </div>
        </main>
    </section>
</div>

<!-- ══ LOADER ══ -->
<div id="loader" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/85 backdrop-blur-lg">
    <div class="glass rounded-3xl p-8 flex flex-col items-center gap-5 anim-scale">
        <div class="relative w-16 h-16">
            <div class="absolute inset-0 rounded-full border-4 border-indigo-500/10"></div>
            <div class="absolute inset-0 rounded-full border-4 border-indigo-500 border-t-transparent animate-spin"></div>
            <div class="absolute inset-2 rounded-full border-4 border-violet-500/30 border-b-transparent animate-spin" style="animation-direction:reverse;animation-duration:0.7s"></div>
        </div>
        <div class="text-center space-y-1">
            <h3 class="text-white font-bold text-base">Fetching Data</h3>
            <p class="text-slate-400 text-xs uppercase tracking-widest">Please wait…</p>
        </div>
    </div>
</div>

<a href="debts.html" class="mobile-fab md:hidden" title="Add Debt"><i class="fa-solid fa-plus text-lg"></i></a>

<script src="../localization.js"></script>
<script>
var allDebts = [];
var DEBTS_SCRIPT_URL = (typeof CONFIG !== 'undefined' && CONFIG && CONFIG.GOOGLE_SHEET_URL_DEBTS) ? String(CONFIG.GOOGLE_SHEET_URL_DEBTS).trim() : '';

function parseDebtDate(value) {
    if (!value) return new Date(0);
    if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return new Date(value + 'T00:00:00');
    var m = String(value).match(/^(\d{2})\/(\w{3})\/(\d{4})$/i);
    if (m) { var mo = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11}; return new Date(Number(m[3]), mo[m[2].toLowerCase()], Number(m[1])); }
    var p = new Date(value); return isNaN(p.getTime()) ? new Date(0) : p;
}
function formatDebtDate(v) {
    var d = parseDebtDate(v);
    if (!d || isNaN(d.getTime()) || d.getTime() === 0) return v || '-';
    var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return String(d.getDate()).padStart(2,'0') + '/' + mo[d.getMonth()] + '/' + d.getFullYear();
}
function normalizeDebt(item) {
    var t = String(item.type || '').toLowerCase(), s = String(item.status || '').toLowerCase();
    var parsedId = Number(item.id);
    return { id:(isFinite(parsedId)&&parsedId>0)?parsedId:null, date:item.date?String(item.date):'', type:(t==='taken'||t==='borrowed')?'borrowed':'lent', person:item.person||'', amount:Number(item.amount)||0, remarks:item.remarks||item.notes||'', status:(s==='paid'||s==='settled')?'settled':'pending', settleRemarks:item.settleRemarks||'' };
}
async function fetchDebtsFromServer() {
    if (!DEBTS_SCRIPT_URL) { KTui.toast('Debts script URL missing in config.js','error'); return []; }
    try {
        var res = await fetch(DEBTS_SCRIPT_URL + '?action=list&t=' + Date.now(), { cache:'no-store' });
        var result = await res.json();
        if (!result || !result.success || !Array.isArray(result.data)) { KTui.toast('Invalid response from Google Sheet','error'); return []; }
        return result.data.map(normalizeDebt);
    } catch(e) { console.warn('Debts fetch failed:',e); KTui.toast('Could not load debts','error'); return []; }
}
async function sendDebtAction(action, payload) {
    if (!DEBTS_SCRIPT_URL) { KTui.toast('Debts script URL missing in config.js','error'); return false; }
    try {
        var url = new URL(DEBTS_SCRIPT_URL);
        url.searchParams.set('action', action);
        Object.keys(payload || {}).forEach(function(k) {
            if (payload[k] !== undefined && payload[k] !== null && payload[k] !== '') url.searchParams.set(k, String(payload[k]));
        });
        url.searchParams.set('t', String(Date.now()));
        var res = await fetch(url.toString(), { cache:'no-store' });
        var result = await res.json();
        if (!result || !result.success) { KTui.toast((result&&result.message)||'Action failed','error'); return false; }
        return true;
    } catch(e) { console.warn('Debt action failed:',e); KTui.toast('Action failed: '+e.message,'error'); return false; }
}
function editDebt(item) {
    if (!item || !item.id) { KTui.toast('Missing debt ID for edit','error'); return; }
    window.location.href = 'debts.html?id=' + encodeURIComponent(item.id);
}
async function deleteDebt(id) {
    var confirmed = await new Promise(function(resolve) {
        KTui.confirm('Delete Debt','Are you sure you want to delete this record? This cannot be undone.', function(){ resolve(true); }, { confirmText:'Delete', cancelText:'Cancel', danger:true });
        var cancelBtn = document.querySelector('#__ktui_btns__ .ktui-btn-cancel');
        if (cancelBtn) { cancelBtn.onclick = function(){ KTui.close(); resolve(false); }; }
    });
    if (!confirmed) return;
    var loader = document.getElementById('loader');
    loader.classList.remove('hidden');
    var ok = await sendDebtAction('deleteDebt', { id });
    if (ok) { KTui.toast('Record deleted','success'); await init(); }
    else { loader.classList.add('hidden'); }
}
async function toggleDebtStatus(id, currentStatus) {
    var newStatus = currentStatus === 'settled' ? 'pending' : 'settled';
    var label = newStatus === 'settled' ? 'Settle' : 'Reopen';
    await new Promise(function(resolve) {
        KTui.confirm('Update Status','Mark this debt as ' + newStatus + '?', async function() {
            var remarksInput = document.getElementById('status-remarks-input');
            var remarks = remarksInput ? remarksInput.value.trim() : '';
            var loader = document.getElementById('loader');
            loader.classList.remove('hidden');
            var payload = { id:id, status:newStatus };
            if (remarks) payload.settleRemarks = remarks;
            var ok = await sendDebtAction('updateStatus', payload);
            if (ok) { KTui.toast('Status updated','success'); await init(); }
            else { loader.classList.add('hidden'); }
            resolve();
        }, { confirmText:label, cancelText:'Cancel' });
        setTimeout(function() {
            var msgEl = document.getElementById('__ktui_msg__');
            if (msgEl && !document.getElementById('status-remarks-wrap')) {
                var wrap = document.createElement('div');
                wrap.id = 'status-remarks-wrap';
                wrap.style.marginTop = '12px';
                wrap.innerHTML = '<input id="status-remarks-input" type="text" placeholder="Add remarks (optional)" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:10px 12px;color:#f8fafc;font-size:12px;outline:none;">';
                msgEl.appendChild(wrap);
                var inp = document.getElementById('status-remarks-input');
                if (inp) inp.focus();
            }
            var cancelBtn = document.querySelector('#__ktui_btns__ .ktui-btn-cancel');
            if (cancelBtn) { cancelBtn.onclick = function(){ KTui.close(); resolve(); }; }
        }, 0);
    });
}

function updateStats(debts) {
    var active = debts.filter(function(d){ return d.status !== 'settled'; });
    var lent = active.filter(function(d){ return d.type === 'lent'; }).reduce(function(s,d){ return s+d.amount; }, 0);
    var borrowed = active.filter(function(d){ return d.type === 'borrowed'; }).reduce(function(s,d){ return s+d.amount; }, 0);
    var grand = lent + borrowed;
    var settled = debts.filter(function(d){ return d.status === 'settled'; }).length;
    var peopleSet = new Set(active.map(function(d){ return d.person; }).filter(Boolean));

    document.getElementById('active-debts-count').textContent = active.length.toLocaleString('en-IN');
    document.getElementById('people-count').textContent = peopleSet.size.toLocaleString('en-IN');
    document.getElementById('settled-count').textContent = settled.toLocaleString('en-IN');
    document.getElementById('total-lent').textContent = '\u20B9' + lent.toLocaleString('en-IN');
    document.getElementById('total-borrowed').textContent = '\u20B9' + borrowed.toLocaleString('en-IN');


    document.getElementById('meter-lent').style.width = grand > 0 ? (lent/grand*100).toFixed(1)+'%' : '0%';
    document.getElementById('meter-borrowed').style.width = grand > 0 ? (borrowed/grand*100).toFixed(1)+'%' : '0%';

}

function filterDebts() {
    var search = document.getElementById('search-input').value.toLowerCase();
    var sf = document.getElementById('status-filter').value;
    var tf = document.getElementById('type-filter').value;
    renderDebtsList(allDebts.filter(function(d) {
        return (!search || (d.person||'').toLowerCase().includes(search) || (d.remarks||'').toLowerCase().includes(search))
            && (!sf || d.status === sf)
            && (!tf || d.type === tf);
    }));
}

function setStatusFilter(status, applyFilter) {
    if (applyFilter === undefined) applyFilter = true;
    document.getElementById('status-filter').value = status;
    document.querySelectorAll('.status-chip').forEach(function(chip) {
        var isActive = chip.getAttribute('data-status') === status;
        chip.classList.remove('chip','chip-active-indigo','chip-active-emerald','chip-active-rose');
        if (isActive) {
            chip.classList.add(status === 'pending' ? 'chip-active-indigo' : status === 'settled' ? 'chip-active-emerald' : 'chip-active-indigo');
        } else {
            chip.classList.add('chip');
        }
    });
    updateListHeading();
    if (applyFilter) filterDebts();
}
function setTypeFilter(type, applyFilter) {
    if (applyFilter === undefined) applyFilter = true;
    document.getElementById('type-filter').value = type;
    document.querySelectorAll('.type-chip').forEach(function(chip) {
        var isActive = chip.getAttribute('data-type') === type;
        chip.classList.remove('chip','chip-active-indigo','chip-active-emerald','chip-active-rose');
        if (isActive) {
            chip.classList.add(type === 'lent' ? 'chip-active-emerald' : type === 'borrowed' ? 'chip-active-rose' : 'chip-active-indigo');
        } else {
            chip.classList.add('chip');
        }
    });
    updateListHeading();
    if (applyFilter) filterDebts();
}
function setOverviewView(mode) {
    document.getElementById('overview-view-mode').value = mode;
    var block = document.getElementById('overview-metrics');
    block.classList.toggle('overview-list', mode === 'list');
    document.querySelectorAll('.overview-view-chip').forEach(function(chip) {
        var active = chip.getAttribute('data-mode') === mode;
        chip.classList.remove('chip','chip-active-indigo');
        chip.classList.add(active ? 'chip-active-indigo' : 'chip');
    });
}
function updateListHeading() {
    var sf = document.getElementById('status-filter').value;
    var tf = document.getElementById('type-filter').value;
    var sl = sf === 'pending' ? 'Pending' : sf === 'settled' ? 'Settled' : 'All';
    var tl = tf === 'lent' ? 'Lent' : tf === 'borrowed' ? 'Borrowed' : 'Debts';
    document.getElementById('list-heading').textContent = sl + ' ' + tl;
}

var avatarColors = [
    ['from-blue-500 to-cyan-500','rgba(59,130,246,0.18)'],
    ['from-violet-500 to-purple-600','rgba(139,92,246,0.18)'],
    ['from-pink-500 to-rose-500','rgba(236,72,153,0.18)'],
    ['from-indigo-500 to-blue-600','rgba(99,102,241,0.18)'],
    ['from-teal-500 to-emerald-500','rgba(20,184,166,0.18)'],
    ['from-orange-500 to-amber-500','rgba(249,115,22,0.18)']
];

function renderDebtsList(debts) {
    var body = document.getElementById('debts-list-body');
    body.innerHTML = '';
    var countEl = document.getElementById('list-count');
    countEl.textContent = debts.length.toLocaleString('en-IN') + ' record' + (debts.length !== 1 ? 's' : '');

    if (!debts.length) {
        body.innerHTML = '<div class="py-14 flex flex-col items-center gap-3">'
            + '<div class="w-14 h-14 rounded-2xl bg-slate-800/70 border border-slate-700/60 flex items-center justify-center text-slate-500 text-2xl"><i class="fa-solid fa-inbox"></i></div>'
            + '<p class="text-slate-500 text-xs font-bold uppercase tracking-widest">No matching records</p>'
            + '<p class="text-slate-600 text-[11px]">Try adjusting your filters or search query</p>'
            + '</div>';
        return;
    }

    var sorted = debts.slice().sort(function(a,b){ return parseDebtDate(b.date) - parseDebtDate(a.date); });

    var grouped = sorted.reduce(function(acc,d) {
        var k = d.person || 'Unknown';
        if (!acc[k]) acc[k] = { items:[], net:0, lent:0, borrowed:0 };
        acc[k].items.push(d);
        if (d.type === 'lent') { acc[k].net += d.amount; acc[k].lent += d.amount; }
        else { acc[k].net -= d.amount; acc[k].borrowed += d.amount; }
        return acc;
    }, {});

    Object.keys(grouped).forEach(function(person, gi) {
        var group = grouped[person];
        var ini = person.split(' ').map(function(n){ return n[0]; }).join('').substring(0,2).toUpperCase();
        var ac = avatarColors[person.length % avatarColors.length];
        var nc = group.net >= 0 ? 'text-emerald-400' : 'text-rose-400';
        var netBg = group.net >= 0 ? 'bg-emerald-500/10 border-emerald-500/20' : 'bg-rose-500/10 border-rose-500/20';
        var netLabel = group.net >= 0 ? 'Pays you' : 'You pay';
        var pending = group.items.filter(function(i){ return i.status !== 'settled'; }).length;

        var block = document.createElement('div');
        block.className = 'person-wrap anim-scale';
        block.style.animationDelay = (gi * 0.05) + 's';

        var hdr = document.createElement('div');
        hdr.className = 'person-hdr flex items-center justify-between gap-2';
        hdr.innerHTML =
            '<div class="flex items-center gap-2.5 min-w-0">'
              + '<div class="w-9 h-9 rounded-xl bg-gradient-to-br ' + ac[0] + ' flex items-center justify-center text-white font-black text-[11px] flex-shrink-0 shadow-lg">' + ini + '</div>'
              + '<div class="min-w-0">'
                + '<p class="text-xs font-bold text-white truncate leading-tight">' + person + '</p>'
                + '<p class="text-[9px] text-slate-500 font-semibold">' + group.items.length + ' transaction' + (group.items.length!==1?'s':'') + (pending?' · <span class="text-amber-400">' + pending + ' pending</span>':'') + '</p>'
              + '</div>'
            + '</div>'
            + '<div class="flex items-center gap-2 flex-shrink-0">'
              + '<span class="text-[10px] font-bold ' + nc + ' ' + netBg + ' border px-2.5 py-1 rounded-full font-mono whitespace-nowrap">'
                + netLabel + ' \u20B9' + Math.abs(group.net).toLocaleString('en-IN')
              + '</span>'
            + '</div>';
        block.appendChild(hdr);

        var rowsWrap = document.createElement('div');
        rowsWrap.className = 'p-2 space-y-1.5';

        group.items.forEach(function(item, ri) {
            var isLent = item.type === 'lent', isPaid = item.status === 'settled';
            var col = isLent ? { main:'#10b981', sub:'#34d399', bg:'rgba(16,185,129,0.1)' } : { main:'#f43f5e', sub:'#fb7185', bg:'rgba(244,63,94,0.1)' };
            var dateStr = formatDebtDate(item.date);
            var ds = dateStr.split('/');

            var row = document.createElement('div');
            row.className = 'debt-row type-' + item.type + (isPaid ? ' is-settled' : '') + ' px-3 py-2.5 flex items-center justify-between gap-3';
            row.style.animationDelay = (gi * 0.05 + ri * 0.03) + 's';

            row.innerHTML =
                '<div class="flex items-center gap-2.5 overflow-hidden min-w-0">'
                  + '<div class="flex-shrink-0 flex flex-col items-center justify-center rounded-xl px-2 py-1.5 min-w-[44px] text-center" style="background:' + col.bg + ';border:1px solid ' + col.main + '22">'
                    + '<span class="text-[12px] font-black leading-none" style="color:' + col.main + '">' + (ds[0]||'-') + '</span>'
                    + '<span class="text-[8px] font-bold uppercase leading-none mt-0.5" style="color:' + col.sub + '">' + (ds[1]||'-') + '</span>'
                    + '<span class="text-[8px] font-semibold leading-none mt-0.5 text-slate-500">' + (ds[2]||'-') + '</span>'
                  + '</div>'
                  + '<div class="min-w-0 flex-1">'
                    + '<h4 class="text-xs font-bold text-white truncate leading-tight">' + (isLent?'Given to':'Taken from') + ' <span style="color:' + col.sub + '">' + item.person + '</span></h4>'
                    + '<div class="flex items-center gap-1.5 mt-1 flex-wrap">'
                      + '<span class="badge ' + (isLent?'badge-lent':'badge-borrowed') + '">' + (isLent?'Lent':'Borrowed') + '</span>'
                      + '<span class="badge ' + (isPaid?'badge-settled':'badge-pending') + '">' + (isPaid?'Settled':'Pending') + '</span>'
                    + '</div>'
                    + (item.remarks ? '<p class="text-[10px] text-slate-500 truncate mt-1 leading-tight italic">' + item.remarks + '</p>' : '')
                  + '</div>'
                + '</div>'
                + '<div class="text-right flex-shrink-0">'
                  + '<p class="text-sm font-black font-mono ' + (isPaid?'line-through text-slate-400':'text-white') + '">\u20B9' + item.amount.toLocaleString('en-IN') + '</p>'
                  + '<div class="flex items-center justify-end gap-1 mt-2">'
                    + '<button class="action-btn edit btn-edit" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>'
                    + '<button class="action-btn ' + (isPaid?'reopen':'settle') + ' btn-status" title="' + (isPaid?'Reopen':'Settle') + '"><i class="fa-solid ' + (isPaid?'fa-rotate-left':'fa-circle-check') + '"></i></button>'
                    + '<button class="action-btn del btn-delete" title="Delete"><i class="fa-solid fa-trash-can"></i></button>'
                  + '</div>'
                + '</div>';

            row.querySelector('.btn-edit').addEventListener('click', function(e){ e.stopPropagation(); editDebt(item); });
            row.querySelector('.btn-status').addEventListener('click', function(e){ e.stopPropagation(); if(item.id){ toggleDebtStatus(item.id,item.status); } else { KTui.toast('Cannot update: invalid row ID','error'); } });
            row.querySelector('.btn-delete').addEventListener('click', function(e){ e.stopPropagation(); if(item.id){ deleteDebt(item.id); } else { KTui.toast('Cannot delete: invalid row ID','error'); } });

            rowsWrap.appendChild(row);
        });
        block.appendChild(rowsWrap);
        body.appendChild(block);
    });
}

function refreshReport() { location.reload(); }

async function init() {
    var loader = document.getElementById('loader');
    loader.classList.remove('hidden');
    try {
        allDebts = await fetchDebtsFromServer();
        updateStats(allDebts);
        setOverviewView('card');
        setTypeFilter('', false);
        setStatusFilter('pending');
    } finally {
        loader.classList.add('hidden');
    }
}

var touchStartY = 0;
document.addEventListener('touchstart', function(e){ touchStartY = e.touches[0].clientY; }, { passive:true });
document.addEventListener('touchmove', function(e){ if(window.scrollY===0 && e.touches[0].clientY-touchStartY>100) document.getElementById('ptr').classList.add('active'); }, { passive:true });
document.addEventListener('touchend', function(){ var p=document.getElementById('ptr'); if(p.classList.contains('active')){ location.reload(); setTimeout(function(){ p.classList.remove('active'); }, 1000); } });

init();
</script>
    <script src="../phase2-ui.js"></script>
</body>
