<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../root/logo.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#030305">

    <title data-translate-key="debtsManager">Debts Manager - KT Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../ktui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151a25;
            --primary: #6366f1;
            --accent: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Smooth scrolling */
        html { scroll-behavior: smooth; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .glass-panel {
            background: rgba(21, 26, 37, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-group {
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: rgba(99, 102, 241, 0.05);
        }

        /* Date Picker Customization */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }

        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Radio Button Customization */
        .radio-label input:checked + div {
            background-color: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .radio-label input:checked + div .check-icon {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="min-h-screen pb-40 relative overflow-x-hidden">

    <!-- Background Gradients -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-emerald-600/20 rounded-full blur-[100px]"></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-30 glass-panel border-b border-white/5 px-6 py-4 mb-8 backdrop-blur-xl bg-[#0b0f19]/80">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 ring-4 ring-white/5">
                    <i class="fa-solid fa-handshake text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white leading-tight" data-translate-key="debtsManager">Debts Manager</h1>
                    <p class="text-xs text-gray-400 font-medium" data-translate-key="trackLendingBorrowing">Track Lending & Borrowing</p>
                </div>
            </div>
            <div class="flex gap-3">
                <a href="debtsreport.html" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center transition-all text-gray-400 hover:text-white hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-chart-pie"></i>
                </a>
                <a href="../index.html" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center transition-all text-gray-400 hover:text-white hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4">
        <!-- Add Transaction Form -->
        <div class="glass-panel rounded-3xl p-6 mb-8 border border-white/10 shadow-2xl shadow-black/20">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-plus text-sm"></i>
                </div>
                <h2 class="text-lg font-bold text-white" id="form-title" data-translate-key="addNewDebt">Add New Debt</h2>
            </div>

            <form id="debt-form" class="space-y-5">
                <!-- Type Selection -->
                <div class="grid grid-cols-2 gap-4">
                    <label class="radio-label cursor-pointer relative">
                        <input type="radio" name="type" value="given" checked class="peer sr-only">
                        <div class="px-4 py-2 rounded-xl bg-black/20 border border-white/10 hover:bg-white/5 transition-all flex items-center justify-center gap-2 text-gray-400 peer-checked:text-emerald-400 peer-checked:border-emerald-500/50 peer-checked:bg-emerald-500/10">
                            <i class="fa-solid fa-arrow-trend-up text-base"></i>
                            <span class="font-semibold text-sm">Given</span>
                            <div class="check-icon absolute top-1 right-1 w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs opacity-0 transform scale-50 transition-all duration-300">
                                <i class="fa-solid fa-check"></i>
                            </div>
                        </div>
                    </label>
                    <label class="radio-label cursor-pointer relative">
                        <input type="radio" name="type" value="taken" class="peer sr-only">
                        <div class="px-4 py-2 rounded-xl bg-black/20 border border-white/10 hover:bg-white/5 transition-all flex items-center justify-center gap-2 text-gray-400 peer-checked:text-rose-400 peer-checked:border-rose-500/50 peer-checked:bg-rose-500/10">
                            <i class="fa-solid fa-arrow-trend-down text-base"></i>
                            <span class="font-semibold text-sm">Taken</span>
                            <div class="check-icon absolute top-1 right-1 w-5 h-5 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs opacity-0 transform scale-50 transition-all duration-300">
                                <i class="fa-solid fa-check"></i>
                            </div>
                        </div>
                    </label>
                </div>

                <!-- Person & Amount -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase tracking-wider text-gray-500 font-bold ml-1" data-translate-key="personName">Person Name</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                                <i class="fa-solid fa-user text-sm"></i>
                            </div>
                            <input type="text" id="person" placeholder="e.g. John Doe" required
                                class="w-full bg-black/40 border border-white/10 rounded-2xl pl-10 pr-4 py-3.5 text-sm font-semibold text-white outline-none focus:border-indigo-500 focus:bg-black/60 focus:ring-1 focus:ring-indigo-500 transition-all placeholder-gray-700" data-translate-key="personNamePlaceholder">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase tracking-wider text-gray-500 font-bold ml-1" data-translate-key="amount">Amount</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                                <i class="fa-solid fa-indian-rupee-sign text-sm"></i>
                            </div>
                            <input type="text" id="amount" inputmode="decimal" placeholder="0.00" required
                                class="w-full bg-black/40 border border-white/10 rounded-2xl pl-10 pr-4 py-3.5 text-sm font-mono font-bold text-white outline-none focus:border-indigo-500 focus:bg-black/60 focus:ring-1 focus:ring-indigo-500 transition-all placeholder-gray-700">
                        </div>
                    </div>
                </div>

                <!-- Date & Notes -->
                <div class="space-y-1.5">
                    <label class="text-[10px] uppercase tracking-wider text-gray-500 font-bold ml-1" data-translate-key="date">Date</label>
                    <div class="relative">
                        <input type="date" id="date" required
                            class="w-full bg-black/40 border border-white/10 rounded-2xl px-4 py-3.5 text-sm font-semibold text-white outline-none focus:border-indigo-500 focus:bg-black/60 focus:ring-1 focus:ring-indigo-500 transition-all cursor-pointer">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[10px] uppercase tracking-wider text-gray-500 font-bold ml-1">Remarks</label>
                    <textarea id="remarks" placeholder="Remarks..." rows="2"
                        class="w-full bg-black/40 border border-white/10 rounded-2xl px-4 py-3 text-sm text-gray-300 placeholder-gray-700 outline-none focus:border-indigo-500 focus:bg-black/60 focus:ring-1 focus:ring-indigo-500 transition-all resize-none" data-translate-key="notesPlaceholder"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-2">
                    <button type="button" id="clear-button" class="py-4 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 font-bold flex items-center justify-center gap-2 transition-all active:scale-95">
                        <i class="fa-solid fa-eraser"></i>
                        <span>Clear</span>
                    </button>
                    <button type="submit" id="submit-button" class="py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2.5 transition-all active:scale-95 hover:shadow-indigo-600/40">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span id="submit-label">Save Record</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Loader -->
    <div id="loader" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/75 backdrop-blur-sm">
        <div class="glass-panel rounded-3xl p-6 border border-white/10 flex flex-col items-center gap-4">
            <div class="relative w-14 h-14">
                <div class="absolute inset-0 border-4 border-indigo-500/20 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-indigo-500 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p id="loader-text" class="text-xs uppercase tracking-widest text-gray-300 font-bold">Please wait...</p>
        </div>
    </div>

    <script src="../localization.js"></script>
    <script src="../config.js"></script>
    <script>
        // ── Service Worker ──
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .catch(e => console.log('SW failed:', e));
            });
        }

        // ── Init ──
        const DEFAULT_DEBTS_SCRIPT_URL = (typeof CONFIG !== 'undefined' && CONFIG && CONFIG.GOOGLE_SHEET_URL_DEBTS)
            ? String(CONFIG.GOOGLE_SHEET_URL_DEBTS).trim() : '';
        const SCRIPT_URL = DEFAULT_DEBTS_SCRIPT_URL;

        function isValidScriptUrl(url) {
            if (!url) return false;
            const trimmed = url.trim();
            if (!trimmed || trimmed.includes('YOUR-') || trimmed.includes('SCRIPT-ID')) return false;
            return trimmed.startsWith('https://script.google.com');
        }

        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();

        // DOM Elements
        const form = document.getElementById('debt-form');
        const formTitle = document.getElementById('form-title');
        const submitButton = document.getElementById('submit-button');
        const submitLabel = document.getElementById('submit-label');
        const clearButton = document.getElementById('clear-button');
        const amountInput = document.getElementById('amount');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');

        function formatIndianAmountString(value) {
            const cleaned = String(value || '').replace(/[^\d.]/g, '');
            if (!cleaned) return '';

            const dotIndex = cleaned.indexOf('.');
            const intRaw = dotIndex >= 0 ? cleaned.slice(0, dotIndex) : cleaned;
            const decRaw = dotIndex >= 0 ? cleaned.slice(dotIndex + 1).replace(/\./g, '') : '';

            const intPart = intRaw.replace(/^0+(?=\d)/, '') || '0';
            const last3 = intPart.slice(-3);
            const rest = intPart.slice(0, -3);
            const grouped = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
            const decPart = decRaw.slice(0, 2);

            return dotIndex >= 0 ? grouped + '.' + decPart : grouped;
        }

        function parseIndianAmount(value) {
            const parsed = Number(String(value || '').replace(/,/g, ''));
            return Number.isFinite(parsed) ? parsed : NaN;
        }

        let editingDebtId = null;
        let editingDebtStatus = 'pending';

        function getUrlParameter(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name) || '';
        }

        function setLoader(visible, text) {
            loaderText.textContent = text || 'Please wait...';
            loader.classList.toggle('hidden', !visible);
        }

        function setMode(isEdit) {
            if (isEdit) {
                formTitle.textContent = 'Edit Debt Record';
                submitButton.classList.remove('from-indigo-600', 'to-purple-600');
                submitButton.classList.add('from-emerald-600', 'to-teal-600');
                submitLabel.textContent = 'Update Record';
                return;
            }
            formTitle.textContent = 'Add New Debt';
            submitButton.classList.remove('from-emerald-600', 'to-teal-600');
            submitButton.classList.add('from-indigo-600', 'to-purple-600');
            submitLabel.textContent = 'Save Record';
        }

        async function fetchDebtForEdit(id) {
            if (!isValidScriptUrl(SCRIPT_URL)) {
                KTui.toast('Debts script URL is missing/invalid in config.js', 'error');
                return null;
            }
            try {
                const url = new URL(SCRIPT_URL);
                url.searchParams.set('action', 'getDebt');
                url.searchParams.set('id', String(id));
                url.searchParams.set('t', String(Date.now()));
                const response = await fetch(url.toString(), { cache: 'no-store' });
                const result = await response.json();
                if (result && result.success && result.data) return normalizeDebt(result.data);
                KTui.toast((result && result.message) || 'Could not load debt for edit', 'error');
                return null;
            } catch (error) {
                console.error('Error fetching debt for edit:', error);
                KTui.toast('Error fetching debt for edit: ' + error.message, 'error');
                return null;
            }
        }

        async function initPage() {
            const id = getUrlParameter('id');
            if (!id) { setMode(false); return; }
            editingDebtId = id;
            setLoader(true, 'Loading debt data...');
            const debt = await fetchDebtForEdit(id);
            setLoader(false);
            if (!debt) {
                editingDebtId = null;
                editingDebtStatus = 'pending';
                setMode(false);
                KTui.toast('Debt record not found, switching to add mode.', 'warning');
                return;
            }
            editingDebtStatus = debt.status || 'pending';
            prefillForm(debt);
        }

        window.addEventListener('load', initPage);

        function prefillForm(debt) {
            // Map normalized type back to form values
            const typeVal = (String(debt.type||'').toLowerCase() === 'borrowed' || String(debt.type||'').toLowerCase() === 'taken') ? 'taken' : 'given';
            const radioEl = document.querySelector(`input[name="type"][value="${typeVal}"]`);
            if (radioEl) radioEl.checked = true;
            document.getElementById('person').value = debt.person || '';
            amountInput.value = formatIndianAmountString(debt.amount || '');
            document.getElementById('remarks').value = debt.remarks || '';
            document.getElementById('date').value = formatDateForInput(debt.date);
            setMode(true);
        }

        amountInput.addEventListener('input', function () {
            this.value = formatIndianAmountString(this.value);
        });

        // Form Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const type = document.querySelector('input[name="type"]:checked').value;
            const person = document.getElementById('person').value;
            const amount = parseIndianAmount(amountInput.value);
            const date = document.getElementById('date').value;
            const remarks = document.getElementById('remarks').value;

            if (!Number.isFinite(amount) || amount < 0) {
                KTui.toast('Please enter a valid amount', 'error');
                return;
            }

            const debtData = {
                date: formatDateForStorage(date),
                type,
                person,
                amount,
                remarks,
                status: 'pending' // New debts are always pending initially
            };

            let success = false;
            if (editingDebtId) {
                debtData.id = editingDebtId;
                debtData.status = editingDebtStatus; // preserve original status
                setLoader(true, 'Updating record...');
                success = await updateDebtToServer(debtData);
            } else {
                setLoader(true, 'Saving record...');
                success = await addDebtToServer(debtData);
            }
            setLoader(false);

            if (!success) {
                return;
            }

            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            document.querySelector('input[name="type"][value="given"]').checked = true;

            // Visual feedback on save
            const originalHTML = submitButton.innerHTML;
            const originalClasses = submitButton.className;

            submitButton.innerHTML = '<i class="fa-solid fa-check"></i><span>Saved!</span>';
            submitButton.classList.add('from-emerald-600', 'to-green-600');
            submitButton.classList.remove('from-indigo-600', 'to-purple-600');
            submitButton.disabled = true;

            setTimeout(() => {
                submitButton.innerHTML = originalHTML;
                submitButton.className = originalClasses; // Revert all classes
                submitButton.disabled = false;
                if (editingDebtId) { // If it was an edit, redirect back to report
                    window.location.href = 'debtsreport.html';
                } else {
                    setMode(false);
                }
            }, 1500);
        });

        clearButton.addEventListener('click', function () {
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            document.querySelector('input[name="type"][value="given"]').checked = true;
        });

        async function addDebtToServer(debtData) {
            if (!isValidScriptUrl(SCRIPT_URL)) {
                KTui.toast('Debts script URL is missing/invalid in config.js', 'error');
                return false;
            }

            try {
                const url = new URL(SCRIPT_URL);
                url.searchParams.set('action', 'addDebt');
                Object.keys(debtData).forEach((k) => {
                    if (debtData[k] !== undefined && debtData[k] !== null) {
                        url.searchParams.set(k, String(debtData[k]));
                    }
                });
                url.searchParams.set('t', String(Date.now()));
                const response = await fetch(url.toString(), { cache: 'no-store' });
                const result = await response.json();
                if (!result || !result.success) {
                    KTui.toast((result && result.message) || 'Failed to add record', 'error');
                    return false;
                }
                KTui.toast('Record added to Google Sheet', 'success');
                return true;
            } catch (error) {
                console.warn('Failed to add debt to server:', error);
                KTui.toast('Failed to add record. Check script deployment URL/access.', 'error');
                return false;
            }
        }

        async function updateDebtToServer(debtData) {
            if (!isValidScriptUrl(SCRIPT_URL)) {
                KTui.toast('Debts script URL is missing/invalid in config.js', 'error');
                return false;
            }

            try {
                const url = new URL(SCRIPT_URL);
                url.searchParams.set('action', 'updateDebt');
                Object.keys(debtData).forEach((k) => {
                    if (debtData[k] !== undefined && debtData[k] !== null) {
                        url.searchParams.set(k, String(debtData[k]));
                    }
                });
                url.searchParams.set('t', String(Date.now()));
                const response = await fetch(url.toString(), { cache: 'no-store' });
                const result = await response.json();
                if (!result || !result.success) {
                    KTui.toast((result && result.message) || 'Failed to update record', 'error');
                    return false;
                }
                KTui.toast('Record updated on Google Sheet', 'success');
                return true;
            } catch (error) {
                console.warn('Failed to update debt on server:', error);
                KTui.toast('Failed to update record. Check script deployment URL/access.', 'error');
                return false;
            }
        }

        function formatDateForStorage(dateValue) {
            if (!dateValue) return '';
            const [year, month, day] = dateValue.split('-').map(Number);
            if (!year || !month || !day) return '';
            const dateObj = new Date(year, month - 1, day);
            const monthShort = dateObj.toLocaleString('en-IN', { month: 'short' });
            return `${String(day).padStart(2, '0')}/${monthShort}/${year}`;
        }

        function formatDateForInput(dateString) {
            if (!dateString) return '';
            const dateObj = parseDebtDate(dateString);
            if (isNaN(dateObj.getTime())) return '';
            return dateObj.toISOString().split('T')[0]; // YYYY-MM-DD
        }

        function parseDebtDate(value) {
            if (!value) return new Date(0);
            if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
                return new Date(value + 'T00:00:00');
            }
            const match = String(value).match(/^(\d{2})\/(\w{3})\/(\d{4})$/i);
            if (match) {
                const months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
                const month = months[match[2].toLowerCase()];
                return new Date(Number(match[3]), month, Number(match[1]));
            }
            const parsed = new Date(value);
            return Number.isNaN(parsed.getTime()) ? new Date(0) : parsed;
        }

        function normalizeDebt(item) {
            const typeRaw = String(item.type || '').toLowerCase();
            const statusRaw = String(item.status || '').toLowerCase();
            return {
                id: Number(item.id) || null,
                date: item.date ? String(item.date) : '',
                type: (typeRaw === 'taken' || typeRaw === 'borrowed') ? 'taken' : 'given',
                person: item.person || '',
                amount: Number(item.amount) || 0,
                remarks: item.remarks || item.notes || '',
                status: (statusRaw === 'paid' || statusRaw === 'settled') ? 'settled' : 'pending'
            };
        }
    </script>
</body>
</html>
