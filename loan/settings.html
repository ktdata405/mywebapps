<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../root/logo.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#030305">

    <title>Settings - Loan Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../auth.js"></script>
    <style>
        /* Reusing styles from style.css but adapting for Tailwind integration where needed */
        :root {
            --primary-color: #6C63FF;
            --secondary-color: #2A2D3E;
            --accent-color: #00D2FC;
            --text-color: #2A2D3E;
            --text-light: #8F9BB3;
            --white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --gradient-bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --body-bg-color: #1a1a2e;
            --body-text-color: var(--white);
            --form-label-color: rgba(255, 255, 255, 0.9);
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-text-color: var(--white);
            --input-focus-bg: rgba(0, 0, 0, 0.3);
            --input-focus-shadow: rgba(108, 99, 255, 0.1);
            --header-bg: rgba(11, 15, 25, 0.8); /* Adjusted from original */
            --header-border: rgba(255, 255, 255, 0.05);
            --header-icon-bg: rgba(255, 255, 255, 0.05);
            --header-icon-hover-bg: rgba(255, 255, 255, 0.1);
            --header-icon-color: #a1a1aa; /* Adjusted from original */
            --header-icon-hover-color: var(--white);
            --message-success-bg: rgba(46, 204, 113, 0.2);
            --message-success-color: #2ecc71;
            --message-success-border: rgba(46, 204, 113, 0.3);
            --message-error-bg: rgba(231, 76, 60, 0.2);
            --message-error-color: #e74c3c;
            --message-error-border: rgba(231, 76, 60, 0.3);
        }

        body.light-mode {
            --primary-color: #6C63FF;
            --secondary-color: #2A2D3E;
            --accent-color: #00D2FC;
            --text-color: #2A2D3E;
            --text-light: #8F9BB3;
            --white: #1a202c; /* Dark text for light mode */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --gradient-bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --body-bg-color: #f0f2f5;
            --body-text-color: #1a202c;
            --form-label-color: #4a5568;
            --input-bg: rgba(0, 0, 0, 0.05);
            --input-border: rgba(0, 0, 0, 0.1);
            --input-text-color: #1a202c;
            --input-focus-bg: rgba(0, 0, 0, 0.1);
            --input-focus-shadow: rgba(108, 99, 255, 0.05);
            --header-bg: rgba(255, 255, 255, 0.8);
            --header-border: rgba(0, 0, 0, 0.1);
            --header-icon-bg: rgba(0, 0, 0, 0.05);
            --header-icon-hover-bg: rgba(0, 0, 0, 0.1);
            --header-icon-color: #4a5568;
            --header-icon-hover-color: #1a202c;
            --message-success-bg: rgba(46, 204, 113, 0.1);
            --message-success-color: #2ecc71;
            --message-success-border: rgba(46, 204, 113, 0.2);
            --message-error-bg: rgba(231, 76, 60, 0.1);
            --message-error-color: #e74c3c;
            --message-error-border: rgba(231, 76, 60, 0.2);
        }

        body {
            background: var(--body-bg-color);
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            color: var(--body-text-color);
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body.light-mode {
            background-image: none; /* Remove gradient for light mode */
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
    </style>
    <link rel="stylesheet" href="../modern-ui.css">
</head>
<body class="min-h-screen pb-20 relative overflow-x-hidden flex flex-col items-center justify-center kt-modern-ui">

    <main class="max-w-3xl w-full px-4">
        <!-- Header Block -->
        <div class="glass-panel border-b var(--header-border) px-6 py-4 mb-6 backdrop-blur-xl bg-[var(--header-bg)] rounded-3xl flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 ring-4 ring-white/5">
                    <i class="fas fa-cog text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight var(--body-text-color) leading-tight">Settings</h1>
                </div>
            </div>
            <div class="flex gap-3">
                <a href="loan.html" class="w-10 h-10 rounded-full var(--header-icon-bg) hover:var(--header-icon-hover-bg) border var(--header-border) flex items-center justify-center transition-all var(--header-icon-color) hover:var(--header-icon-hover-color) hover:scale-105 active:scale-95" title="New Loan">
                    <i class="fa-solid fa-plus"></i>
                </a>
                <a href="loanreport.html" class="w-10 h-10 rounded-full var(--header-icon-bg) hover:var(--header-icon-hover-bg) border var(--header-border) flex items-center justify-center transition-all var(--header-icon-color) hover:var(--header-icon-hover-color) hover:scale-105 active:scale-95" title="View Report">
                    <i class="fa-solid fa-chart-pie"></i>
                </a>
                <a href="../index.html" class="w-10 h-10 rounded-full var(--header-icon-bg) hover:var(--header-icon-hover-bg) border var(--header-border) flex items-center justify-center transition-all var(--header-icon-color) hover:var(--header-icon-hover-color) hover:scale-105 active:scale-95" title="Home">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
        </div>

        <!-- Theme Selection Block -->
        <div class="glass-panel rounded-3xl p-6 shadow-2xl shadow-black/20 border var(--glass-border) mb-6">
            <h2 class="text-lg font-semibold mb-4 var(--body-text-color)">Choose Theme</h2>
            <div id="themeGrid" class="theme-grid">
                <!-- Theme cards will be injected here by JavaScript -->
            </div>
        </div>

        <!-- Dark Mode Toggle -->
        <div class="glass-panel rounded-3xl p-6 shadow-2xl shadow-black/20 border var(--glass-border)">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold var(--body-text-color)">Dark Mode</h2>
                <label for="darkModeToggle" class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="darkModeToggle" class="sr-only">
                        <div class="block bg-gray-600 w-14 h-8 rounded-full"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition"></div>
                    </div>
                </label>
            </div>
        </div>
    </main>

    <script src="../config.js"></script>
    <script>
        const themes = [
            { name: "Default Dark", primary: "#6C63FF", secondary: "#00D2FC", bodyBg: "#1a1a2e", text: "#ffffff" },
            { name: "Ocean Blue", primary: "#3498db", secondary: "#2ecc71", bodyBg: "#2c3e50", text: "#ecf0f1" },
            { name: "Forest Green", primary: "#27ae60", secondary: "#2980b9", bodyBg: "#2d3436", text: "#dfe6e9" },
            { name: "Sunset Orange", primary: "#e67e22", secondary: "#f39c12", bodyBg: "#34495e", text: "#ecf0f1" },
            { name: "Royal Purple", primary: "#9b59b6", secondary: "#8e44ad", bodyBg: "#2c3e50", text: "#ecf0f1" },
            { name: "Crimson Red", primary: "#e74c3c", secondary: "#c0392b", bodyBg: "#2d3436", text: "#dfe6e9" },
            { name: "Emerald City", primary: "#1abc9c", secondary: "#16a085", bodyBg: "#2c3e50", text: "#ecf0f1" },
            { name: "Midnight Black", primary: "#34495e", secondary: "#2c3e50", bodyBg: "#000000", text: "#ffffff" },
            { name: "Light Gray", primary: "#bdc3c7", secondary: "#95a5a6", bodyBg: "#ecf0f1", text: "#2c3e50" },
            { name: "Deep Teal", primary: "#008080", secondary: "#004d4d", bodyBg: "#1a2e2e", text: "#e0ffff" },
            { name: "Warm Gold", primary: "#b8860b", secondary: "#daa520", bodyBg: "#362f2f", text: "#fffacd" },
            { name: "Lavender Dream", primary: "#9370db", secondary: "#b19cd9", bodyBg: "#2a2a3a", text: "#e6e6fa" },
            { name: "Charcoal Gray", primary: "#36454F", secondary: "#2c3e50", bodyBg: "#212121", text: "#f5f5f5" },
            { name: "Sky Blue", primary: "#87ceeb", secondary: "#4682b4", bodyBg: "#e0f2f7", text: "#2c3e50" },
            { name: "Olive Green", primary: "#6b8e23", secondary: "#556b2f", bodyBg: "#3a3a2a", text: "#f0fff0" },
            { name: "Pink Lemonade", primary: "#ff69b4", secondary: "#ffb6c1", bodyBg: "#ffe4e1", text: "#4b0082" },
            { name: "Dark Chocolate", primary: "#5a3a2a", secondary: "#4a2a1a", bodyBg: "#2a1a0a", text: "#f5deb3" },
            { name: "Electric Blue", primary: "#00ffff", secondary: "#00bfff", bodyBg: "#0a1a2a", text: "#e0ffff" },
            { name: "Fire Brick", primary: "#b22222", secondary: "#8b0000", bodyBg: "#3a1a1a", text: "#f0f8ff" },
            { name: "Spring Green", primary: "#00ff7f", secondary: "#3cb371", bodyBg: "#1a3a2a", text: "#f0fff0" },
            { name: "Steel Blue", primary: "#4682b4", secondary: "#5f9ea0", bodyBg: "#2a3a4a", text: "#f0f8ff" },
            { name: "Tomato Red", primary: "#ff6347", secondary: "#ff4500", bodyBg: "#3a1a1a", text: "#fffafa" },
            { name: "Turquoise", primary: "#40e0d0", secondary: "#48d1cc", bodyBg: "#1a3a3a", text: "#f0ffff" },
            { name: "Violet", primary: "#ee82ee", secondary: "#da70d6", bodyBg: "#2a1a3a", text: "#f8f8ff" },
            { name: "Wheat", primary: "#f5deb3", secondary: "#deb887", bodyBg: "#4a3a2a", text: "#8b4513" },
            { name: "Yellow Green", primary: "#9acd32", secondary: "#6b8e23", bodyBg: "#2a3a1a", text: "#f5fffa" },
            { name: "Zaffre", primary: "#0014a8", secondary: "#00008b", bodyBg: "#0a0a2a", text: "#e0e0ff" },
            { name: "Amber", primary: "#ffbf00", secondary: "#ff7e00", bodyBg: "#3a2a0a", text: "#fff8dc" },
            { name: "Aqua", primary: "#00ffff", secondary: "#00ced1", bodyBg: "#0a2a2a", text: "#f0ffff" },
            { name: "Azure", primary: "#007fff", secondary: "#00bfff", bodyBg: "#0a1a3a", text: "#f0ffff" },
            { name: "Beige", primary: "#f5f5dc", secondary: "#f5f5dc", bodyBg: "#4a4a3a", text: "#8b4513" },
            { name: "Bisque", primary: "#ffe4c4", secondary: "#ffdead", bodyBg: "#4a3a2a", text: "#8b4513" },
            { name: "Blue Violet", primary: "#8a2be2", secondary: "#9932cc", bodyBg: "#2a1a3a", text: "#e6e6fa" },
            { name: "Brown", primary: "#a52a2a", secondary: "#8b4513", bodyBg: "#3a1a1a", text: "#f5deb3" },
            { name: "Burly Wood", primary: "#deb887", secondary: "#d2b48c", bodyBg: "#4a3a2a", text: "#8b4513" },
            { name: "Cadet Blue", primary: "#5f9ea0", secondary: "#6495ed", bodyBg: "#2a3a3a", text: "#f0f8ff" },
            { name: "Chartreuse", primary: "#7fff00", secondary: "#7cfc00", bodyBg: "#1a3a0a", text: "#f0fff0" },
            { name: "Chocolate", primary: "#d2691e", secondary: "#cd5c5c", bodyBg: "#3a2a1a", text: "#f5deb3" },
            { name: "Coral", primary: "#ff7f50", secondary: "#ff6347", bodyBg: "#3a1a1a", text: "#fffafa" },
            { name: "Cornflower Blue", primary: "#6495ed", secondary: "#4682b4", bodyBg: "#2a3a4a", text: "#f0f8ff" },
            { name: "Cornsilk", primary: "#fff8dc", secondary: "#fffacd", bodyBg: "#4a4a3a", text: "#8b4513" },
            { name: "Cyan", primary: "#00ffff", secondary: "#00ced1", bodyBg: "#0a2a2a", text: "#f0ffff" },
            { name: "Dark Blue", primary: "#00008b", secondary: "#0000cd", bodyBg: "#0a0a2a", text: "#e0e0ff" },
            { name: "Dark Cyan", primary: "#008b8b", secondary: "#008080", bodyBg: "#1a2a2a", text: "#e0ffff" },
            { name: "Dark Goldenrod", primary: "#b8860b", secondary: "#daa520", bodyBg: "#3a2a0a", text: "#fffacd" },
            { name: "Dark Gray", primary: "#a9a9a9", secondary: "#696969", bodyBg: "#2a2a2a", text: "#f5f5f5" },
            { name: "Dark Green", primary: "#006400", secondary: "#008000", bodyBg: "#1a2a1a", text: "#f0fff0" },
            { name: "Dark Khaki", primary: "#bdb76b", secondary: "#b8860b", bodyBg: "#3a3a2a", text: "#fffacd" },
            { name: "Dark Magenta", primary: "#8b008b", secondary: "#9932cc", bodyBg: "#2a1a2a", text: "#e6e6fa" },
            { name: "Dark Olive Green", primary: "#556b2f", secondary: "#6b8e23", bodyBg: "#2a2a1a", text: "#f0fff0" }
        ];

        const themeGrid = document.getElementById('themeGrid');
        const darkModeToggle = document.getElementById('darkModeToggle');

        function applyTheme(themeName) {
            const selectedTheme = themes.find(t => t.name === themeName);
            if (selectedTheme) {
                document.documentElement.style.setProperty('--primary-color', selectedTheme.primary);
                document.documentElement.style.setProperty('--secondary-color', selectedTheme.secondary);
                document.documentElement.style.setProperty('--body-bg-color', selectedTheme.bodyBg);
                document.documentElement.style.setProperty('--body-text-color', selectedTheme.text);
                // Update other relevant CSS variables if needed
                localStorage.setItem('selectedTheme', themeName);
                updateSelectedThemeCard(themeName);
            }
        }

        function updateSelectedThemeCard(selectedThemeName) {
            document.querySelectorAll('.theme-card').forEach(card => {
                if (card.dataset.themeName === selectedThemeName) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
        }

        function applyDarkMode(isDarkMode) {
            if (typeof window.applyAppTheme === 'function') {
                window.applyAppTheme(isDarkMode);
            } else {
                document.body.classList.toggle('dark-mode', isDarkMode);
                document.body.classList.toggle('light-mode', !isDarkMode);
            }
            localStorage.setItem('darkMode', isDarkMode);
            darkModeToggle.checked = isDarkMode;
        }

        // Initialize theme grid
        themes.forEach(theme => {
            const themeCard = document.createElement('div');
            themeCard.className = 'theme-card glass-panel';
            themeCard.dataset.themeName = theme.name;
            themeCard.style.setProperty('--theme-primary', theme.primary);
            themeCard.style.setProperty('--theme-secondary', theme.secondary);

            themeCard.innerHTML = `
                <div class="theme-preview"></div>
                <div class="theme-name">${theme.name}</div>
            `;
            themeCard.addEventListener('click', () => applyTheme(theme.name));
            themeGrid.appendChild(themeCard);
        });

        // Load saved preferences on DOMContentLoaded
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('selectedTheme');
            if (savedTheme) {
                applyTheme(savedTheme);
            } else {
                applyTheme("Default Dark"); // Apply default theme if none saved
            }

            const savedDarkMode = localStorage.getItem('darkMode');
            if (savedDarkMode !== null) {
                applyDarkMode(savedDarkMode === 'true');
            } else {
                applyDarkMode(true); // Default to dark mode
            }
        });

        // Dark Mode Toggle Listener
        darkModeToggle.addEventListener('change', (event) => {
            applyDarkMode(event.target.checked);
        });

        // Service Worker (if applicable)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .catch(e => console.log('SW failed:', e));
            });
        }
    </script>
    <div id="loader" role="status" aria-live="polite" aria-label="Loading page" aria-busy="true"><div class="spinner"></div></div>
    <script src="../phase2-ui.js"></script>
</body>
</html>
