<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../root/logo.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#030305">

    <title data-translate-key="milkBillTitle">Milk Bill - KT Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../config.js"></script>
    <script src="../ktui.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151a25;
            --primary: #6366f1;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .glass-panel {
            background: rgba(21, 26, 37, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Date Accordion Styles from cashew.html */
        .accordion-container {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .calendar-wrapper {
            padding: 0.75rem;
            max-width: 300px;
            margin: 0 auto;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 0.25rem;
        }
        .calendar-header span {
            text-align: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .date-cell {
            aspect-ratio: 1;
            position: relative;
        }
        .date-cell input { display: none; }
        .date-cell label {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
        }

        .date-cell.has-data label {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.2);
        }

        .date-cell.has-draft label {
            background: rgba(251, 146, 60, 0.18);
            color: #fb923c;
            border-color: rgba(251, 146, 60, 0.28);
        }

        .date-cell input:checked + label {
            background: #6366f1 !important;
            color: white !important;
            border-color: #6366f1 !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transform: scale(1.05);
            z-index: 2;
        }

        /* Popup Styles removed — using KTui global popups */
        .popup-overlay { display:none; }
    </style>
    <link rel="stylesheet" href="../modern-ui.css">
    <link rel="stylesheet" href="../module-components.css">
</head>

<body class="min-h-screen pb-40 relative overflow-x-hidden kt-modern-ui">
    <!-- Background Gradients -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[100px]"></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-30 glass-panel border-b border-white/5 px-6 py-4 mb-8 backdrop-blur-xl bg-[#0b0f19]/80">
        <div class="max-w-3xl lg:max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 ring-4 ring-white/5">
                    <i class="fa-solid fa-cow text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white leading-tight" data-translate-key="milkBill">Milk Bill</h1>
                    <p class="text-xs text-gray-400 font-medium">Daily Tracker</p>
                </div>
            </div>
            <div class="flex gap-3">
                <a href="milkreport.html" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center transition-all text-gray-400 hover:text-white" title="Report">
                    <i class="fa-solid fa-chart-pie"></i>
                </a>
                <a href="../index.html" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center transition-all text-gray-400 hover:text-white" title="Home">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 lg:max-w-7xl lg:px-8">
        <div class="lg:grid lg:grid-cols-12 lg:gap-8 items-start">
            <!-- Left Sidebar -->
            <div class="lg:col-span-4 lg:sticky lg:top-28 space-y-6 mb-8 lg:mb-0">
                <!-- Date Input -->
                <div class="glass-panel rounded-3xl p-6 shadow-2xl border border-white/10">
                    <label class="text-[10px] uppercase tracking-wider text-gray-500 font-bold ml-1 mb-2 block" data-translate-key="date">Date</label>
                    <div class="flex items-center gap-3">
                        <button onclick="changeDate(-1)" class="w-12 h-12 rounded-2xl bg-black/40 border border-white/10 text-gray-400 hover:text-white flex items-center justify-center transition-all active:scale-95 hover:bg-white/5">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <input type="date" id="date-input" class="flex-1 bg-black/40 border border-white/10 rounded-2xl px-4 py-3.5 text-white font-bold outline-none focus:border-indigo-500 transition-all" />
                        <button onclick="changeDate(1)" class="w-12 h-12 rounded-2xl bg-black/40 border border-white/10 text-gray-400 hover:text-white flex items-center justify-center transition-all active:scale-95 hover:bg-white/5">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    <div class="mt-3 flex justify-center">
                        <span id="date-save-status" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider transition-all duration-300 bg-gray-500/20 text-gray-400 border border-gray-500/30">
                            <span id="date-save-status-dot" class="w-2 h-2 rounded-full bg-gray-400 inline-block"></span>
                            <span id="date-save-status-text">Checking...</span>
                        </span>
                    </div>
                </div>

                <!-- Date Selection Accordion -->
                <div class="accordion-container">
                    <button type="button" onclick="toggleDateAccordion()" class="w-full p-4 flex justify-between items-center bg-transparent border-none text-white cursor-pointer hover:bg-white/5 transition-colors lg:hidden">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400">
                                <i class="fa-regular fa-calendar-days text-sm"></i>
                            </div>
                            <span class="font-bold text-xs uppercase tracking-wider" id="accordion-month-label">Month Overview</span>
                        </div>
                        <i class="fa-solid fa-chevron-down text-gray-400 text-xs transition-transform duration-300" id="date-accordion-arrow"></i>
                    </button>
                    <div id="date-accordion-content" class="hidden lg:block border-t border-white/5 lg:border-t-0">
                        <div id="date-radio-grid" class="calendar-wrapper">
                            <!-- Radio buttons generated here -->
                        </div>
                        <div class="pb-4 flex items-center gap-4 text-[9px] font-bold text-gray-500 uppercase tracking-widest justify-center">
                            <div class="flex items-center gap-1.5">
                                <span class="w-3 h-3 rounded bg-emerald-500/20 border border-emerald-500/40"></span> Done
                            </div>
                            <div class="flex items-center gap-1.5">
                                <span class="w-3 h-3 rounded bg-orange-500/20 border border-orange-500/30"></span> Draft
                            </div>
                            <div class="flex items-center gap-1.5">
                                <span class="w-3 h-3 rounded bg-white/5 border border-white/10"></span> Empty
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Content -->
            <div class="lg:col-span-8 space-y-6">
                <!-- Collection Inputs -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-panel rounded-3xl p-6 border border-white/10">
                        <label class="text-[10px] uppercase tracking-wider text-gray-500 font-bold ml-1 mb-2 block" data-translate-key="morningCollection">Morning Collection (Liters)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-indigo-400">
                                <i class="fa-solid fa-sun text-sm"></i>
                            </div>
                            <input type="number" step="0.1" id="morning-input" placeholder="1.5" oninput="calculateDaily()" class="w-full bg-black/40 border border-white/10 rounded-2xl pl-10 pr-4 py-3.5 text-white font-mono text-lg font-bold outline-none focus:border-indigo-500 transition-all">
                        </div>
                    </div>

                    <div class="glass-panel rounded-3xl p-6 border border-white/10">
                        <label class="text-[10px] uppercase tracking-wider text-gray-500 font-bold ml-1 mb-2 block" data-translate-key="eveningCollection">Evening Collection (Liters)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-indigo-400">
                                <i class="fa-solid fa-moon text-sm"></i>
                            </div>
                            <input type="number" step="0.1" id="evening-input" placeholder="0.5" oninput="calculateDaily()" class="w-full bg-black/40 border border-white/10 rounded-2xl pl-10 pr-4 py-3.5 text-white font-mono text-lg font-bold outline-none focus:border-indigo-500 transition-all">
                        </div>
                    </div>
                </div>

                <!-- Totals Card -->
                <div class="glass-panel rounded-3xl p-6 border border-indigo-500/30 bg-indigo-500/5">
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div>
                            <p class="text-[10px] uppercase tracking-wider text-gray-500 font-bold mb-1" data-translate-key="dailyTotal">Daily Total</p>
                            <p id="daily-total" class="text-xl font-black text-white font-mono">2.0 L</p>
                        </div>
                        <div>
                            <p class="text-[10px] uppercase tracking-wider text-gray-500 font-bold mb-1" data-translate-key="unitPrice">Unit Price</p>
                            <p class="text-xl font-black text-white font-mono">₹80</p>
                        </div>
                        <div>
                            <p class="text-[10px] uppercase tracking-wider text-gray-500 font-bold mb-1" data-translate-key="dailyCost">Daily Cost</p>
                            <p id="daily-cost" class="text-xl font-black text-emerald-400 font-mono">₹160.00</p>
                            <button type="button" onclick="toggleDailyCostEdit()" id="daily-cost-edit-btn" class="mt-2 text-[10px] uppercase tracking-wider font-bold text-indigo-300 hover:text-indigo-200 transition-colors">Edit Cost</button>
                        </div>
                    </div>
                    <div id="daily-cost-edit-wrap" class="hidden mt-4 pt-4 border-t border-white/10">
                        <label for="daily-cost-input" class="text-[10px] uppercase tracking-wider text-gray-500 font-bold ml-1 mb-2 block">Manual Daily Cost (INR)</label>
                        <input type="number" step="0.01" min="0" id="daily-cost-input" oninput="handleDailyCostInput()" placeholder="160.00" class="w-full bg-black/40 border border-white/10 rounded-2xl px-4 py-3.5 text-white font-mono text-lg font-bold outline-none focus:border-indigo-500 transition-all" />
                    </div>
                </div>

                <!-- Remarks Input -->
                <div class="glass-panel rounded-3xl p-6 border border-white/10">
                    <label class="text-[10px] uppercase tracking-wider text-gray-500 font-bold ml-1 mb-2 block">Remarks / Address</label>
                    <div class="relative">
                        <div class="absolute top-4 left-4 pointer-events-none text-indigo-400">
                            <i class="fa-solid fa-comment-dots text-sm"></i>
                        </div>
                        <textarea id="remarks-input" placeholder="Enter remarks..." class="w-full bg-black/40 border border-white/10 rounded-2xl pl-10 pr-4 py-3.5 text-white font-medium outline-none focus:border-indigo-500 transition-all resize-none h-[100px]" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <div class="fixed bottom-0 left-0 w-full glass-panel border-t border-white/10 z-40 pb-safe bg-[#0b0f19]/90 backdrop-blur-xl">
        <div class="max-w-3xl lg:max-w-7xl mx-auto px-6 py-4 flex items-center justify-end gap-3">
            <button onclick="clearInputs()" class="w-12 h-12 rounded-2xl bg-white/5 hover:bg-red-500/10 border border-white/5 text-gray-400 hover:text-red-400 flex items-center justify-center transition-all active:scale-95">
                <i class="fa-solid fa-trash-can"></i>
            </button>
            <button onclick="saveMilkData('draft')" id="save-draft-btn" class="h-12 px-8 rounded-2xl bg-gray-600/70 hover:bg-gray-500/80 text-white font-bold shadow-lg flex items-center gap-2.5 transition-all active:scale-95">
                <i class="fa-solid fa-file-pen"></i>
                <span>Draft</span>
            </button>
            <button onclick="saveMilkData('completed')" id="save-btn" class="h-12 px-8 rounded-2xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold shadow-lg flex items-center gap-2.5 transition-all active:scale-95">
                <i class="fa-solid fa-check"></i>
                <span data-translate-key="save">Save</span>
            </button>
        </div>
    </div>

    <div id="loader" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="flex flex-col items-center gap-4">
            <div class="animate-spin">
                <i class="fa-solid fa-circle-notch text-5xl text-indigo-400"></i>
            </div>
            <p id="loader-text" class="text-white font-medium">Saving...</p>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="../localization.js"></script>
    <script>
        // ── Service Worker ──
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .catch(e => console.log('SW failed:', e));
            });
        }

        const UNIT_PRICE = 80;
        const DEFAULT_MORNING = 1.5;
        const DEFAULT_EVENING = 0.5;
        //const MILK_API_URL = 'https://script.google.com/macros/s/AKfycbw9HPgLQojIqypEKeaCpwdZtdXmM7gqANY8LFWLWUAe5CNexRLTyrrX6JLFmiZC03B4CQ/exec';
        const MILK_API_URL = CONFIG.GOOGLE_SHEET_URL_MILK;
        let isDailyCostManual = false;

        function getDisplayedDailyCost() {
            return parseFloat(document.getElementById('daily-cost').textContent.replace('₹', '')) || 0;
        }

        function setDailyCost(cost) {
            document.getElementById('daily-cost').textContent = `₹${cost.toFixed(2)}`;
        }

        function toggleDailyCostEdit() {
            const wrap = document.getElementById('daily-cost-edit-wrap');
            const btn = document.getElementById('daily-cost-edit-btn');
            const input = document.getElementById('daily-cost-input');

            isDailyCostManual = !isDailyCostManual;
            if (isDailyCostManual) {
                input.value = getDisplayedDailyCost().toFixed(2);
                wrap.classList.remove('hidden');
                btn.textContent = 'Auto Cost';
                handleDailyCostInput();
                return;
            }

            wrap.classList.add('hidden');
            btn.textContent = 'Edit Cost';
            calculateDaily();
        }

        function handleDailyCostInput() {
            if (!isDailyCostManual) return;
            const manualCost = parseFloat(document.getElementById('daily-cost-input').value);
            setDailyCost(Number.isFinite(manualCost) ? manualCost : 0);
        }

        function normalizeSheetDate(dateStr) {
            if (!dateStr) return '';
            const normalized = String(dateStr).trim();
            if (/^\d{2}\/[A-Za-z]{3}\/\d{4}$/.test(normalized)) {
                return normalized;
            }
            try {
                const asInput = formatToInputDate(normalized);
                return asInput ? formatToDDMMMYYYY(asInput) : '';
            } catch (e) {
                return '';
            }
        }

        function setInputsForSelectedDate(rowData) {
            const morningInput = document.getElementById('morning-input');
            const eveningInput = document.getElementById('evening-input');
            const remarksInput = document.getElementById('remarks-input');

            if (rowData) {
                const morning = parseFloat(rowData.morning);
                const evening = parseFloat(rowData.evening);
                morningInput.value = Number.isFinite(morning) ? morning : DEFAULT_MORNING;
                eveningInput.value = Number.isFinite(evening) ? evening : DEFAULT_EVENING;
                remarksInput.value = rowData.remarks || '';
            } else {
                morningInput.value = DEFAULT_MORNING;
                eveningInput.value = DEFAULT_EVENING;
                remarksInput.value = '';
            }

            if (isDailyCostManual) {
                toggleDailyCostEdit();
            }
            calculateDaily();
        }

        function changeDate(offset) {
            const dateInput = document.getElementById('date-input');
            const currentDate = new Date(dateInput.value);
            if (!isNaN(currentDate.getTime())) {
                currentDate.setDate(currentDate.getDate() + offset);
                const newDate = currentDate.toISOString().split('T')[0];
                dateInput.value = newDate;
                initDateAccordion(newDate);
            }
        }

        function updateDateSaveStatus(hasSavedData, loading = false, stage = null) {
            const badge = document.getElementById('date-save-status');
            const dot = document.getElementById('date-save-status-dot');
            const text = document.getElementById('date-save-status-text');
            if (!badge) return;

            const saveBtn = document.getElementById('save-btn');
            const saveDraftBtn = document.getElementById('save-draft-btn');
            const applySaveButtonStatusStyle = (state) => {
                const baseCompleted = 'h-12 px-8 rounded-2xl text-white font-bold flex items-center gap-2.5 transition-all active:scale-95';
                const baseDraft = 'h-12 px-8 rounded-2xl text-white font-bold flex items-center gap-2.5 transition-all active:scale-95';
                if (state === 'loading') {
                    if (saveBtn) saveBtn.className = `${baseCompleted} bg-gray-600/80 hover:bg-gray-500/90 border border-gray-400/30`;
                    if (saveDraftBtn) saveDraftBtn.className = `${baseDraft} bg-gray-600/80 hover:bg-gray-500/90 border border-gray-400/30`;
                } else if (state === 'saved') {
                    if (saveBtn) saveBtn.className = `${baseCompleted} bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-lg shadow-emerald-600/30 hover:shadow-emerald-600/45`;
                    if (saveDraftBtn) saveDraftBtn.className = `${baseDraft} bg-gray-600/70 hover:bg-gray-500/80 shadow-lg shadow-gray-600/30`;
                } else if (state === 'draft') {
                    if (saveBtn) saveBtn.className = `${baseCompleted} bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 shadow-lg shadow-orange-600/30`;
                    if (saveDraftBtn) saveDraftBtn.className = `${baseDraft} bg-orange-700/70 hover:bg-orange-600/80 shadow-lg shadow-orange-700/30`;
                } else {
                    if (saveBtn) saveBtn.className = `${baseCompleted} bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 shadow-lg shadow-red-600/30 hover:shadow-red-600/45`;
                    if (saveDraftBtn) saveDraftBtn.className = `${baseDraft} bg-gray-600/70 hover:bg-gray-500/80 shadow-lg shadow-gray-600/30`;
                }
            };

            if (loading) {
                badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider transition-all duration-300 bg-gray-500/20 text-gray-400 border border-gray-500/30';
                dot.className = 'w-2 h-2 rounded-full bg-gray-400 inline-block';
                text.textContent = 'Checking...';
                applySaveButtonStatusStyle('loading');
            } else if (hasSavedData && stage === 'draft') {
                badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider transition-all duration-300 bg-orange-500/20 text-orange-400 border border-orange-500/40';
                dot.className = 'w-2 h-2 rounded-full bg-orange-400 inline-block';
                text.textContent = 'Draft';
                applySaveButtonStatusStyle('draft');
            } else if (hasSavedData) {
                badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider transition-all duration-300 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400 inline-block';
                text.textContent = 'Done';
                applySaveButtonStatusStyle('saved');
            } else {
                badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider transition-all duration-300 bg-red-500/20 text-red-400 border border-red-500/40';
                dot.className = 'w-2 h-2 rounded-full bg-red-400 inline-block';
                text.textContent = 'No Data';
                applySaveButtonStatusStyle('no-data');
            }
        }

        // Convert DD/MMM/YYYY to YYYY-MM-DD for the date input
        function formatToInputDate(dateStr) {
            if (!dateStr) return '';
            // Try DD/MMM/YYYY
            const slashParts = dateStr.split('/');
            if (slashParts.length === 3) {
                const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                const m = String(months.indexOf(slashParts[1]) + 1).padStart(2, '0');
                return `${slashParts[2]}-${m}-${slashParts[0].padStart(2,'0')}`;
            }
            // Already YYYY-MM-DD
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
            // Try "01 Jan 2024" space-separated
            const spaceParts = dateStr.split(' ');
            if (spaceParts.length === 3) {
                const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                const m = String(months.indexOf(spaceParts[1]) + 1).padStart(2, '0');
                return `${spaceParts[2]}-${m}-${spaceParts[0].padStart(2,'0')}`;
            }
            return new Date(dateStr).toISOString().split('T')[0];
        }

        // Convert YYYY-MM-DD to DD/MMM/YYYY for storage
        function formatToDDMMMYYYY(inputVal) {
            const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const [year, month, day] = inputVal.split('-');
            if (!year || !month || !day) return '';
            return `${day}/${months[parseInt(month) - 1]}/${year}`;
        }

        function init() {
            const dateInput = document.getElementById('date-input');
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;

            // Default values
            document.getElementById('morning-input').value = DEFAULT_MORNING;
            document.getElementById('evening-input').value = DEFAULT_EVENING;

            // Check for edit data
            const editData = localStorage.getItem('milkEditData');
            if (editData) {
                const data = JSON.parse(editData);
                localStorage.removeItem('milkEditData');

                dateInput.value = formatToInputDate(data.date);
                document.getElementById('morning-input').value = data.morning;
                document.getElementById('evening-input').value = data.evening;
                document.getElementById('remarks-input').value = data.remarks || '';
            }

            calculateDaily();
            initDateAccordion(dateInput.value);

            dateInput.addEventListener('change', () => {
                initDateAccordion(dateInput.value);
            });
        }

        function calculateDaily() {
            const morning = parseFloat(document.getElementById('morning-input').value) || 0;
            const evening = parseFloat(document.getElementById('evening-input').value) || 0;
            const total = morning + evening;
            const cost = total * UNIT_PRICE;

            document.getElementById('daily-total').textContent = `${total.toFixed(1)} L`;
            if (!isDailyCostManual) {
                setDailyCost(cost);
            }
        }

        function clearInputs() {
            document.getElementById('morning-input').value = String(DEFAULT_MORNING);
            document.getElementById('evening-input').value = String(DEFAULT_EVENING);
            document.getElementById('remarks-input').value = '';

            if (isDailyCostManual) {
                toggleDailyCostEdit();
            }
            calculateDaily();
        }

        function showPopup(title, msg, type = 'success') {
            KTui.alert(title, msg, type === 'success' ? 'success' : 'error');
        }

        function saveMilkData(status) {
            const dateInputVal = document.getElementById('date-input').value;
            const morning = parseFloat(document.getElementById('morning-input').value) || 0;
            const evening = parseFloat(document.getElementById('evening-input').value) || 0;
            const remarks = document.getElementById('remarks-input').value;
            const normalizedStage = String(status || 'completed').toLowerCase() === 'draft' ? 'draft' : 'completed';
            const dailyCost = isDailyCostManual
                ? (parseFloat(document.getElementById('daily-cost-input').value) || 0)
                : (morning + evening) * UNIT_PRICE;

            if (!dateInputVal) {
                showPopup('Error', 'Please select a date', 'error');
                return;
            }

            // Format date as DD/MMM/YYYY for storage
            const date = formatToDDMMMYYYY(dateInputVal);

            const loader = document.getElementById('loader');
            const saveBtn = document.getElementById('save-btn');
            const saveDraftBtn = document.getElementById('save-draft-btn');
            loader.classList.remove('hidden');
            if (saveBtn) saveBtn.disabled = true;
            if (saveDraftBtn) saveDraftBtn.disabled = true;

            const payload = {
                type: 'milk',
                action: 'add',
                date: date,
                morning: morning,
                evening: evening,
                unitPrice: UNIT_PRICE,
                dailyCost: dailyCost,
                remarks: remarks,
                stage: normalizedStage
            };

            fetch(MILK_API_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                mode: 'no-cors'
            })
            .then(() => {
                loader.classList.add('hidden');
                if (saveBtn) saveBtn.disabled = false;
                if (saveDraftBtn) saveDraftBtn.disabled = false;
                showPopup('Success', `Data saved successfully! Stage: ${normalizedStage === 'draft' ? 'Draft' : 'Completed'}`, 'success');
                updateDateSaveStatus(true, false, normalizedStage); // Show correct stage in badge
                clearInputs();
                // Refresh calendar
                initDateAccordion(dateInputVal);
                // Move to next day
                const d = new Date(dateInputVal);
                d.setDate(d.getDate() + 1);
                const nextDay = d.toISOString().split('T')[0];
                document.getElementById('date-input').value = nextDay;
                initDateAccordion(nextDay);
            })
            .catch(error => {
                loader.classList.add('hidden');
                if (saveBtn) saveBtn.disabled = false;
                if (saveDraftBtn) saveDraftBtn.disabled = false;
                console.error('Error:', error);
                showPopup('Error', 'Error saving data', 'error');
            });
        }

        // --- Date Accordion Logic ---
        function toggleDateAccordion() {
            const content = document.getElementById('date-accordion-content');
            const arrow = document.getElementById('date-accordion-arrow');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        async function initDateAccordion(selectedDateStr) {
            let dateObj = new Date(selectedDateStr);
            if (isNaN(dateObj)) dateObj = new Date();

            const monthIndex = dateObj.getMonth();
            const year = dateObj.getFullYear();
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const sheetName = `${months[monthIndex]} ${year}`;

            const label = document.getElementById('accordion-month-label');
            if(label) label.textContent = sheetName;

            updateDateSaveStatus(false, true); // Show loading state

            let existingDates = [];
            let dateStageMap = {}; // date string → 'draft' | 'completed'
            let selectedRow = null;
            try {
                const response = await fetch(`${MILK_API_URL}?sheetName=${encodeURIComponent(sheetName)}&t=${Date.now()}`);
                const result = await response.json();
                const rows = Array.isArray(result.data) ? result.data : [];
                if (rows.length) {
                    existingDates = rows.map(row => normalizeSheetDate(row.date)).filter(Boolean);
                    rows.forEach(row => {
                        const d = normalizeSheetDate(row.date);
                        if (d) dateStageMap[d] = String(row.stage || 'completed').toLowerCase();
                    });
                }

                const dayStr = String(dateObj.getDate()).padStart(2, '0');
                const monthName = months[monthIndex];
                const fullDateStr = `${dayStr}/${monthName}/${year}`;
                selectedRow = rows.find(row => normalizeSheetDate(row.date) === fullDateStr) || null;
            } catch (e) {
                console.error("Failed to fetch existing dates for accordion", e);
            }

            setInputsForSelectedDate(selectedRow);

            // Check if selected date has data and what stage it is
            const dayStr = String(dateObj.getDate()).padStart(2, '0');
            const monthName = months[monthIndex];
            const fullDateStr = `${dayStr}/${monthName}/${year}`;
            const hasData = existingDates.includes(fullDateStr);
            const currentStage = hasData ? (dateStageMap[fullDateStr] || 'completed') : null;
            updateDateSaveStatus(hasData, false, currentStage);

            renderDateRadios(year, monthIndex, existingDates, dateObj.getDate(), dateStageMap);
        }

        function renderDateRadios(year, monthIndex, existingDates, selectedDay, dateStageMap = {}) {
            const firstDay = new Date(year, monthIndex, 1).getDay();
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
            const container = document.getElementById('date-radio-grid');
            container.innerHTML = '';

            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const monthName = months[monthIndex];

            const headerRow = document.createElement('div');
            headerRow.className = 'calendar-header';
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
                const span = document.createElement('span');
                span.textContent = day;
                headerRow.appendChild(span);
            });
            container.appendChild(headerRow);

            const grid = document.createElement('div');
            grid.className = 'calendar-grid';

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayStr = String(i).padStart(2, '0');
                const fullDateStr = `${dayStr}/${monthName}/${year}`;
                const hasData = existingDates.includes(fullDateStr);
                const stage = dateStageMap[fullDateStr] || '';
                const isDraft = hasData && stage === 'draft';

                const wrapper = document.createElement('div');
                wrapper.className = `date-cell ${isDraft ? 'has-draft' : (hasData ? 'has-data' : '')}`;

                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'accordionDate';
                input.id = `date-radio-${i}`;
                if (i === selectedDay) input.checked = true;

                input.onchange = () => {
                    const newDate = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${dayStr}`;
                    document.getElementById('date-input').value = newDate;
                    initDateAccordion(newDate);
                };

                const label = document.createElement('label');
                label.htmlFor = `date-radio-${i}`;
                label.textContent = i;

                wrapper.appendChild(input);
                wrapper.appendChild(label);
                grid.appendChild(wrapper);
            }
            container.appendChild(grid);
        }

        init();
    </script>
    <script src="../phase2-ui.js"></script>
</body>
