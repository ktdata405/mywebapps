<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./theme.js"></script>
    <script>
        // Redirect to legacy home when the unified new-UI setting is disabled.
        const useNewMainUI = localStorage.getItem('useNewMainUI');
        const useNewHomeUI = localStorage.getItem('useNewHomeUI');
        const shouldUseNewHomeUI = useNewMainUI !== null ? useNewMainUI !== 'false' : useNewHomeUI !== 'false';

        if (!shouldUseNewHomeUI) {
            window.location.replace('index_old.html');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KT Apps">
    <link rel="apple-touch-icon" href="root/logo.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#030305">

    <title data-translate-key="appTitle">KT Apps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305;
            --card-bg: rgba(255,255,255,0.03);
            --card-border: rgba(255,255,255,0.07);
            --card-hover-border: rgba(255,255,255,0.15);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --surface: rgba(15,23,42,0.6);
            --radius-card: 20px;
            --app-header-space: 86px;
            --app-footer-space: 76px;
            --bottom-nav-height: 60px; /* New CSS variable for bottom nav height */
        }

        body.dark-mode {
            --bg-color: #030305;
            --card-bg: rgba(255,255,255,0.03);
            --card-border: rgba(255,255,255,0.07);
            --card-hover-border: rgba(255,255,255,0.15);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --surface: rgba(15,23,42,0.6);
        }

        body.light-mode {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --card-border: rgba(0,0,0,0.1);
            --card-hover-border: rgba(0,0,0,0.2);
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --surface: rgba(255,255,255,0.8);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; -webkit-tap-highlight-color:transparent; }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ── Background ─────────────────────── */
        #bg-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:-1; opacity:0.5; }

        /* Ambient glow blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .bg-blob-1 { width:500px; height:500px; background:#6366f1; top:-150px; left:-100px; }
        .bg-blob-2 { width:400px; height:400px; background:#8b5cf6; bottom:-100px; right:-100px; }
        .bg-blob-3 { width:300px; height:300px; background:#06b6d4; top:40%; left:50%; transform:translateX(-50%); opacity:0.07; }

        body::before {
            content:"";
            position:fixed; inset:0; z-index:0;
            background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events:none;
        }

        .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

        /* ── Auth Screen ── */
        #app-content { display:none; position:relative; z-index:1; width:100%; flex:1; flex-direction:column; }

        #auth-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; min-height: 100dvh;
            z-index: 10; position: relative;
            padding: env(safe-area-inset-top,0px) 1.5rem env(safe-area-inset-bottom,0px);
            gap: 0;
        }

        /* Branding */
        .auth-brand { display:flex; flex-direction:column; align-items:center; gap:0.65rem; margin-bottom:2.4rem; }
        .auth-logo-ring { position:relative; width:76px; height:76px; }
        .auth-logo-ring::before, .auth-logo-ring::after {
            content:''; position:absolute; border-radius:50%;
            border:1px solid rgba(99,102,241,0.18);
            animation:ringPulse 2.8s ease-in-out infinite;
        }
        .auth-logo-ring::before { inset:-11px; }
        .auth-logo-ring::after  { inset:-22px; animation-delay:0.5s; opacity:0.45; }
        @keyframes ringPulse { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.03)} }
        .auth-logo-inner {
            width:76px; height:76px; border-radius:22px;
            background:linear-gradient(145deg,rgba(99,102,241,0.20),rgba(139,92,246,0.14));
            border:1px solid rgba(99,102,241,0.28);
            box-shadow:0 12px 40px rgba(99,102,241,0.20);
            display:flex; align-items:center; justify-content:center; overflow:hidden;
        }
        .auth-logo-inner img { width:50px; height:50px; border-radius:14px; object-fit:cover; }
        .auth-title {
            font-size:1.5rem; font-weight:900; letter-spacing:-0.03em;
            background:linear-gradient(135deg,#fff 0%,#c7d2fe 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .auth-sub { font-size:0.75rem; color:rgba(255,255,255,0.30); font-weight:500; margin-top:-2px; }

        /* PIN dots */
        .pin-dots-row { display:flex; gap:18px; justify-content:center; margin-bottom:0.9rem; }
        .pin-dot {
            width:15px; height:15px; border-radius:50%;
            border:2px solid rgba(255,255,255,0.16);
            position:relative;
            transition:all 0.22s cubic-bezier(0.34,1.56,0.64,1);
        }
        .pin-dot::after {
            content:''; position:absolute; inset:2px; border-radius:50%;
            background:linear-gradient(135deg,#a5b4fc,#6366f1);
            opacity:0; transform:scale(0.3);
            transition:all 0.22s cubic-bezier(0.34,1.56,0.64,1);
        }
        .pin-dot.filled { border-color:#6366f1; box-shadow:0 0 10px rgba(99,102,241,0.55); transform:scale(1.18); }
        .pin-dot.filled::after { opacity:1; transform:scale(1); }
        .pin-dot.error { border-color:#f87171 !important; box-shadow:0 0 10px rgba(248,113,113,0.55) !important; }
        .pin-dot.error::after { background:linear-gradient(135deg,#fca5a5,#ef4444) !important; opacity:1; transform:scale(1); }
        @keyframes pinShake {
            0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
        }
        .pin-dots-row.shake { animation:pinShake 0.38s ease; }

        /* Error */
        .pin-error-msg {
            font-size:0.72rem; font-weight:700; color:#f87171;
            text-align:center; letter-spacing:0.03em;
            display:none; margin-bottom:1.2rem; min-height:1em;
        }

        /* PIN input - visible but transparent, sits over dots area for mobile focus */
        #pin-input {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 60px;
            opacity: 0;
            font-size: 16px;
            border: none; outline: none;
            background: transparent;
            color: transparent;
            caret-color: transparent;
            z-index: 20;
        }

        /* PIN hint */
        .pin-hint {
            font-size:0.72rem; color:rgba(255,255,255,0.25); margin-top:1.2rem;
            display:flex; align-items:center; gap:0.4rem;
        }
        .pin-hint i { font-size:0.8rem; }

        header {
            padding:1.2rem 5%;
            display:flex; justify-content:space-between; align-items:center;
            position:sticky; top:0; z-index:20;
            background:rgba(3,3,5,0.7);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(255,255,255,0.05);
            transition: background 0.3s ease, border-bottom 0.3s ease;
        }

        body.light-mode header {
            background:rgba(255,255,255,0.7);
            border-bottom:1px solid rgba(0,0,0,0.05);
        }

        .brand { display:flex; align-items:center; gap:1rem; }

        .brand .logo-img {
            height:44px; width:44px; border-radius:12px;
            object-fit:cover;
            border:1px solid rgba(255,255,255,0.1);
        }

        .brand-text h1 {
            font-size:1.5rem; font-weight:800;
            background:linear-gradient(to right,#fff 20%,#a1a1aa 50%,#fff 80%);
            background-size:200% auto;
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            animation:textShimmer 5s linear infinite;
            line-height:1.1; letter-spacing:-0.02em;
        }
        body.light-mode .brand-text h1 {
            background:linear-gradient(to right,#1a202c 20%,#4a5568 50%,#1a202c 80%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .brand-text .greeting {
            font-size:0.72rem; color:var(--text-secondary); font-weight:500; margin-top:1px;
        }

        @keyframes textShimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }

        .header-actions { display:flex; align-items:center; gap:0.6rem; }

        .nav-btn {
            width:40px; height:40px; border-radius:10px;
            display:flex; align-items:center; justify-content:center;
            font-size:1rem;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            color:var(--text-secondary);
            text-decoration:none;
            transition:all 0.2s ease;
            cursor:pointer;
        }
        .nav-btn:hover { background:rgba(255,255,255,0.1); color:#fff; border-color:rgba(255,255,255,0.15); }
        .nav-btn:active { transform:scale(0.93); }

        body.light-mode .nav-btn {
            background:rgba(0,0,0,0.05);
            border:1px solid rgba(0,0,0,0.08);
            color:var(--text-secondary);
        }
        body.light-mode .nav-btn:hover {
            background:rgba(0,0,0,0.1);
            color:var(--text-primary);
            border-color:rgba(0,0,0,0.15);
        }

        /* ── Search ──────────────────────────── */
        .search-wrapper {
            padding:1rem 5% 0.5rem;
            max-width:1400px; margin:0 auto; width:100%;
            position:relative; z-index:2;
        }

        .search-container { position:relative; width:100%; max-width:440px; }

        .search-input {
            width:100%;
            padding:0.85rem 2.8rem 0.85rem 2.8rem;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:14px;
            color:#fff; font-size:0.95rem;
            outline:none;
            backdrop-filter:blur(10px);
            transition:all 0.2s ease;
        }
        body.light-mode .search-input {
            background:rgba(0,0,0,0.05);
            border:1px solid rgba(0,0,0,0.08);
            color:var(--text-primary);
        }
        .search-input::placeholder { color:rgba(255,255,255,0.3); }
        body.light-mode .search-input::placeholder { color:rgba(0,0,0,0.4); }
        .search-input:focus {
            background:rgba(255,255,255,0.08);
            border-color:rgba(99,102,241,0.4);
            box-shadow:0 0 0 3px rgba(99,102,241,0.1);
        }
        body.light-mode .search-input:focus {
            background:rgba(0,0,0,0.08);
            border-color:rgba(99,102,241,0.4);
            box-shadow:0 0 0 3px rgba(99,102,241,0.1);
        }
        .search-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.3); font-size:0.9rem; pointer-events:none; }
        body.light-mode .search-icon { color:rgba(0,0,0,0.4); }
        .search-clear { position:absolute; right:1rem; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.3); cursor:pointer; font-size:0.9rem; display:none; }
        body.light-mode .search-clear:hover { color:#fff; }
        body.light-mode .search-clear:hover { color:var(--text-primary); }

        /* ── Section Label ───────────────────── */
        .section-label {
            padding:1.2rem 5% 0.6rem;
            max-width:1400px; margin:0 auto; width:100%;
            font-size:0.7rem; font-weight:700; color:rgba(255,255,255,0.25);
            text-transform:uppercase; letter-spacing:0.12em;
            position:relative; z-index:2;
        }
        body.light-mode .section-label { color:rgba(0,0,0,0.35); }

        /* ── Cards Grid ──────────────────────── */
        .container {
            padding:0.5rem 5% 5rem;
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
            gap:0.85rem;
            max-width:1400px; margin:0 auto; width:100%;
            position:relative; z-index:2;
        }

        /* Card */
        .card {
            background:var(--card-bg);
            border:1px solid var(--card-border);
            border-radius:var(--radius-card);
            padding:1.4rem 1.2rem 1.2rem;
            text-decoration:none; color:var(--text-primary);
            position:relative; overflow:hidden;
            display:flex; flex-direction:column;
            align-items:flex-start;
            gap:0.6rem;
            cursor:pointer;
            backdrop-filter:blur(12px);
            min-height:130px;
            transition:transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, background-color 0.3s ease;
            /* Entry animation */
            opacity:0;
            animation:cardIn 0.4s ease forwards;
        }
        body.light-mode .card {
            background:var(--card-bg);
            border:1px solid var(--card-border);
            color:var(--text-primary);
        }

        @keyframes cardIn {
            from { opacity:0; transform:translateY(16px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* Colored top accent bar */
        .card::before {
            content:"";
            position:absolute; top:0; left:0; right:0; height:3px;
            background:var(--accent-color);
            opacity:0.7;
            border-radius:var(--radius-card) var(--radius-card) 0 0;
        }

        /* Spotlight glow */
        .card::after {
            content:"";
            position:absolute; inset:0;
            background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.06) 0%, transparent 60%);
            opacity:0;
            transition:opacity 0.4s;
            pointer-events:none;
            border-radius:inherit;
        }
        body.light-mode .card::after {
            background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(0,0,0,0.06) 0%, transparent 60%);
        }
        .card:hover::after { opacity:1; }

        @media (hover:hover) {
            .card:hover {
                transform:translateY(-4px);
                border-color:var(--card-hover-border);
                box-shadow:0 12px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.05);
            }
            body.light-mode .card:hover {
                box-shadow:0 12px 40px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.05);
            }
        }
        .card:active { transform:scale(0.96); }

        .card-icon {
            width:44px; height:44px; border-radius:12px;
            display:flex; align-items:center; justify-content:center;
            font-size:1.2rem;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.08);
            position:relative; z-index:1;
            transition:all 0.25s ease;
            flex-shrink:0;
        }
        body.light-mode .card-icon {
            background:rgba(0,0,0,0.06);
            border:1px solid rgba(0,0,0,0.08);
        }
        .card-icon i { color:var(--accent-color); }
        .card:hover .card-icon {
            background:rgba(255,255,255,0.1);
            border-color:var(--accent-color);
            box-shadow:0 0 18px var(--accent-color);
            transform:scale(1.08);
        }
        body.light-mode .card:hover .card-icon {
            background:rgba(0,0,0,0.1);
            color:var(--text-primary);
        }
        .card:hover .card-icon i { color:#fff; }

        .card-body { position:relative; z-index:1; flex:1; }
        .card-body h2 { font-size:0.95rem; font-weight:700; letter-spacing:-0.01em; line-height:1.2; }
        .card-body p { font-size:0.72rem; color:var(--text-secondary); margin-top:3px; line-height:1.3; }

        .card-arrow {
            position:absolute; bottom:1rem; right:1rem;
            width:26px; height:26px; border-radius:8px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            display:flex; align-items:center; justify-content:center;
            color:rgba(255,255,255,0.2); font-size:0.7rem;
            transition:all 0.2s ease;
            z-index:1;
        }
        body.light-mode .card-arrow {
            background:rgba(0,0,0,0.05);
            border:1px solid rgba(0,0,0,0.08);
            color:rgba(0,0,0,0.3);
        }
        .card:hover .card-arrow { background:var(--accent-color); border-color:transparent; color:#fff; transform:rotate(-45deg); box-shadow:0 0 12px var(--accent-color); }

        /* Card accent colours */
        .card-cashew { --accent-color:#f472b6; }
        .card-milk   { --accent-color:#e2e8f0; }
        .card-rent   { --accent-color:#c084fc; }
        .card-msi    { --accent-color:#38bdf8; }
        .card-debts  { --accent-color:#f87171; }
        .card-deno   { --accent-color:#4ade80; }
        .card-calc   { --accent-color:#fb923c; }
        .card-loan   { --accent-color:#818cf8; }
        .card-scan   { --accent-color:#a78bfa; }

        /* Stagger animation delays */
        .card:nth-child(1){animation-delay:0.05s}
        .card:nth-child(2){animation-delay:0.10s}
        .card:nth-child(3){animation-delay:0.15s}
        .card:nth-child(4){animation-delay:0.20s}
        .card:nth-child(5){animation-delay:0.25s}
        .card:nth-child(6){animation-delay:0.30s}
        .card:nth-child(7){animation-delay:0.35s}
        .card:nth-child(8){animation-delay:0.40s}
        .card:nth-child(9){animation-delay:0.45s}

        .no-results { grid-column:1/-1; text-align:center; padding:3rem 2rem; color:var(--text-secondary); display:none; }

        /* ── Infographic Layout ──────────────────── */
        :root {
            --inf-color-1: #f472b6;
            --inf-color-2: #e2e8f0;
            --inf-color-3: #c084fc;
            --inf-color-4: #38bdf8;
            --inf-color-5: #f87171;
            --inf-color-6: #4ade80;
            --inf-color-7: #fb923c;
            --inf-color-8: #818cf8;
            --inf-color-9: #a78bfa;
        }

        .infographic-wrapper {
            padding: clamp(1rem, 2.6vw, 2rem) max(4%, env(safe-area-inset-left)) calc(clamp(1rem, 2.6vw, 2rem) + env(safe-area-inset-bottom)) max(4%, env(safe-area-inset-right));
            display: grid;
            place-items: center;
            position: relative;
            z-index: 2;
            flex: 1;
            min-height: 0;
            width: 100%;
            min-height: calc(100dvh - var(--app-header-space) - var(--app-footer-space) - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        }

        .infographic-container {
            display: grid;
            grid-template-columns: minmax(250px, 1fr) minmax(220px, 300px) minmax(250px, 1fr);
            align-items: center;
            justify-content: center;
            gap: clamp(18px, 2.6vw, 40px);
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .inf-center-circle {
            width: clamp(220px, 24vw, 280px);
            height: clamp(220px, 24vw, 280px);
            border-radius: 50%;
            background: var(--surface);
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            position: relative;
            z-index: 10;
            animation: centerFloat 5.6s ease-in-out infinite, centerGlow 3.2s ease-in-out infinite;
        }

        .inf-center-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inf-center-logo {
            width: clamp(72px, 8.5vw, 96px);
            height: clamp(72px, 8.5vw, 96px);
            border-radius: 24px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 12px 26px rgba(0,0,0,0.35), 0 0 18px rgba(99,102,241,0.35);
            animation: logoPulse 2.8s ease-in-out infinite, logoSpinDrift 11s linear infinite;
            will-change: transform;
        }

        .inf-center-circle::before {
            content: '';
            position: absolute;
            top: -12px; left: -12px; right: -12px; bottom: -12px;
            border-radius: 50%;
            background: conic-gradient(
                var(--inf-color-1) 0deg 40deg,
                var(--inf-color-2) 40deg 80deg,
                var(--inf-color-3) 80deg 120deg,
                var(--inf-color-4) 120deg 160deg,
                var(--inf-color-5) 160deg 200deg,
                var(--inf-color-6) 200deg 240deg,
                var(--inf-color-7) 240deg 280deg,
                var(--inf-color-8) 280deg 320deg,

    <canvas id="bg-canvas"></canvas>
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>

    <!-- ── Auth Screen ── -->
    <div id="auth-container">

        <div class="auth-brand">
            <div class="auth-logo-ring">
                <div class="auth-logo-inner">
                    <img src="root/logo.png" alt="KT Apps">
                </div>
            </div>
            <div class="auth-title">KT Apps</div>
            <div class="auth-sub" id="auth-greeting-text">Good morning</div>
        </div>

        <div class="pin-dots-row" id="pin-dots-row">
            <div class="pin-dot" id="dot-0"></div>
            <div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div>
        </div>
        <div class="pin-error-msg" id="pin-error-msg"></div>

        <input type="password" id="pin-input" inputmode="numeric"
               pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="PIN">

        <div class="pin-hint">
            <i class="fa-solid fa-keyboard"></i> Type your 4-digit PIN
        </div>

    </div>

    <!-- ── App Content ── -->
    <div id="app-content" style="display: none;">
        <header>
            <div class="brand">
                <img src="root/logo.png" alt="Logo" class="logo-img">
                <div class="brand-text">
                    <h1 data-translate-key="holaKT">Hola KT 👋</h1>
                    <p class="greeting" id="greeting-text">Good morning</p>
                </div>
            </div>
            <div class="header-actions">
                <a href="settings.html" class="nav-btn" aria-label="Settings" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </a>
                <a href="dashboard.html" class="nav-btn" aria-label="Dashboard" title="Dashboard">
                    <i class="fa-solid fa-chart-line"></i>
                </a>
            </div>
        </header>

        <main class="infographic-wrapper" id="cards-container">
            <div class="infographic-container center-wheel-layout" id="center-wheel-layout">
                <!-- Left column: nodes 1-5 -->
                <div class="inf-column inf-left-column" id="inf-left"></div>

                <!-- Center circle -->
                <div class="inf-center-circle">
                    <div class="inf-center-content">
                        <img src="root/logo.png" alt="KT Apps" class="inf-center-logo">
                        <h1 class="inf-center-title">KT Apps</h1>
                    </div>
                </div>

                <!-- Right column: nodes 6-9 -->
                <div class="inf-column inf-right-column" id="inf-right"></div>
            </div>

            <div class="side-wheel-layout" id="side-wheel-layout">
                <div class="side-main-wheel">
                    <div class="side-main-wheel-content">
                        <img src="root/logo.png" alt="KT Apps" class="side-main-wheel-logo">
                        <h2 class="side-main-wheel-label">KT Apps</h2>
                    </div>
                </div>
                <div class="side-nodes-column" id="side-nodes"></div>
            </div>

            <div class="temp-wheel-layout" id="temp-wheel-layout">
                <div class="temp-wheel-container">
                    <svg class="temp-lines-container" id="temp-svg-canvas"></svg>
                    <div class="temp-orbit-system" id="temp-orbit-system"></div>
                    <div class="temp-center-wheel-wrapper">
                        <div class="temp-gear-wheel"><div class="temp-gear-teeth-extra"></div></div>
                        <div class="temp-wheel-content">
                            <img src="root/logo.png" alt="KT Apps" class="temp-wheel-bg-icon">
                            <div class="temp-wheel-title-bottom">KT Apps</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p data-translate-key="copyright_thammineni">&copy; 2024 <b>Thammineni Technologies</b>. All rights reserved.</p>
        </footer>
    </div>

    <div id="loader"><div class="spinner"></div></div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="dashboard.html" class="bottom-nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Reports</span>
        </a>
        <a href="settings.html" class="bottom-nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>
    </nav>

    <script src="./auth.js"></script>
    <script src="./localization.js"></script>
    <script>
        // ── Service Worker ──
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(e => console.log('SW failed:', e));
            });
        }

        // Function to apply theme
        function applyTheme(isDarkMode) {
            if (typeof window.applyAppTheme === 'function') {
                window.applyAppTheme(isDarkMode);
                return;
            }
            document.body.classList.toggle('dark-mode', isDarkMode);
            document.body.classList.toggle('light-mode', !isDarkMode);
        }

        // Function to apply all saved settings
        function applyAllSettings() {
            // Apply Dark Mode
            const savedDarkMode = localStorage.getItem('darkMode');
            if (savedDarkMode !== null) {
                applyTheme(savedDarkMode === 'true');
            } else {
                // Default to dark mode if no preference is saved
                applyTheme(true);
            }

            // Apply Language
            const savedLanguage = localStorage.getItem('language');
            if (savedLanguage && typeof setLanguage === 'function') {
                setLanguage(savedLanguage);
                if (typeof updateContentLanguage === 'function') {
                    updateContentLanguage();
                }
            }

            const useSideWheelUI = localStorage.getItem('useSideWheelUI') === 'true';
            const useTempWheelUI = localStorage.getItem('useTempWheelUI') === 'true';
            document.body.classList.toggle('temp-wheel-ui', useTempWheelUI);
            document.body.classList.toggle('side-wheel-ui', !useTempWheelUI && useSideWheelUI);

            // Apply Notifications preference (no direct visual impact on index.html, but state is loaded)
            const notificationsEnabled = localStorage.getItem('notificationsEnabled') === 'true';
            console.log('Notifications Enabled (index.html):', notificationsEnabled);

            // Apply Fingerprint Unlock preference (no direct visual impact on index.html, but state is loaded)
            const fingerprintUnlockEnabled = localStorage.getItem('fingerprintUnlock') === 'true';
            console.log('Fingerprint Unlock Enabled (index.html):', fingerprintUnlockEnabled);
        }

        // Apply settings as early as possible
        applyAllSettings();

        // ── Greeting (main app) ──
        function setGreeting() {
            const h = new Date().getHours();
            const el = document.getElementById('greeting-text');
            if (!el) return;
            el.textContent = h < 12 ? 'Good morning ☀️' : h < 17 ? 'Good afternoon 🌤️' : h < 21 ? 'Good evening 🌙' : 'Good night 🌟';
        }
        setGreeting();

        // ── Auth greeting ──
        (function() {
            const h = new Date().getHours();
            const el = document.getElementById('auth-greeting-text');
            if (el) el.textContent = h < 12 ? 'Good morning ☀️' : h < 17 ? 'Good afternoon 🌤️' : h < 21 ? 'Good evening 🌙' : 'Good night 🌟';
        })();

        // ── PIN Logic ──
        document.addEventListener('DOMContentLoaded', () => {
            const pinEnabled = localStorage.getItem('pinEnabled') === 'true';
            const appPin = localStorage.getItem('appPin');

            const authContainer = document.getElementById('auth-container');
            const appContent = document.getElementById('app-content');
            const input = document.getElementById('pin-input');
            const dotsRow = document.getElementById('pin-dots-row');
            const dots = [0, 1, 2, 3].map(i => document.getElementById('dot-' + i));
            const errorEl = document.getElementById('pin-error-msg');

            let currentPin = '';

            // Keep auth state for this browser session so protected sub-pages can open.
            const setAuthenticatedSession = () => {
                sessionStorage.setItem('isAuthenticated', 'true');
            };

            function updateDots() {
                dots.forEach((d, i) => { d.classList.toggle('filled', i < currentPin.length); d.classList.remove('error'); });
            }

            function showError(msg) {
                dots.forEach(d => d.classList.add('error'));
                dotsRow.classList.add('shake');
                if (errorEl) { errorEl.textContent = msg; errorEl.style.display = 'block'; }
                setTimeout(() => {
                    dotsRow.classList.remove('shake');
                    dots.forEach(d => d.classList.remove('error', 'filled'));
                    currentPin = ''; input.value = ''; updateDots();
                    if (errorEl) errorEl.style.display = 'none';
                }, 1400);
            }

            if (pinEnabled && appPin) {
                authContainer.style.display = 'flex';
                appContent.style.display = 'none';
                setTimeout(() => { input.focus({ preventScroll: true }); }, 300);
            } else {
                authContainer.style.display = 'none';
                appContent.style.display = 'flex';
                setAuthenticatedSession();
            }

            // Tap anywhere on auth screen to re-focus input (mobile)
            authContainer.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (input) input.focus({ preventScroll: true });
            });

            input.addEventListener('input', () => {
                input.value = input.value.replace(/\D/g, '').slice(0, 4);
                currentPin = input.value;
                updateDots();

                if (currentPin.length === 4) {
                    if (currentPin === appPin) {
                        authContainer.style.display = 'none';
                        appContent.style.display = 'flex';
                        setAuthenticatedSession();
                        currentPin = '';
                        input.value = '';
                        updateDots();
                    } else {
                        showError('Incorrect PIN. Try again.');
                    }
                }
            });

            // The rest of your existing DOMContentLoaded logic
            const loader = document.getElementById('loader');

            // ── Build infographic nodes ──
            const appData = [
                { id: 1, text: "Cashew",      href: "cashew/cashew.html", icon: "fa-seedling" },
                { id: 2, text: "Milk Bill",   href: "milk/milk.html", icon: "fa-cow" },
                { id: 3, text: "Rent",        href: "rent/tenet.html", icon: "fa-house" },
                { id: 4, text: "MSI",         href: "msi/msi.html", icon: "fa-chart-line" },
                { id: 5, text: "Debts",       href: "debts/debts.html", icon: "fa-file-invoice-dollar" },
                { id: 6, text: "Denoms",      href: "denomination/denominations.html", icon: "fa-coins" },
                { id: 7, text: "Calculators", href: "calculator/calculator.html", icon: "fa-calculator" },
                { id: 8, text: "Loan",        href: "loan/loan.html", icon: "fa-landmark" },
                { id: 9, text: "Scan",        href: "scan/scan.html", icon: "fa-qrcode" }
            ];

            const leftContainer  = document.getElementById('inf-left');
            const rightContainer = document.getElementById('inf-right');
            const sideNodesContainer = document.getElementById('side-nodes');
            const tempOrbitSystem = document.getElementById('temp-orbit-system');
            const tempSvgCanvas = document.getElementById('temp-svg-canvas');
            const tempActiveNodes = [];

            appData.forEach(item => {
                const node = document.createElement('a');
                node.className = 'inf-node';
                node.href = item.href;
                node.style.setProperty('--node-color', `var(--inf-color-${item.id})`);

                if (item.id <= 5) {
                    node.innerHTML = `<span class="inf-node-text">${item.text}</span><div class="inf-node-badge">${item.id}</div>`;
                    leftContainer.appendChild(node);
                } else {
                    node.innerHTML = `<div class="inf-node-badge">${item.id}</div><span class="inf-node-text">${item.text}</span>`;
                    rightContainer.appendChild(node);
                }

                const sideNode = document.createElement('a');
                sideNode.className = 'side-node-row';
                sideNode.href = item.href;
                sideNode.style.setProperty('--node-color', `var(--inf-color-${item.id})`);
                sideNode.innerHTML = `
                    <div class="side-arrow-pointer"></div>
                    <div class="side-capsule-pill">
                        <div class="side-icon-badge">${item.id}</div>
                        <span class="side-capsule-text">${item.text}</span>
                    </div>
                `;
                sideNodesContainer.appendChild(sideNode);

                const tempNode = document.createElement('a');
                tempNode.className = 'temp-icon-node';
                tempNode.href = item.href;
                tempNode.style.backgroundColor = `var(--inf-color-${item.id})`;
                tempNode.setAttribute('aria-label', item.text);
                tempNode.title = item.text;
                tempNode.innerHTML = `<i class="fa-solid ${item.icon}"></i><span class="temp-icon-label-top">${item.text}</span>`;
                tempOrbitSystem.appendChild(tempNode);

                const tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                tempLine.classList.add('temp-connecting-line');
                tempSvgCanvas.appendChild(tempLine);
                tempActiveNodes.push({ element: tempNode, line: tempLine });
            });

            function layoutTempNodes() {
                const tempTotal = tempActiveNodes.length || 1;
                const tempRadius = Math.min(270, tempSvgCanvas.clientWidth * 0.38);
                tempActiveNodes.forEach((item, index) => {
                    const angle = (index / tempTotal) * 2 * Math.PI;
                    const x = Math.cos(angle) * tempRadius;
                    const y = Math.sin(angle) * tempRadius;
                    item.element.style.transform = `translate(${x}px, ${y}px)`;
                });
            }
            layoutTempNodes();
            window.addEventListener('resize', layoutTempNodes);

            function animateTempLines() {
                const centerX = tempSvgCanvas.clientWidth / 2;
                const centerY = tempSvgCanvas.clientHeight / 2;

                tempActiveNodes.forEach(item => {
                    const rect = item.element.getBoundingClientRect();
                    const containerRect = tempSvgCanvas.getBoundingClientRect();
                    const currentX = (rect.left + rect.width / 2) - containerRect.left;
                    const currentY = (rect.top + rect.height / 2) - containerRect.top;
                    item.line.setAttribute('x1', centerX);
                    item.line.setAttribute('y1', centerY);
                    item.line.setAttribute('x2', currentX);
                    item.line.setAttribute('y2', currentY);
                });

                requestAnimationFrame(animateTempLines);
            }
            animateTempLines();

            // ── Navigate with loader ──
            const nodes = document.querySelectorAll('.inf-node, .side-node-row, .temp-icon-node, .bottom-nav-item');
            nodes.forEach(node => {
                node.addEventListener('click', e => {
                    const href = node.getAttribute('href');
                    if (href && href !== '#') {
                        e.preventDefault();
                        loader.classList.add('visible');
                        setTimeout(() => { window.location.href = href; }, 350);
                    }
                });
            });

            // Set active class for bottom navigation
            const bottomNavItems = document.querySelectorAll('.bottom-nav-item');
            const currentPath = window.location.pathname.split('/').pop(); // Get current page filename

            bottomNavItems.forEach(item => {
                if (item.getAttribute('href') === currentPath) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });


            // ── Canvas particles ──
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            const resize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
            window.addEventListener('resize', resize); resize();

            class P {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = (Math.random() - 0.5) * 0.4;
                    this.r = Math.random() * 1.5 + 0.5;
                }
                move() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > W) this.vx *= -1;
                    if (this.y < 0 || this.y > H) this.vy *= -1;
                }
                draw() {
                    ctx.fillStyle = 'rgba(255,255,255,0.18)';
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (let i = 0; i < 55; i++) particles.push(new P());

            (function loop() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach((p, i) => {
                    p.move(); p.draw();
                    for (let j = i + 1; j < particles.length; j++) {
                        const q = particles[j], dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy);
                        if (d < 140) {
                            ctx.strokeStyle = `rgba(255,255,255,${0.08 * (1 - d / 140)})`;
                            ctx.lineWidth = 0.8;
                            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
                        }
                    }
                });
                requestAnimationFrame(loop);
            })();
        });

        window.addEventListener('pageshow', () => {
            document.getElementById('loader')?.classList.remove('visible');
        });
    </script>
</body>
</html>
