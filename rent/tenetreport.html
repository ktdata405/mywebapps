<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Tenet Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../ktui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../config.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e1b4b, #0f172a);
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: var(--secondary); bottom: -50px; right: -50px; animation-delay: -5s; }
        .orb-3 { width: 200px; height: 200px; background: var(--accent); top: 40%; left: 60%; animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 50px); }
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .action-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            color: #64748b;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .action-btn.edit:hover {
            color: #818cf8;
            border-color: rgba(129, 140, 248, 0.5);
            background: rgba(99, 102, 241, 0.18);
            box-shadow: 0 0 10px rgba(99,102,241,0.2);
        }

        .action-btn.del:hover {
            color: #fb7185;
            border-color: rgba(251, 113, 133, 0.5);
            background: rgba(244, 63, 94, 0.15);
            box-shadow: 0 0 10px rgba(244,63,94,0.2);
        }

        /* Card accent bar */
        .card-kalyan { border-left: 3px solid #6366f1; }
        .card-srikanth { border-left: 3px solid #ec4899; }

        /* Accordion */
        .card-details {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease;
        }
        .card-details.open {
            max-height: 600px;
            opacity: 1;
        }
        .chevron-icon {
            transition: transform 0.3s ease;
        }
        .chevron-icon.open {
            transform: rotate(180deg);
        }

        footer {
            text-align: center;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255,255,255,0.05);
            color: var(--text-dim);
        }

        footer b {
            color: var(--text-light);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* ===== MOBILE RESPONSIVE IMPROVEMENTS ===== */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            box-sizing: border-box;
        }

        body {
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        button, a {
            touch-action: manipulation;
            min-height: 44px;
            min-width: 44px;
        }

        /* Summary bar safe area */
        #summary-bar {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Mobile layout fixes */
        @media (max-width: 640px) {
            body {
                padding: 0.5rem !important;
                padding-top: env(safe-area-inset-top) !important;
            }

            /* Header - sticky at top */
            .header-card {
                position: sticky;
                top: 0;
                z-index: 20;
                border-radius: 0 0 0.75rem 0.75rem !important;
                margin-left: -0.5rem;
                margin-right: -0.5rem;
                padding: 0.75rem 0.875rem !important;
            }

            /* Title smaller on mobile */
            h5.text-xl { font-size: 1rem !important; }

            /* Filter select */
            select {
                font-size: 16px !important;
                min-height: 44px;
            }

            /* Detail cards grid - 2 cols on mobile */
            .grid.grid-cols-2.sm\\:grid-cols-3 {
                grid-template-columns: 1fr 1fr !important;
            }

            /* Summary bar content */
            #summary-bar .relative {
                padding: 0.75rem 1rem;
            }

            #total-collected-value {
                font-size: 1.5rem !important;
            }

            /* Report container list spacing on mobile */
            #report-container {
                gap: 0.75rem !important;
            }

            /* Bottom padding to account for summary bar */
            .max-w-4xl.mx-auto {
                padding-bottom: 5rem;
            }
        }

        /* iOS input zoom prevention */
        input, select, textarea {
            font-size: 16px !important;
        }

        /* Momentum scrolling */
        #report-container {
            -webkit-overflow-scrolling: touch;
        }

        /* Edit button touch target */
        button.text-gray-400.hover\\:text-blue-400.transition.p-2.rounded-full {
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== MOBILE ENHANCEMENTS ===== */
        .kt-toast {
            position: fixed;
            bottom: calc(5rem + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            color: #f8fafc;
            padding: 0.75rem 1.25rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            z-index: 9999;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
            opacity: 0;
            white-space: nowrap;
            max-width: 90vw;
        }
        .kt-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .kt-toast.success { border-color: rgba(16,185,129,0.5); }
        .kt-toast.error { border-color: rgba(239,68,68,0.5); }

        .ptr-indicator {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 0.5rem);
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 100;
            transition: transform 0.3s ease;
            pointer-events: none;
        }
        .ptr-indicator.visible { transform: translateX(-50%) translateY(0); }
        .ptr-indicator.refreshing .ptr-icon { animation: ptr-spin 1s linear infinite; }
        @keyframes ptr-spin { to { transform: rotate(360deg); } }

        .kt-fab {
            position: fixed;
            bottom: calc(5rem + env(safe-area-inset-bottom));
            right: max(1.25rem, env(safe-area-inset-right));
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 8px 25px rgba(16,185,129,0.35);
            cursor: pointer;
            z-index: 40;
            transition: transform 0.2s ease;
            text-decoration: none;
        }
        .kt-fab:active { transform: scale(0.9); }
        @media (min-width: 768px) { .kt-fab { display: none; } }

        .refresh-spinning {
            animation: spin 0.85s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }

        /* Swipe hint on first load */
        @media (max-width: 640px) {
            .accordion-hint {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                color: #4b5563;
                font-size: 0.7rem;
                padding: 0.5rem;
                text-align: center;
            }
        }
        @media (min-width: 641px) {
            .accordion-hint { display: none; }
        }
    </style>
</head>

<body class="p-3 md:p-10 pb-32" style="padding-bottom: calc(8rem + env(safe-area-inset-bottom));">

<div class="bg-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="header-card glass-card flex flex-col sm:flex-row justify-between items-center mb-4 sm:mb-6 p-3 sm:p-4 rounded-xl sticky top-0 z-10 gap-3">
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <h5 class="text-base sm:text-xl font-bold flex items-center gap-2 text-white">
                <i class="fa-solid fa-chart-pie text-emerald-400"></i> <span>Tenet Report</span>
            </h5>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
            <!-- Filter -->
            <div class="relative flex-1 sm:flex-none">
                <select id="sideFilter" onchange="handleFilterChange()" class="bg-white/10 border border-white/20 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 sm:p-2.5 outline-none appearance-none pr-8 cursor-pointer" style="font-size: 16px; min-height: 44px;">
                    <option value="All" class="bg-slate-800">All Sides</option>
                    <option value="Kalyan" class="bg-slate-800">Kalyan</option>

                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">

            <div class="flex gap-2">
                <button id="refresh-btn" onclick="fetchData()" class="bg-blue-500/20 hover:bg-blue-500/30 active:bg-blue-500/50 text-blue-300 border border-blue-500/30 w-11 h-11 rounded-full transition flex items-center justify-center shadow-sm" title="Refresh" aria-label="Refresh report data">
                    <i id="refresh-icon" class="fa-solid fa-sync"></i>
                </button>
                <a href="tenet.html" class="bg-white/10 hover:bg-white/20 active:bg-white/30 text-white w-11 h-11 rounded-full transition flex items-center justify-center" title="Add New">
                    <i class="fa-solid fa-plus"></i>

                <a href="../index.html" class="bg-white/10 hover:bg-white/20 active:bg-white/30 text-white w-11 h-11 rounded-full transition flex items-center justify-center" title="Home">
                    <i class="fa-solid fa-house"></i>

                <a href="../settings.html" class="bg-white/10 hover:bg-white/20 active:bg-white/30 text-white w-11 h-11 rounded-full transition flex items-center justify-center" title="Settings" aria-label="Settings">
                    <i class="fa-solid fa-gear"></i>

            </div>
        </div>

    </div>

    <div id="loader" class="flex justify-center items-center py-20">
        <div class="animate-spin">
            <i class="fa-solid fa-circle-notch text-4xl text-emerald-400"></i>
        </div>
    </div>

    <div id="report-container" class="flex flex-col gap-3 hidden">
        <!-- List items will be inserted here -->
    </div>

    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-gray-500">
        <i class="fa-solid fa-clipboard-list text-6xl mb-4 text-gray-700"></i>
        <p class="text-xl">No records found</p>
    </div>
</div>

<!-- Bottom Summary Bar -->
<div id="summary-bar" class="fixed bottom-0 left-0 w-full z-50 transform translate-y-full transition-transform duration-500 ease-out">
    <div class="absolute inset-0 bg-[#0f172a]/90 backdrop-blur-xl border-t border-white/10 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]"></div>
    <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-indigo-500 to-transparent opacity-50"></div>

    <div class="relative max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">

            <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-0.5">Total Collected</p>
            <h2 id="total-collected-value" class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 filter drop-shadow-lg">₹0</h2>
        </div>

        <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
                <p class="text-[10px] text-gray-500 font-medium">Net Revenue</p>
                <p class="text-xs text-emerald-400 font-bold">Verified <i class="fa-solid fa-circle-check ml-1"></i></p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 ring-1 ring-white/10">
                <i class="fa-solid fa-wallet text-white text-lg"></i>
            </div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = CONFIG.GOOGLE_SHEET_URL_RENT;
    let allRecords = [];
    let isFetching = false;

    function formatDate(dateString) {
        if (!dateString) return '';
        let date;
        if (dateString instanceof Date) {
            date = dateString;
        } else {
            // Handle DD/MMM/YYYY or YYYY-MM-DD
            if (typeof dateString === 'string' && (dateString.includes('/') || dateString.includes('-'))) {
                const separator = dateString.includes('/') ? '/' : '-';
                const parts = dateString.split(separator);
                if (parts.length === 3) {
                    if (isNaN(parts[1])) {
                        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                        const monthIndex = months.findIndex(m => m.toLowerCase() === parts[1].toLowerCase());
                        if (monthIndex !== -1) {
                            date = new Date(parts[2], monthIndex, parts[0]);
                        }
                    }
                }
            }
            if (!date) date = new Date(dateString);
        }

        if (isNaN(date.getTime())) return dateString;

        const day = String(date.getDate()).padStart(2, '0');
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const month = months[date.getMonth()];
        const year = date.getFullYear();

        return `${day} ${month} ${year}`;
    }

    function parseDate(dateString) {
        if (!dateString) return new Date(0);
        let date;
        if (dateString instanceof Date) {
            date = dateString;
        } else {
            // Handle DD/MMM/YYYY or YYYY-MM-DD
            if (typeof dateString === 'string' && (dateString.includes('/') || dateString.includes('-'))) {
                const separator = dateString.includes('/') ? '/' : '-';
                const parts = dateString.split(separator);
                if (parts.length === 3) {
                    if (isNaN(parts[1])) {
                        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                        const monthIndex = months.findIndex(m => m.toLowerCase() === parts[1].toLowerCase());
                        if (monthIndex !== -1) {
                            date = new Date(parts[2], monthIndex, parts[0]);
                        }
                    }
                }
            }
            if (!date) date = new Date(dateString);
        }
        return isNaN(date.getTime()) ? new Date(0) : date;
    }

    function formatCurrency(amount) {
        const num = parseFloat(amount);
        if (isNaN(num)) return amount || '₹0';

        return new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            maximumFractionDigits: 0
        }).format(num);
    }

    const fieldMeta = {
        'Date':         { icon: 'fa-calendar-days',   bg: 'bg-slate-500/10',   border: 'border-slate-500/20' },
        'Rent Amount':  { icon: 'fa-house',            bg: 'bg-indigo-500/10',  border: 'border-indigo-500/20' },
        'Paid Amount':  { icon: 'fa-circle-check',     bg: 'bg-emerald-500/10', border: 'border-emerald-500/20' },
        'Balance':      { icon: 'fa-triangle-exclamation', bg: 'bg-rose-500/10',  border: 'border-rose-500/20' },
        'Power Bill':   { icon: 'fa-bolt',             bg: 'bg-yellow-500/10',  border: 'border-yellow-500/20' },
        'Water Bill':   { icon: 'fa-droplet',          bg: 'bg-blue-500/10',    border: 'border-blue-500/20' },
    };

    function createDetailField(field) {
        const meta = fieldMeta[field.label] || { icon: 'fa-circle-info', bg: 'bg-white/5', border: 'border-white/10' };
        const item = document.createElement('div');
        item.className = `${meta.bg} p-3 rounded-xl border ${meta.border} flex flex-col gap-1.5 transition hover:brightness-110`;

        const label = document.createElement('div');
        label.className = 'detail-icon-label text-[10px] text-gray-400 uppercase font-bold tracking-wider';
        label.innerHTML = `<i class="fa-solid ${meta.icon} text-[9px] opacity-70"></i> ${field.label}`;

        const value = document.createElement('div');
        value.className = `font-bold text-sm ${field.color}`;
        value.textContent = field.label === 'Date' ? field.value : formatCurrency(field.value);

        item.appendChild(label);
        item.appendChild(value);
        return item;
    }

    function renderSkeletonRows() {
        const container = document.getElementById('report-container');
        container.innerHTML = '';
        container.classList.remove('hidden');
        for (let i = 0; i < 4; i++) {
            const card = document.createElement('div');
            card.className = 'glass-card rounded-2xl p-4 flex flex-col gap-3';
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="skeleton w-10 h-10 rounded-2xl"></div>
                        <div>
                            <div class="skeleton h-4 w-24 mb-1.5"></div>
                            <div class="skeleton h-3 w-14"></div>
                        </div>
                    </div>
                    <div class="skeleton h-7 w-7 rounded-lg"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="skeleton h-14 rounded-xl"></div>
                    <div class="skeleton h-14 rounded-xl"></div>
                    <div class="skeleton h-14 rounded-xl"></div>
                    <div class="skeleton h-14 rounded-xl"></div>
                    <div class="skeleton h-14 rounded-xl"></div>
                    <div class="skeleton h-14 rounded-xl"></div>
                </div>
                <div class="skeleton h-14 rounded-xl"></div>
            `;
            container.appendChild(card);
        }
    }

    function applyFiltersAndRender() {
        const container = document.getElementById('report-container');
        const emptyState = document.getElementById('empty-state');
        const summaryBar = document.getElementById('summary-bar');
        const totalValue = document.getElementById('total-collected-value');
        const sideFilter = document.getElementById('sideFilter').value;

        let displayRecords = [...allRecords];
        if (sideFilter !== 'All') {
            displayRecords = displayRecords.filter((r) => r.side === sideFilter);
        }

        displayRecords.sort((a, b) => parseDate(b.date) - parseDate(a.date));
        container.innerHTML = '';

        if (!displayRecords.length) {
            container.classList.add('hidden');
            emptyState.classList.remove('hidden');
            summaryBar.classList.add('translate-y-full');
            return;
        }

        emptyState.classList.add('hidden');
        container.classList.remove('hidden');
        displayRecords.forEach((item) => container.appendChild(createListItem(item)));

        const total = displayRecords.reduce((sum, record) => sum + (parseFloat(record.totalPaid) || 0), 0);
        totalValue.textContent = formatCurrency(total);
        setTimeout(() => summaryBar.classList.remove('translate-y-full'), 100);
    }

    function setRefreshState(isLoading) {
        const refreshBtn = document.getElementById('refresh-btn');
        const refreshIcon = document.getElementById('refresh-icon');
        if (!refreshBtn || !refreshIcon) return;
        refreshBtn.disabled = isLoading;
        refreshBtn.classList.toggle('opacity-60', isLoading);
        refreshBtn.classList.toggle('cursor-not-allowed', isLoading);
        refreshIcon.classList.toggle('refresh-spinning', isLoading);
    }

    function handleFilterChange() {
        localStorage.setItem('rentTenetReportSideFilter', document.getElementById('sideFilter').value);
        applyFiltersAndRender();
    }

    async function sendRentAction(action, payload) {
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...payload })
            });
            return await response.json();
        } catch (error) {
            return { result: 'error', error: error.message || 'Request failed' };
        }
    }

    async function deleteTenetRecord(record) {
        const confirmed = await new Promise((resolve) => {
            KTui.confirm(
                'Delete Record',
                'Are you sure you want to delete this record? This cannot be undone.',
                () => resolve(true),
                { confirmText: 'Delete', cancelText: 'Cancel', danger: true }
            );
            const cancelBtn = document.querySelector('#__ktui_btns__ .ktui-btn-cancel');
            if (cancelBtn) {
                cancelBtn.onclick = () => {
                    KTui.close();
                    resolve(false);
                };
            }
        });

        if (!confirmed) return;

        setRefreshState(true);
        const result = await sendRentAction('delete', {
            originalDate: record.date,
            originalSide: record.side
        });
        setRefreshState(false);

        if (result && result.result === 'success') {
            KTui.toast('Record deleted', 'success');
            fetchData();
        } else {
            KTui.toast((result && (result.error || result.message)) || 'Delete failed', 'error');
        }
    }

    function createListItem(data) {
        const isKalyan = data.side === 'Kalyan';
        const sideClass      = isKalyan ? 'card-kalyan'                                                        : 'card-srikanth';
        const sideIconColor  = isKalyan ? 'text-indigo-400 bg-indigo-500/15 border-indigo-500/30'             : 'text-pink-400 bg-pink-500/15 border-pink-500/30';
        const sideIcon       = isKalyan ? 'fa-user'                                                           : 'fa-user-group';
        const sideBadge      = isKalyan
            ? `<span class="text-[10px] font-bold tracking-wide px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/25">Kalyan</span>`
            : `<span class="text-[10px] font-bold tracking-wide px-2 py-0.5 rounded-full bg-pink-500/20 text-pink-300 border border-pink-500/25">Srikanth</span>`;
        const gradFrom = isKalyan ? 'from-indigo-900/40' : 'from-pink-900/40';
        const gradTo   = isKalyan ? 'to-purple-900/30'   : 'to-rose-900/30';
        const totalBorder = isKalyan ? 'border-indigo-500/25' : 'border-pink-500/25';
        const iconBg   = isKalyan ? 'bg-indigo-500/20 text-indigo-300' : 'bg-pink-500/20 text-pink-300';

        const fields = [
            { label: 'Rent Amount', value: data.rentAmount,    color: 'text-indigo-300' },
            { label: 'Paid Amount', value: data.paidAmount,    color: 'text-emerald-300' },
            { label: 'Balance',     value: data.balanceAmount, color: 'text-rose-300' },
            { label: 'Power Bill',  value: data.powerBill,     color: 'text-yellow-300' },
            { label: 'Water Bill',  value: data.waterBill,     color: 'text-blue-300' },
            { label: 'Date',        value: formatDate(data.date), color: 'text-slate-200' },
        ];

        const fieldsHtml = fields.map(f => {
            const meta = fieldMeta[f.label] || { icon: 'fa-circle-info', bg: 'bg-white/5', border: 'border-white/10' };
            const displayVal = f.label === 'Date' ? f.value : formatCurrency(f.value);
            return `
                <div class="${meta.bg} p-2.5 rounded-xl border ${meta.border} flex flex-col gap-1">
                    <div class="flex items-center gap-1 text-[9px] text-gray-400 uppercase font-bold tracking-wider">
                        <i class="fa-solid ${meta.icon} opacity-60"></i> ${f.label}
                    </div>
                    <div class="font-bold text-sm ${f.color} leading-tight">${displayVal}</div>
                </div>`;
        }).join('');

        let remarksHtml = '';
        const remarksText = data.remarks ? String(data.remarks).trim() : '';
        if (remarksText && remarksText !== '-') {
            remarksHtml = `
                <div class="bg-amber-500/5 px-3 py-2.5 rounded-xl border border-amber-500/15 flex gap-2 items-start">
                    <i class="fa-solid fa-comment-dots text-amber-400/60 mt-0.5 text-xs shrink-0"></i>
                    <span class="text-gray-300 text-xs leading-relaxed">${remarksText}</span>
                </div>`;
        }

        const card = document.createElement('div');
        card.className = `glass-card rounded-2xl overflow-hidden flex flex-col ${sideClass}`;
        card.innerHTML = `
            <!-- Card Header (always visible) -->
            <div class="p-4 flex items-center justify-between cursor-pointer select-none hover:bg-white/5 active:bg-white/10 transition-colors" data-toggle>
                <div class="flex items-center gap-3 min-w-0">
                    <div class="${sideIconColor} w-10 h-10 rounded-2xl flex items-center justify-center border shrink-0 shadow-sm">
                        <i class="fa-solid ${sideIcon} text-sm"></i>
                    </div>
                    <div class="min-w-0">
                        <div class="font-bold text-white text-sm leading-tight">${formatDate(data.date)}</div>
                        <div class="mt-0.5 flex items-center gap-1.5">${sideBadge}<span class="text-emerald-400 font-black text-sm tabular-nums">${formatCurrency(data.totalPaid)}</span></div>
                    </div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <button class="action-btn edit" title="Edit" aria-label="Edit record" data-edit>
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button class="action-btn del" title="Delete" aria-label="Delete record" data-del>
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <div class="w-7 h-7 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center ml-0.5">
                        <i class="fa-solid fa-chevron-down text-gray-500 text-xs chevron-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Collapsible Details -->
            <div class="card-details">
                <div class="border-t border-white/7 mx-4"></div>
                <!-- Detail Fields Grid -->
                <div class="px-4 pt-3 pb-3">
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        ${fieldsHtml}
                    </div>
                </div>

                ${remarksHtml ? `<div class="px-4 pb-3">${remarksHtml}</div>` : ''}

                <!-- Total Paid Footer -->
                <div class="mx-4 mb-4 p-3.5 rounded-xl bg-gradient-to-r ${gradFrom} ${gradTo} border ${totalBorder} flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-xl ${iconBg} flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-sack-dollar"></i>
                        </div>
                        <div>
                            <p class="text-[9px] uppercase tracking-widest text-gray-400 font-bold">Total Paid</p>
                            <div class="text-xl font-black text-white tabular-nums leading-tight">${formatCurrency(data.totalPaid)}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 text-emerald-400 text-[11px] font-semibold bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-full">
                        <i class="fa-solid fa-circle-check text-[9px]"></i> Paid
                    </div>
                </div>
            </div>
        `;

        // Toggle accordion (exclusive open)
        const toggleHeader = card.querySelector('[data-toggle]');
        const detailsPanel = card.querySelector('.card-details');
        const chevron = card.querySelector('.chevron-icon');
        toggleHeader.addEventListener('click', (e) => {
            if (e.target.closest('[data-edit]') || e.target.closest('[data-del]')) return;

            const container = document.getElementById('report-container');
            const isOpen = detailsPanel.classList.contains('open');

            // Close any other open card first
            container.querySelectorAll('.card-details.open').forEach((panel) => {
                if (panel === detailsPanel) return;
                panel.classList.remove('open');
                const otherChevron = panel.closest('.glass-card')?.querySelector('.chevron-icon');
                if (otherChevron) otherChevron.classList.remove('open');
            });

            detailsPanel.classList.toggle('open', !isOpen);
            chevron.classList.toggle('open', !isOpen);
        });

        card.querySelector('[data-edit]').onclick = (e) => {
            e.stopPropagation();
            sessionStorage.setItem('tenetEditData', JSON.stringify(data));
            window.location.href = 'tenet.html';
        };
        card.querySelector('[data-del]').onclick = (e) => {
            e.stopPropagation();
            deleteTenetRecord(data);
        };

        return card;
    }

    function fetchData() {
        if (isFetching) return;
        isFetching = true;

        const loader = document.getElementById('loader');
        const container = document.getElementById('report-container');
        const emptyState = document.getElementById('empty-state');
        const summaryBar = document.getElementById('summary-bar');

        loader.classList.remove('hidden');
        emptyState.classList.add('hidden');
        setRefreshState(true);
        renderSkeletonRows();

        if (summaryBar) summaryBar.classList.add('translate-y-full');

        fetch(SCRIPT_URL)
            .then((response) => response.json())
            .then((responsePayload) => {
                loader.classList.add('hidden');
                allRecords = responsePayload.data || [];
                applyFiltersAndRender();
            })
            .catch((error) => {
                console.error('Error fetching data:', error);
                loader.classList.add('hidden');
                container.classList.add('hidden');
                emptyState.innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation text-6xl mb-4 text-red-400"></i>
                    <p class="text-xl text-red-300">Error loading reports</p>
                    <p class="text-sm text-gray-400 mt-2">${error.message}</p>
                `;
                emptyState.classList.remove('hidden');
            })
            .finally(() => {
                isFetching = false;
                setRefreshState(false);
            });
    }

    function restorePersistedFilters() {
        const sideFilter = localStorage.getItem('rentTenetReportSideFilter');
        if (!sideFilter) return;
        const select = document.getElementById('sideFilter');
        const hasOption = Array.from(select.options).some((option) => option.value === sideFilter);
        if (hasOption) select.value = sideFilter;
    }

    document.addEventListener('DOMContentLoaded', () => {
        restorePersistedFilters();


        fetchData();
    });

    // ===== MOBILE ENHANCEMENTS =====
    function showToast(msg, type = 'success', duration = 2800) {
        KTui.toast(msg, type);
    }

    (function initPTR() {
        const ptr = document.createElement('div');
        ptr.className = 'ptr-indicator';
        ptr.innerHTML = '<i class="fa-solid fa-arrows-rotate ptr-icon"></i><span class="ptr-text">Pull to refresh</span>';
        document.body.appendChild(ptr);
        let startY = 0, pulling = false, threshold = 80;
        document.addEventListener('touchstart', e => {
            if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; }
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            if (!pulling) return;
            const dy = e.touches[0].clientY - startY;
            if (dy > 30) { ptr.classList.add('visible'); ptr.querySelector('.ptr-text').textContent = dy > threshold ? 'Release to refresh' : 'Pull to refresh'; }
        }, { passive: true });
        document.addEventListener('touchend', e => {
            if (!pulling) return;
            pulling = false;
            const dy = e.changedTouches[0].clientY - startY;
            if (dy > threshold) {
                ptr.classList.add('refreshing');
                ptr.querySelector('.ptr-text').textContent = 'Refreshing…';
                if (navigator.vibrate) navigator.vibrate(30);
                fetchData();
                setTimeout(() => { ptr.classList.remove('visible', 'refreshing'); }, 1200);
            } else { ptr.classList.remove('visible'); }
        }, { passive: true });
    })();
</script>
